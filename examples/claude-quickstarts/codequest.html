ed; the chat goes on without context","state":"error"}],"note":"The error is logged and swallowed; the user sees nothing about it."}}],"cases":[{"id":"c1","name":"Good match","input":"query 'refund policy', id 'KB123', Bedrock returns 3 chunks","path":["s1","s2","s3","s4"],"outcome":"ready","explain":"All 3 chunk texts go into the prompt; the right sidebar only ever sees the first.","brief":"A search for the refund policy runs against a working knowledge base.","facts":["knowledge base: KB123","search service answers","3 pieces of text found"]},{"id":"c2","name":"No id","input":"knowledgeBaseId ''","path":["s1"],"outcome":"no-kb","explain":"Returns isRagWorking false, so the prompt says 'No information found for this query.'","brief":"A question arrives with no knowledge base picked.","facts":["knowledge base id: empty","question still sent"]},{"id":"c3","name":"Wrong AWS keys","input":"BAWS_SECRET_ACCESS_KEY is wrong","path":["s1","s2"],"outcome":"rag-down","explain":"The send throws, the catch returns an empty result. The chat still goes on without context.","brief":"A search runs with a wrong cloud secret key.","facts":["knowledge base: KB123","secret key is wrong"]},{"id":"c4","name":"Nothing found","input":"query 'zzzz', Bedrock returns 0 results","path":["s1","s2","s3"],"outcome":"empty-ok","explain":"isRagWorking stays true, so the prompt pastes an empty string instead of 'No information found'.","brief":"A search for nonsense text runs against a working knowledge base.","facts":["knowledge base: KB123","search service answers","0 results found"]}]}],"quests":[{"id":"q1","type":"quiz","title":"The opening brace","prompt":"Right before calling Claude, what does the route add to the end of the message list?","options":["A user message saying 'Reply in JSON'","An assistant message containing just '{'","The knowledge base text","Nothing, it sends the messages as they are"],"answer":1,"explain":"It pushes { role: 'assistant', content: '{' } so Claude continues straight into JSON, then glues '{' back on before parsing.","xp":20},{"id":"q2","type":"predict","title":"An angry mood","target":"answer-question/c3","prompt":"Claude replies with user_mood: \"angry\". What happens?","options":["Answer sent back (200)","Answer with hand-off to human (200)","Sorry message with status 500"],"answer":2,"explain":"The Zod schema only allows positive, neutral, negative, curious, frustrated, confused. The parse throws and the catch returns 500.","xp":25},{"id":"q3","type":"predict","title":"When the server fails","target":"show-reply/c3","prompt":"The route returns status 500 with a friendly sorry message. What does the user see?","options":["Answer and suggested questions shown","'Talk to a human' button shown","'Something went wrong' after 30s"],"answer":2,"explain":"The browser throws on !response.ok and never reads the body. The empty placeholder spins until the 30s timer fires.","xp":25},{"id":"q4","type":"quiz","title":"Three in, one out","prompt":"With a good match, how many knowledge chunks reach Claude's prompt, and how many show in the sources sidebar?","options":["1 and 1","3 and 3","3 and 1","Up to 10 and 3"],"answer":2,"explain":"Bedrock is asked for 3 results and all go into the context, but ragSources is cut with .slice(0, 1).","xp":20},{"id":"q5","type":"quiz","title":"Who calls for a human?","prompt":"Who decides that the user should be handed to a human agent?","options":["A keyword check in the route for words like 'human'","Claude, by setting redirect_to_agent.should_redirect in its JSON","The sources sidebar, when the match score is below 40%","The mood: any 'frustrated' user is redirected"],"answer":1,"explain":"There is no code rule. The system prompt tells Claude when to redirect, and the code only reacts to its should_redirect field.","xp":20},{"id":"q6","type":"predict","title":"Searching for nothing","target":"kb-search/c4","prompt":"Bedrock finds 0 results for the query. How does the search end?","options":["Context ready (up to 3 chunks, 1 source)","Empty context but marked as working","Skipped: no knowledge base id","Search failed, empty context"],"answer":1,"explain":"No error is thrown, so isRagWorking stays true and the prompt gets an empty string instead of 'No information found'.","xp":25},{"id":"q7","type":"quiz","title":"Category tags","prompt":"What part of the categories JSON is actually sent to Claude?","options":["Only the category ids, joined by commas","Ids and all keywords","Ids, names and keywords as JSON","Nothing; categories are matched in code"],"answer":0,"explain":"categoryListString maps each category to c.id and joins them. Keywords are never used.","xp":20},{"id":"q8","type":"trace","title":"Follow a question","target":"answer-question","prompt":"Watch one question travel from the route through search, Claude and the shape check.","xp":10}],"cracks":[{"id":"k1","at":"redirect-rule","severity":"high","title":"'Talk to a human' leads nowhere","hint":"After the button fires its event, who is listening?","finding":"The button dispatches 'humanAgentRequested' and the chat dispatches 'agentRedirectRequested', but no code in the app listens to either. A user who needs a person gets a button that only logs to the console.","suggestion":"Add a listener that opens a real hand-off (ticket, live chat, email form) and tell the user what happens next.","decoys":["The button text is too small to read","The redirect reason is not shown in the left sidebar","should_redirect is checked twice, once on the server and once in the browser"],"source":{"file":"customer-support-agent/components/ChatArea.tsx","lines":[63,78],"anchor":"const event = new CustomEvent(\"humanAgentRequested\", {","snippet":"  if (redirectToAgent.should_redirect) {\n    return (\n      \u003cButton\n        size=\"sm\"\n        className=\"mt-2 flex items-center space-x-2\"\n        onClick={() => {\n          console.log(\"🔥 Human Agent Connection Requested!\", redirectToAgent);\n          const event = new CustomEvent(\"humanAgentRequested\", {\n            detail: {\n              reason: redirectToAgent.reason || \"Unknown\",\n              mood: \"frustrated\",\n              timestamp: new Date().toISOString(),\n            },\n          });\n          window.dispatchEvent(event);\n        }}","fileHash":"4a441423165a819893ac69afa1774cf320b67c42"}},{"id":"k2","at":"message-view","severity":"medium","title":"Errors hide behind a 30 second spinner","hint":"The server sends a polite sorry message on failure. Does the browser read it?","finding":"On a 500 the browser throws before reading the body, so the placeholder is never replaced. The user stares at 'Thinking...' for 30 seconds before 'Something went wrong' appears.","suggestion":"On !response.ok, read the JSON body and replace the placeholder right away with its response text.","decoys":["The 30 second timer is cleared too early","JSON.parse of the placeholder fails","The spinner uses the wrong color"],"source":{"file":"customer-support-agent/components/ChatArea.tsx","lines":[463,465],"anchor":"throw new Error(`API request failed with status ${response.status}`);","snippet":"      if (!response.ok) {\n        throw new Error(`API request failed with status ${response.status}`);\n      }","fileHash":"4a441423165a819893ac69afa1774cf320b67c42"}},{"id":"k3","at":"chat-route","severity":"high","title":"Browser picks the model and knowledge base","hint":"Where do 'model' and 'knowledgeBaseId' come from, and who checks them?","finding":"The route takes model and knowledgeBaseId straight from the request body with no allowlist or input check. Anyone can call /api/chat with the most costly model or any knowledge base the AWS keys can reach. An empty messages array even crashes before the try block.","suggestion":"Validate the body with Zod and only accept model and KB ids from a server-side allowlist.","decoys":["The API key is read on every request","temperature 0.3 is too low","max_tokens should be 4000"],"source":{"file":"customer-support-agent/app/api/chat/route.ts","lines":[69,70],"anchor":"const { messages, model, knowledgeBaseId } = await req.json();","snippet":"  const { messages, model, knowledgeBaseId } = await req.json();\n  const latestMessage = messages[messages.length - 1].content;","fileHash":"033f03aa6a1f2db19caf56e3a610d370f48c17e3"}},{"id":"k4","at":"retrieval-limits","severity":"low","title":"Empty search counts as success","hint":"What does isRagWorking say when Bedrock found nothing?","finding":"When Bedrock returns zero chunks, retrieveContext still returns isRagWorking: true with an empty context. The prompt then pastes an empty block instead of 'No information found', which makes it less clear to Claude that it has nothing to go on.","suggestion":"Set isRagWorking to false (or say 'No information found') when no chunk has text.","decoys":["n = 3 should be 10","The file name loses its '.txt' ending","The region us-east-1 is hard-coded"],"source":{"file":"customer-support-agent/app/lib/utils.ts","lines":[81,90],"anchor":"isRagWorking: true,","snippet":"    const context = rawResults\n      .filter((res: any) => res.content && res.content.text)\n      .map((res: any) => res.content.text)\n      .join(\"\\n\\n\");\n\n    return {\n      context,\n      isRagWorking: true,\n      ragSources,\n    };","fileHash":"2aa4f540c61fd1d0d5daab67d6706f68f9502315"}}]},{"id":"chart-observatory","name":"financial-data-analyst","theme":"crystal","tagline":"Drop in a spreadsheet, ask a question, watch Claude draw the chart","summary":"A Next.js app where you chat with Claude about financial data. You can attach a CSV, text file, PDF or image; the browser turns it into text or base64 and puts it inside your chat message. One server route sends the chat to Claude with a single tool, generate_graph_data. If Claude uses the tool, the server cleans up the chart data and the right-hand panel draws it as a bar, line, area or pie chart.","paths":["financial-data-analyst/app/page.tsx","financial-data-analyst/app/finance/page.tsx","financial-data-analyst/app/api/finance/route.ts","financial-data-analyst/components/ChartRenderer.tsx","financial-data-analyst/components/FilePreview.tsx","financial-data-analyst/utils/fileHandling.ts","financial-data-analyst/types/chart.ts"],"districts":[{"id":"upload","name":"Upload Bay"},{"id":"chat","name":"Chat Deck"},{"id":"server","name":"Server Route"},{"id":"claude","name":"Claude's Tower"},{"id":"display","name":"Observatory Dome"}],"entities":[{"id":"upload-gate","kind":"guardrail","name":"File type sorter","district":"upload","summary":"Runs when you pick a file. It sorts the file into image, PDF or 'try it as text', and shows an error toast if reading fails.","details":"- Images (type starts with image/) are kept as base64\n- PDFs (application/pdf) have their text pulled out with pdf.js\n- Everything else is read as plain text; an empty result is rejected\n- Text and PDF results are packed with btoa(encodeURIComponent(text)) and marked isText\n- There is no size limit and no allowlist of extensions","source":[{"file":"financial-data-analyst/app/finance/page.tsx","lines":[282,369],"anchor":"const handleFileSelect = async (e: React.ChangeEvent\u003cHTMLInputElement>) => {","snippet":"  const handleFileSelect = async (e: React.ChangeEvent\u003cHTMLInputElement>) => {\n    const file = e.target.files?.[0];\n    if (!file) return;\n\n    setIsUploading(true);\n\n    // Create a ref to store the toast handlers\n    let loadingToastRef: { dismiss: () => void } | undefined;\n\n    if (file.type === \"application/pdf\") {\n      loadingToastRef = toast({\n        title: \"Processing PDF\",\n        description: \"Extracting text content...\",\n        duration: Infinity, // This will keep the toast until we dismiss it\n      });\n    }\n\n    try {\n      const isImage = file.type.startsWith(\"image/\");\n      const isPDF = file.type === \"application/pdf\";\n      let base64Data = \"\";\n      let isText = false;\n\n      if (isImage) {\n        base64Data = await readFileAsBase64(file);\n        isText = false;\n      } else if (isPDF) {\n        try {\n          const pdfText = await readFileAsPDFText(file);\n          base64Data = btoa(encodeURIComponent(pdfText));\n          isText = true;\n        } catch (error) {\n          console.error(\"Failed to parse PDF:\", error);\n          toast({\n            title: \"PDF parsing failed\",\n            description: \"Unable to extract text from the PDF\",\n            variant: \"destructive\",\n          });\n          return;\n        }\n      } else {\n        try {\n          const textContent = await readFileAsText(file);\n          base64Data = btoa(encodeURIComponent(textContent));\n          isText = true;\n        } catch (error) {\n          console.error(\"Failed to read as text:\", error);\n          toast({\n            title: \"Invalid file type\",\n            description: \"File must be readable as text, PDF, or be an image\",\n            variant: \"destructive\",\n          });\n          return;\n        }\n      }\n\n      setCurrentUpload({\n        base64: base64Data,\n        fileName: file.name,\n        mediaType: isText ? \"text/plain\" : file.type,","snippetCut":true,"fileHash":"0f61a9d7ef81fa4be0029c3fc98ed2efafd8f381"},{"file":"financial-data-analyst/app/finance/page.tsx","lines":[299,336],"anchor":"const isPDF = file.type === \"application/pdf\";","snippet":"    try {\n      const isImage = file.type.startsWith(\"image/\");\n      const isPDF = file.type === \"application/pdf\";\n      let base64Data = \"\";\n      let isText = false;\n\n      if (isImage) {\n        base64Data = await readFileAsBase64(file);\n        isText = false;\n      } else if (isPDF) {\n        try {\n          const pdfText = await readFileAsPDFText(file);\n          base64Data = btoa(encodeURIComponent(pdfText));\n          isText = true;\n        } catch (error) {\n          console.error(\"Failed to parse PDF:\", error);\n          toast({\n            title: \"PDF parsing failed\",\n            description: \"Unable to extract text from the PDF\",\n            variant: \"destructive\",\n          });\n          return;\n        }\n      } else {\n        try {\n          const textContent = await readFileAsText(file);\n          base64Data = btoa(encodeURIComponent(textContent));\n          isText = true;\n        } catch (error) {\n          console.error(\"Failed to read as text:\", error);\n          toast({\n            title: \"Invalid file type\",\n            description: \"File must be readable as text, PDF, or be an image\",\n            variant: \"destructive\",\n          });\n          return;\n        }\n      }","fileHash":"0f61a9d7ef81fa4be0029c3fc98ed2efafd8f381"}],"guard":{"rule":"Only files that can be read as an image, a PDF's text, or non-empty text get attached","checks":"file.type starts with image/, equals application/pdf, or readAsText returns a non-empty string","onFail":"A red toast ('PDF parsing failed' or 'Invalid file type') and nothing is attached"}},{"id":"file-readers","kind":"module","name":"File readers","district":"upload","summary":"Three small helpers that read a file in the browser: as text, as base64, or as PDF text.","details":"- readFileAsText rejects an empty file\n- readFileAsBase64 strips the 'data:...;base64,' prefix\n- readFileAsPDFText adds a pdf.js script tag from a CDN, walks every page and joins the text\n- A new line is added when the y-position jumps more than 5 units","source":[{"file":"financial-data-analyst/utils/fileHandling.ts","lines":[2,36],"anchor":"export const readFileAsText = (file: File): Promise\u003cstring> => {","snippet":"export const readFileAsText = (file: File): Promise\u003cstring> => {\n  return new Promise((resolve, reject) => {\n    const reader = new FileReader();\n    reader.onload = () => {\n      try {\n        const result = reader.result;\n        if (typeof result === \"string\" && result.length > 0) {\n          resolve(result);\n        } else {\n          reject(new Error(\"Empty or invalid text file\"));\n        }\n      } catch (e) {\n        reject(e);\n      }\n    };\n    reader.onerror = reject;\n    reader.readAsText(file);\n  });\n};\n\nexport const readFileAsBase64 = (file: File): Promise\u003cstring> => {\n  return new Promise((resolve, reject) => {\n    const reader = new FileReader();\n    reader.onload = () => {\n      try {\n        const base64 = (reader.result as string).split(\",\")[1];\n        resolve(base64);\n      } catch (e) {\n        reject(e);\n      }\n    };\n    reader.onerror = reject;\n    reader.readAsDataURL(file);\n  });\n};","fileHash":"580dcaf869d1a79e72183d97516b849e038f91bf"},{"file":"financial-data-analyst/utils/fileHandling.ts","lines":[38,91],"anchor":"export const readFileAsPDFText = async (file: File): Promise\u003cstring> => {","snippet":"export const readFileAsPDFText = async (file: File): Promise\u003cstring> => {\n  return new Promise((resolve, reject) => {\n    const script = document.createElement(\"script\");\n    script.src = \"//cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js\";\n\n    script.onload = async () => {\n      try {\n        // @ts-ignore - PDF.js adds this to window\n        const pdfjsLib = window[\"pdfjs-dist/build/pdf\"];\n        pdfjsLib.GlobalWorkerOptions.workerSrc =\n          \"//cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js\";\n\n        const arrayBuffer = await file.arrayBuffer();\n        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;\n\n        let fullText = \"\";\n\n        for (let i = 1; i \u003c= pdf.numPages; i++) {\n          const page = await pdf.getPage(i);\n          const textContent = await page.getTextContent();\n\n          let lastY: number | null = null;\n          let text = \"\";\n\n          for (const item of textContent.items) {\n            if (lastY !== null && Math.abs(lastY - item.transform[5]) > 5) {\n              text += \"\\n\";\n            } else if (lastY !== null && text.length > 0) {\n              text += \" \";\n            }\n\n            text += item.str;\n            lastY = item.transform[5];\n          }\n\n          fullText += text + \"\\n\\n\";\n        }\n\n        document.body.removeChild(script);\n        resolve(fullText.trim());\n      } catch (error) {\n        document.body.removeChild(script);\n        reject(error);\n      }\n    };\n\n    script.onerror = () => {\n      document.body.removeChild(script);\n      reject(new Error(\"Failed to load PDF.js library\"));\n    };\n\n    document.body.appendChild(script);\n  });\n};","fileHash":"580dcaf869d1a79e72183d97516b849e038f91bf"}]},{"id":"file-preview","kind":"ui","name":"File preview chip","district":"upload","summary":"Shows the attached file: a small picture for images, or a page icon with the file extension for everything else.","details":"- Large size (with an X to remove) sits above the input box\n- Small size sits under your sent message\n- Images are shown straight from a data: URL built from the base64\n- Long names are cut to 7 letters plus the extension","source":[{"file":"financial-data-analyst/components/FilePreview.tsx","lines":[17,35],"anchor":"const imageUrl = isImage","snippet":"const FilePreview: React.FC\u003cFilePreviewProps> = ({\n  file,\n  onRemove,\n  size = \"large\",\n}) => {\n  const isImage = file.mediaType.startsWith(\"image/\");\n  const fileExtension = file.fileName.split(\".\").pop()?.toLowerCase() || \"\";\n\n  const truncatedName =\n    file.fileName.length > 7\n      ? `${file.fileName.slice(0, 7)}...${file.fileName.slice(\n          file.fileName.lastIndexOf(\".\"),\n        )}`\n      : file.fileName;\n\n  const imageUrl = isImage\n    ? `data:${file.mediaType};base64,${file.base64}`\n    : \"\";\n","fileHash":"1efcd61aa2f3dd7266a1f021e6cba0bf774724ba"}]},{"id":"finance-page","kind":"entry","name":"Finance page","district":"chat","summary":"The only page. The home route simply shows the finance chat screen: chat on the left, charts on the right.","details":"- app/page.tsx just returns \u003cFinancePage />\n- Left card: chat sidebar with model picker and input\n- Right card: 'Analysis & Visualizations' with one chart per screen and pagination dots","source":[{"file":"financial-data-analyst/app/page.tsx","lines":[7,9],"anchor":"return \u003cFinancePage />;","snippet":"export default function Home() {\n  return \u003cFinancePage />;\n}","fileHash":"45361e9c3b4a4e5238e78ea70e89e78c3602b6f1"},{"file":"financial-data-analyst/app/finance/page.tsx","lines":[516,528],"anchor":"{/* Chat Sidebar */}","snippet":"  return (\n    \u003cdiv className=\"flex flex-col h-screen\">\n      \u003cTopNavBar\n        features={{\n          showDomainSelector: false,\n          showViewModeSelector: false,\n          showPromptCaching: false,\n        }}\n      />\n\n      \u003cdiv className=\"flex-1 flex bg-background p-4 pt-0 gap-4 h-[calc(100vh-4rem)]\">\n        {/* Chat Sidebar */}\n        \u003cCard className=\"w-1/3 flex flex-col h-full\">","fileHash":"0f61a9d7ef81fa4be0029c3fc98ed2efafd8f381"}]},{"id":"chat-panel","kind":"ui","name":"Chat panel","district":"chat","summary":"Where you type and send. On send it adds your message and a 'thinking' bubble, then posts the whole chat to /api/finance.","details":"- Does nothing if the box is empty and no file is attached\n- Text files are decoded and pasted into the message as 'File contents of \u003cname>'\n- Images become an image block plus a text block\n- Every earlier message (and its file) is re-sent on every turn\n- On success the thinking bubble is replaced with the reply and chart; on error with an apology","source":[{"file":"financial-data-analyst/app/finance/page.tsx","lines":[371,437],"anchor":"const handleSubmit = async (event: React.FormEvent\u003cHTMLFormElement>) => {","snippet":"  const handleSubmit = async (event: React.FormEvent\u003cHTMLFormElement>) => {\n    event.preventDefault();\n    if (!input.trim() && !currentUpload) return;\n    if (isLoading) return;\n\n    setIsScrollLocked(true);\n\n    const userMessage: Message = {\n      id: crypto.randomUUID(),\n      role: \"user\",\n      content: input,\n      file: currentUpload || undefined,\n    };\n\n    const thinkingMessage: Message = {\n      id: crypto.randomUUID(),\n      role: \"assistant\",\n      content: \"thinking\",\n    };\n\n    // Update messages in a single state update\n    setMessages((prev) => [...prev, userMessage, thinkingMessage]);\n    setInput(\"\");\n    setIsLoading(true);\n\n    // Prepare all messages for the API request\n    const apiMessages = [...messages, userMessage].map((msg) => {\n      if (msg.file) {\n        if (msg.file.isText) {\n          // For text files, decode the content before sending\n          const decodedText = decodeURIComponent(atob(msg.file.base64));\n          return {\n            role: msg.role,\n            content: `File contents of ${msg.file.fileName}:\\n\\n${decodedText}\\n\\n${msg.content}`,\n          };\n        } else {\n          // Handle images as before\n          return {\n            role: msg.role,\n            content: [\n              {\n                type: \"image\",\n                source: {\n                  type: \"base64\",\n                  media_type: msg.file.mediaType,\n                  data: msg.file.base64,\n                },\n              },\n              {\n                type: \"text\",\n                text: msg.content,\n              },\n            ],\n          };\n        }\n      }\n      // Handle text-only messages\n      return {\n        role: msg.role,\n        content: msg.content,","snippetCut":true,"fileHash":"0f61a9d7ef81fa4be0029c3fc98ed2efafd8f381"},{"file":"financial-data-analyst/app/finance/page.tsx","lines":[454,478],"anchor":"data.chartData || (data.toolUse?.input as ChartData) || null,","snippet":"      setMessages((prev) => {\n        const newMessages = [...prev];\n        newMessages[newMessages.length - 1] = {\n          id: crypto.randomUUID(),\n          role: \"assistant\",\n          content: data.content,\n          hasToolUse: data.hasToolUse || !!data.toolUse,\n          chartData:\n            data.chartData || (data.toolUse?.input as ChartData) || null,\n        };\n        return newMessages;\n      });\n\n      setCurrentUpload(null);\n    } catch (error) {\n      console.error(\"Submit Error:\", error);\n      setMessages((prev) => {\n        const newMessages = [...prev];\n        newMessages[newMessages.length - 1] = {\n          id: crypto.randomUUID(),\n          role: \"assistant\",\n          content: \"I apologize, but I encountered an error. Please try again.\",\n        };\n        return newMessages;\n      });","fileHash":"0f61a9d7ef81fa4be0029c3fc98ed2efafd8f381"}]},{"id":"chat-state","kind":"store","name":"Chat memory","district":"chat","summary":"React state that holds every message (with its file and chart) plus the file waiting to be sent.","details":"- messages: the full history; lives only in the browser tab\n- currentUpload: the attached file until the next send\n- A message may carry chartData, which puts it in the chart panel\n- Refreshing the page wipes everything","source":[{"file":"financial-data-analyst/app/finance/page.tsx","lines":[44,57],"anchor":"interface Message {","snippet":"// Types\ninterface Message {\n  id: string;\n  role: string;\n  content: string;\n  hasToolUse?: boolean;\n  file?: {\n    base64: string;\n    fileName: string;\n    mediaType: string;\n    isText?: boolean;\n  };\n  chartData?: ChartData;\n}","fileHash":"0f61a9d7ef81fa4be0029c3fc98ed2efafd8f381"},{"file":"financial-data-analyst/app/finance/page.tsx","lines":[197,211],"anchor":"const [messages, setMessages] = useState\u003cMessage[]>([]);","snippet":"export default function AIChat() {\n  const [messages, setMessages] = useState\u003cMessage[]>([]);\n  const [input, setInput] = useState(\"\");\n  const [isLoading, setIsLoading] = useState(false);\n  const [selectedModel, setSelectedModel] = useState(\n    \"claude-3-5-sonnet-20240620\",\n  );\n  const messagesEndRef = useRef\u003cHTMLDivElement>(null);\n  const chartEndRef = useRef\u003cHTMLDivElement>(null);\n  const fileInputRef = useRef\u003cHTMLInputElement>(null);\n  const [currentUpload, setCurrentUpload] = useState\u003cFileUpload | null>(null);\n  const [isUploading, setIsUploading] = useState(false);\n  const [currentChartIndex, setCurrentChartIndex] = useState(0);\n  const contentRef = useRef\u003cHTMLDivElement>(null);\n  const [isScrollLocked, setIsScrollLocked] = useState(false);","fileHash":"0f61a9d7ef81fa4be0029c3fc98ed2efafd8f381"}]},{"id":"model-list","kind":"config","name":"Model list","district":"chat","summary":"The three Claude models you can pick from the dropdown. The chosen id is sent with each request.","details":"- Claude 3 Haiku, Claude 4.5 Haiku, Claude 3.5 Sonnet\n- Default is claude-3-5-sonnet-20240620\n- The server does not check the id against this list","source":[{"file":"financial-data-analyst/app/finance/page.tsx","lines":[72,76],"anchor":"const models: Model[] = [","snippet":"const models: Model[] = [\n  { id: \"claude-3-haiku-20240307\", name: \"Claude 3 Haiku\" },\n  { id: \"claude-haiku-4-5-20251001\", name: \"Claude 4.5 Haiku\" },\n  { id: \"claude-3-5-sonnet-20240620\", name: \"Claude 3.5 Sonnet\" },\n];","fileHash":"0f61a9d7ef81fa4be0029c3fc98ed2efafd8f381"},{"file":"financial-data-analyst/app/finance/page.tsx","lines":[201,203],"anchor":"const [selectedModel, setSelectedModel] = useState(","snippet":"  const [selectedModel, setSelectedModel] = useState(\n    \"claude-3-5-sonnet-20240620\",\n  );","fileHash":"0f61a9d7ef81fa4be0029c3fc98ed2efafd8f381"}]},{"id":"finance-api","kind":"entry","name":"POST /api/finance","district":"server","summary":"The one server route. It reads the chat and model from the request and copies the messages for Claude.","details":"- Runs on the edge runtime\n- Reads { messages, fileData, model } from the JSON body\n- Has a fileData branch, but the current page never sends fileData (files are already inside messages)\n- Sends back { content, hasToolUse, toolUse, chartData }","source":[{"file":"financial-data-analyst/app/api/finance/route.ts","lines":[103,134],"anchor":"export async function POST(req: NextRequest) {","snippet":"export async function POST(req: NextRequest) {\n  try {\n    const { messages, fileData, model } = await req.json();\n\n    console.log(\"🔍 Initial Request Data:\", {\n      hasMessages: !!messages,\n      messageCount: messages?.length,\n      hasFileData: !!fileData,\n      fileType: fileData?.mediaType,\n      model,\n    });\n\n    // Input validation\n    if (!messages || !Array.isArray(messages)) {\n      return new Response(\n        JSON.stringify({ error: \"Messages array is required\" }),\n        { status: 400 },\n      );\n    }\n\n    if (!model) {\n      return new Response(\n        JSON.stringify({ error: \"Model selection is required\" }),\n        { status: 400 },\n      );\n    }\n\n    // Convert all previous messages\n    let anthropicMessages = messages.map((msg: any) => ({\n      role: msg.role,\n      content: msg.content,\n    }));","fileHash":"e940bf2b0249c3831b4ddef77eb7fc3a24bf428b"},{"file":"financial-data-analyst/app/api/finance/route.ts","lines":[136,193],"anchor":"if (fileData) {","snippet":"    // Handle file in the latest message\n    if (fileData) {\n      const { base64, mediaType, isText } = fileData;\n\n      if (!base64) {\n        console.error(\"❌ No base64 data received\");\n        return new Response(JSON.stringify({ error: \"No file data\" }), {\n          status: 400,\n        });\n      }\n\n      try {\n        if (isText) {\n          // Decode base64 text content\n          const textContent = decodeURIComponent(escape(atob(base64)));\n\n          // Replace only the last message with the file content\n          anthropicMessages[anthropicMessages.length - 1] = {\n            role: \"user\",\n            content: [\n              {\n                type: \"text\",\n                text: `File contents of ${fileData.fileName}:\\n\\n${textContent}`,\n              },\n              {\n                type: \"text\",\n                text: messages[messages.length - 1].content,\n              },\n            ],\n          };\n        } else if (mediaType.startsWith(\"image/\")) {\n          // Handle image files\n          anthropicMessages[anthropicMessages.length - 1] = {\n            role: \"user\",\n            content: [\n              {\n                type: \"image\",\n                source: {\n                  type: \"base64\",\n                  media_type: mediaType,\n                  data: base64,\n                },\n              },\n              {\n                type: \"text\",\n                text: messages[messages.length - 1].content,\n              },\n            ],\n          };\n        }\n      } catch (error) {\n        console.error(\"Error processing file content:\", error);\n        return new Response(\n          JSON.stringify({ error: \"Failed to process file content\" }),\n          { status: 400 },\n        );\n      }\n    }","fileHash":"e940bf2b0249c3831b4ddef77eb7fc3a24bf428b"}]},{"id":"request-check","kind":"guardrail","name":"Request check","district":"server","summary":"Stops the request early if there is no messages array or no model.","details":"- messages must exist and be an array\n- model must be set (any string is accepted)\n- Fails with HTTP 400 and a JSON error","source":[{"file":"financial-data-analyst/app/api/finance/route.ts","lines":[115,128],"anchor":"if (!messages || !Array.isArray(messages)) {","snippet":"    // Input validation\n    if (!messages || !Array.isArray(messages)) {\n      return new Response(\n        JSON.stringify({ error: \"Messages array is required\" }),\n        { status: 400 },\n      );\n    }\n\n    if (!model) {\n      return new Response(\n        JSON.stringify({ error: \"Model selection is required\" }),\n        { status: 400 },\n      );\n    }","fileHash":"e940bf2b0249c3831b4ddef77eb7fc3a24bf428b"}],"guard":{"rule":"A request must carry a chat history and a model","checks":"Array.isArray(messages) and model is truthy","onFail":"HTTP 400 'Messages array is required' or 'Model selection is required'"}},{"id":"chart-check","kind":"guardrail","name":"Chart data check","district":"server","summary":"Looks at what Claude put into the tool call, checks the basics, reshapes pie data and paints each series a color.","details":"- Throws if chartType is missing or data is not an array\n- Pie: rows are rebuilt as { segment, value } using xAxisKey and the first chartConfig key\n- Each chartConfig key gets a color hsl(var(--chart-1)), --chart-2, ... in order\n- The chartType value itself is not checked against the six allowed names","source":[{"file":"financial-data-analyst/app/api/finance/route.ts","lines":[353,402],"anchor":"const processToolResponse = (toolUseContent: any) => {","snippet":"    const processToolResponse = (toolUseContent: any) => {\n      if (!toolUseContent) return null;\n\n      const chartData = toolUseContent.input as ChartToolResponse;\n\n      if (\n        !chartData.chartType ||\n        !chartData.data ||\n        !Array.isArray(chartData.data)\n      ) {\n        throw new Error(\"Invalid chart data structure\");\n      }\n\n      // Transform data for pie charts to match expected structure\n      if (chartData.chartType === \"pie\") {\n        // Ensure data items have 'segment' and 'value' keys\n        chartData.data = chartData.data.map((item) => {\n          // Find the first key in chartConfig (e.g., 'sales')\n          const valueKey = Object.keys(chartData.chartConfig)[0];\n          const segmentKey = chartData.config.xAxisKey || \"segment\";\n\n          return {\n            segment:\n              item[segmentKey] || item.segment || item.category || item.name,\n            value: item[valueKey] || item.value,\n          };\n        });\n\n        // Ensure xAxisKey is set to 'segment' for consistency\n        chartData.config.xAxisKey = \"segment\";\n      }\n\n      // Create new chartConfig with system color variables\n      const processedChartConfig = Object.entries(chartData.chartConfig).reduce(\n        (acc, [key, config], index) => ({\n          ...acc,\n          [key]: {\n            ...config,\n            // Assign color variables sequentially\n            color: `hsl(var(--chart-${index + 1}))`,\n          },\n        }),\n        {},\n      );\n\n      return {\n        ...chartData,\n        chartConfig: processedChartConfig,\n      };\n    };","fileHash":"e940bf2b0249c3831b4ddef77eb7fc3a24bf428b"}],"guard":{"rule":"Tool output must look like a chart before it is sent to the browser","checks":"chartData.chartType is set and chartData.data is an array","onFail":"Throws 'Invalid chart data structure', which becomes an HTTP 500"}},{"id":"error-handler","kind":"guardrail","name":"Error catcher","district":"server","summary":"The big catch at the end of the route. It turns any thrown error into a JSON error response.","details":"- Anthropic API errors return their own status code\n- The AuthenticationError branch is never reached, because APIError is checked first and covers it\n- Anything else becomes HTTP 500 with the error message","source":[{"file":"financial-data-analyst/app/api/finance/route.ts","lines":[422,464],"anchor":"if (error instanceof Anthropic.APIError) {","snippet":"  } catch (error) {\n    console.error(\"❌ Finance API Error: \", error);\n    console.error(\"Full error details:\", {\n      name: error instanceof Error ? error.name : \"Unknown\",\n      message: error instanceof Error ? error.message : \"Unknown error\",\n      stack: error instanceof Error ? error.stack : undefined,\n      headers: error instanceof Error ? (error as any).headers : undefined,\n      response: error instanceof Error ? (error as any).response : undefined,\n    });\n\n    // Add specific error handling for different scenarios\n    if (error instanceof Anthropic.APIError) {\n      return new Response(\n        JSON.stringify({\n          error: \"API Error\",\n          details: error.message,\n          code: error.status,\n        }),\n        { status: error.status },\n      );\n    }\n\n    if (error instanceof Anthropic.AuthenticationError) {\n      return new Response(\n        JSON.stringify({\n          error: \"Authentication Error\",\n          details: \"Invalid API key or authentication failed\",\n        }),\n        { status: 401 },\n      );\n    }\n\n    return new Response(\n      JSON.stringify({\n        error:\n          error instanceof Error ? error.message : \"An unknown error occurred\",\n      }),\n      {\n        status: 500,\n        headers: { \"Content-Type\": \"application/json\" },\n      },\n    );\n  }","fileHash":"e940bf2b0249c3831b4ddef77eb7fc3a24bf428b"}],"guard":{"rule":"No error escapes the route without a JSON answer","checks":"error instanceof Anthropic.APIError, then AuthenticationError, else generic","onFail":"Returns { error, details } with the API status, 401, or 500"}},{"id":"analyst","kind":"agent","name":"The Analyst","district":"claude","summary":"Claude, called once per message with the chart tool and a long system prompt. It either answers in text, calls the chart tool, or both.","details":"- One call to messages.create, no loop and no tool_result sent back\n- max_tokens 4096, temperature 0.7\n- tool_choice auto: Claude decides if a chart is needed\n- Told never to mention that it is using the tool","source":[{"file":"financial-data-analyst/app/api/finance/route.ts","lines":[215,221],"anchor":"const response = await anthropic.messages.create({","snippet":"    const response = await anthropic.messages.create({\n      model,\n      max_tokens: 4096,\n      temperature: 0.7,\n      tools: tools,\n      tool_choice: { type: \"auto\" },\n      messages: anthropicMessages,","fileHash":"e940bf2b0249c3831b4ddef77eb7fc3a24bf428b"},{"file":"financial-data-analyst/app/api/finance/route.ts","lines":[350,351],"anchor":"const toolUseContent = response.content.find((c) => c.type === \"tool_use\");","snippet":"    const toolUseContent = response.content.find((c) => c.type === \"tool_use\");\n    const textContent = response.content.find((c) => c.type === \"text\");","fileHash":"e940bf2b0249c3831b4ddef77eb7fc3a24bf428b"}],"agent":{"role":"Reads financial data and answers with insight and, when useful, a chart spec","model":"picked by the user (default claude-3-5-sonnet-20240620)","tools":["graph-tool"],"prompt":"system-prompt"}},{"id":"graph-tool","kind":"skill","name":"generate_graph_data tool","district":"claude","summary":"The only tool Claude has. It is not code that runs; its input is the chart spec the app draws.","details":"- chartType: bar, multiBar, line, pie, area or stackedArea\n- config: title and description required; trend, footer, totalLabel, xAxisKey optional\n- data: array of rows with any keys\n- chartConfig: one entry per series, each with a label","source":[{"file":"financial-data-analyst/app/api/finance/route.ts","lines":[37,101],"anchor":"name: \"generate_graph_data\",","snippet":"const tools: ToolSchema[] = [\n  {\n    name: \"generate_graph_data\",\n    description:\n      \"Generate structured JSON data for creating financial charts and graphs.\",\n    input_schema: {\n      type: \"object\" as const,\n      properties: {\n        chartType: {\n          type: \"string\" as const,\n          enum: [\n            \"bar\",\n            \"multiBar\",\n            \"line\",\n            \"pie\",\n            \"area\",\n            \"stackedArea\",\n          ] as const,\n          description: \"The type of chart to generate\",\n        },\n        config: {\n          type: \"object\" as const,\n          properties: {\n            title: { type: \"string\" as const },\n            description: { type: \"string\" as const },\n            trend: {\n              type: \"object\" as const,\n              properties: {\n                percentage: { type: \"number\" as const },\n                direction: {\n                  type: \"string\" as const,\n                  enum: [\"up\", \"down\"] as const,\n                },\n              },\n              required: [\"percentage\", \"direction\"],\n            },\n            footer: { type: \"string\" as const },\n            totalLabel: { type: \"string\" as const },\n            xAxisKey: { type: \"string\" as const },\n          },\n          required: [\"title\", \"description\"],\n        },\n        data: {\n          type: \"array\" as const,\n          items: {\n            type: \"object\" as const,\n            additionalProperties: true, // Allow any structure\n          },\n        },\n        chartConfig: {\n          type: \"object\" as const,\n          additionalProperties: {\n            type: \"object\" as const,\n            properties: {\n              label: { type: \"string\" as const },\n              stacked: { type: \"boolean\" as const },\n            },\n            required: [\"label\"],\n          },\n        },","snippetCut":true,"fileHash":"e940bf2b0249c3831b4ddef77eb7fc3a24bf428b"}]},{"id":"system-prompt","kind":"config","name":"Analyst system prompt","district":"claude","summary":"Tells Claude it is a financial chart expert, when to use each chart type, and shows example data shapes.","details":"- Lists the six chart types with use cases\n- Gives example data for time series, multi-bar and pie\n- Says: use real data, add trend and footer, never announce the tool","source":[{"file":"financial-data-analyst/app/api/finance/route.ts","lines":[222,329],"anchor":"You are a financial data visualization expert.","snippet":"      system: `You are a financial data visualization expert. Your role is to analyze financial data and e":[{"file":"financial-data-analyst/app/api/finance/route.ts","lines":[6,9],"anchor":"const anthropic = new Anthropic({","snippet":"// Initialize Anthropic client with correct headers\nconst anthropic = new Anthropic({\n  apiKey: process.env.ANTHROPIC_API_KEY!,\n});","fileHash":"e940bf2b0249c3831b4ddef77eb7fc3a24bf428b"}]},{"id":"chart-renderer","kind":"ui","name":"Chart renderer","district":"display","summary":"Picks a chart component by chartType and draws it with Recharts inside a card with title, trend and footer.","details":"- bar draws only the first chartConfig key\n- multiBar, line, area, stackedArea draw one series per chartConfig key\n- pie adds up 'value' for the number in the middle\n- Unknown chartType returns null (an empty slot)\n- Wrapped in SafeChartRenderer, whose try/catch cannot catch errors thrown inside the chart","source":[{"file":"financial-data-analyst/components/ChartRenderer.tsx","lines":[391,408],"anchor":"export function ChartRenderer({ data }: { data: ChartData }) {","snippet":"export function ChartRenderer({ data }: { data: ChartData }) {\n  switch (data.chartType) {\n    case \"bar\":\n      return \u003cBarChartComponent data={data} />;\n    case \"multiBar\":\n      return \u003cMultiBarChartComponent data={data} />;\n    case \"line\":\n      return \u003cLineChartComponent data={data} />;\n    case \"pie\":\n      return \u003cPieChartComponent data={data} />;\n    case \"area\":\n      return \u003cAreaChartComponent data={data} />;\n    case \"stackedArea\":\n      return \u003cAreaChartComponent data={data} stacked />;\n    default:\n      return null;\n  }\n}","fileHash":"54b9bbb2638ddfcef98ab762effb31da66ec0369"},{"file":"financial-data-analyst/app/finance/page.tsx","lines":[95,112],"anchor":"const SafeChartRenderer: React.FC\u003c{ data: ChartData }> = ({ data }) => {","snippet":"const SafeChartRenderer: React.FC\u003c{ data: ChartData }> = ({ data }) => {\n  try {\n    return (\n      \u003cdiv className=\"w-full h-full p-6 flex flex-col\">\n        \u003cdiv className=\"w-[90%] flex-1 mx-auto\">\n          \u003cChartRenderer data={data} />\n        \u003c/div>\n      \u003c/div>\n    );\n  } catch (error) {\n    console.error(\"Chart rendering error:\", error);\n    const errorMessage =\n      error instanceof Error ? error.message : \"An unknown error occurred\";\n    return (\n      \u003cdiv className=\"text-red-500\">Error rendering chart: {errorMessage}\u003c/div>\n    );\n  }\n};","fileHash":"0f61a9d7ef81fa4be0029c3fc98ed2efafd8f381"},{"file":"financial-data-analyst/app/finance/page.tsx","lines":[694,712],"anchor":"\u003cSafeChartRenderer data={message.chartData} />","snippet":"            {messages.some((m) => m.chartData) ? (\n              \u003cdiv className=\"min-h-full flex flex-col\">\n                {messages.map(\n                  (message, index) =>\n                    message.chartData && (\n                      \u003cdiv\n                        key={`chart-${index}`}\n                        className=\"w-full min-h-full flex-shrink-0 snap-start snap-always\"\n                        ref={\n                          index ===\n                          messages.filter((m) => m.chartData).length - 1\n                            ? chartEndRef\n                            : null\n                        }\n                      >\n                        \u003cSafeChartRenderer data={message.chartData} />\n                      \u003c/div>\n                    ),\n                )}","fileHash":"0f61a9d7ef81fa4be0029c3fc98ed2efafd8f381"}]}],"flows":[{"id":"upload-file","name":"User attaches a file","trigger":"User clicks the paperclip and picks a file","summary":"The browser reads the file locally and turns it into either base64 (images) or packed text (PDF and everything else). Nothing is sent to the server yet.","start":"s1","steps":[{"id":"s1","at":"chat-panel","action":"Paperclip opens the hidden file input; the first chosen file is taken","carries":"File { name: 'q3.csv', type: 'text/csv' }","source":{"file":"financial-data-analyst/app/finance/page.tsx","lines":[282,286],"anchor":"const file = e.target.files?.[0];","snippet":"  const handleFileSelect = async (e: React.ChangeEvent\u003cHTMLInputElement>) => {\n    const file = e.target.files?.[0];\n    if (!file) return;\n\n    setIsUploading(true);","fileHash":"0f61a9d7ef81fa4be0029c3fc98ed2efafd8f381"},"next":[{"to":"s2","when":"always"}],"screen":{"name":"AIChat (finance page)","kind":"browser","blocks":[{"t":"title","text":"Financial Assistant"},{"t":"text","text":"Upload CSVs, PDFs, or images and I'll help you understand the data.","state":"muted"},{"t":"button","text":"Paperclip (attach file)","state":"disabled"},{"t":"input","text":"Type your message..."}],"note":"The file picker closes and the paperclip greys out while the file is read."}},{"id":"s2","at":"upload-gate","action":"Sorts the file by its MIME type","source":{"file":"financial-data-analyst/app/finance/page.tsx","lines":[300,305],"anchor":"const isImage = file.type.startsWith(\"image/\");","snippet":"      const isImage = file.type.startsWith(\"image/\");\n      const isPDF = file.type === \"application/pdf\";\n      let base64Data = \"\";\n      let isText = false;\n\n      if (isImage) {","fileHash":"0f61a9d7ef81fa4be0029c3fc98ed2efafd8f381"},"next":[{"to":"s3","when":"type starts with image/"},{"to":"s4","when":"type is application/pdf"},{"to":"s5","when":"anything else"}]},{"id":"s3","at":"file-readers","action":"Reads the image as a data URL and keeps only the base64 part","carries":"'iVBORw0KGgo...'","source":{"file":"financial-data-analyst/utils/fileHandling.ts","lines":[22,36],"anchor":"const base64 = (reader.result as string).split(\",\")[1];","snippet":"export const readFileAsBase64 = (file: File): Promise\u003cstring> => {\n  return new Promise((resolve, reject) => {\n    const reader = new FileReader();\n    reader.onload = () => {\n      try {\n        const base64 = (reader.result as string).split(\",\")[1];\n        resolve(base64);\n      } catch (e) {\n        reject(e);\n      }\n    };\n    reader.onerror = reject;\n    reader.readAsDataURL(file);\n  });\n};","fileHash":"580dcaf869d1a79e72183d97516b849e038f91bf"},"next":[{"to":"s7","when":"always"}]},{"id":"s4","at":"file-readers","action":"Loads pdf.js from a CDN and pulls the text out page by page","source":{"file":"financial-data-analyst/utils/fileHandling.ts","lines":[38,91],"anchor":"const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;","snippet":"export const readFileAsPDFText = async (file: File): Promise\u003cstring> => {\n  return new Promise((resolve, reject) => {\n    const script = document.createElement(\"script\");\n    script.src = \"//cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js\";\n\n    script.onload = async () => {\n      try {\n        // @ts-ignore - PDF.js adds this to window\n        const pdfjsLib = window[\"pdfjs-dist/build/pdf\"];\n        pdfjsLib.GlobalWorkerOptions.workerSrc =\n          \"//cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js\";\n\n        const arrayBuffer = await file.arrayBuffer();\n        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;\n\n        let fullText = \"\";\n\n        for (let i = 1; i \u003c= pdf.numPages; i++) {\n          const page = await pdf.getPage(i);\n          const textContent = await page.getTextContent();\n\n          let lastY: number | null = null;\n          let text = \"\";\n\n          for (const item of textContent.items) {\n            if (lastY !== null && Math.abs(lastY - item.transform[5]) > 5) {\n              text += \"\\n\";\n            } else if (lastY !== null && text.length > 0) {\n              text += \" \";\n            }\n\n            text += item.str;\n            lastY = item.transform[5];\n          }\n\n          fullText += text + \"\\n\\n\";\n        }\n\n        document.body.removeChild(script);\n        resolve(fullText.trim());\n      } catch (error) {\n        document.body.removeChild(script);\n        reject(error);\n      }\n    };\n\n    script.onerror = () => {\n      document.body.removeChild(script);\n      reject(new Error(\"Failed to load PDF.js library\"));\n    };\n\n    document.body.appendChild(script);\n  });\n};","fileHash":"580dcaf869d1a79e72183d97516b849e038f91bf"},"next":[{"to":"s6","when":"text extracted"},{"to":"outcome:pdf-failed","when":"pdf.js fails to load or open the PDF"}],"screen":{"name":"Toast","kind":"browser","blocks":[{"t":"banner","text":"Processing PDF: Extracting text content...","state":"loading"},{"t":"button","text":"Paperclip (attach file)","state":"disabled"},{"t":"input","text":"Type your message..."}],"note":"A \"Processing PDF\" toast stays up while the text is pulled out."}},{"id":"s5","at":"file-readers","action":"Reads the file as plain text","source":{"file":"financial-data-analyst/utils/fileHandling.ts","lines":[2,20],"anchor":"reject(new Error(\"Empty or invalid text file\"));","snippet":"export const readFileAsText = (file: File): Promise\u003cstring> => {\n  return new Promise((resolve, reject) => {\n    const reader = new FileReader();\n    reader.onload = () => {\n      try {\n        const result = reader.result;\n        if (typeof result === \"string\" && result.length > 0) {\n          resolve(result);\n        } else {\n          reject(new Error(\"Empty or invalid text file\"));\n        }\n      } catch (e) {\n        reject(e);\n      }\n    };\n    reader.onerror = reject;\n    reader.readAsText(file);\n  });\n};","fileHash":"580dcaf869d1a79e72183d97516b849e038f91bf"},"next":[{"to":"s6","when":"non-empty text"},{"to":"outcome:rejected","when":"file is empty or unreadable"}]},{"id":"s6","at":"upload-gate","action":"Packs the text with btoa(encodeURIComponent(text)) and marks it isText, mediaType text/plain","carries":"{ base64: 'UXVhcnRlciUyQ1Jl...', isText: true }","source":{"file":"financial-data-analyst/app/finance/page. t-harbor","to":"chart-observatory","label":"same Next.js chat shape: page → API route → Claude","kind":"concept"},{"from":"agent-forge","to":"support-harbor","label":"a single model call instead of a tool loop","kind":"concept"}],"uncharted":["browser-use-demo/","computer-use-best-practices/","managed-agents/"]};</script>
