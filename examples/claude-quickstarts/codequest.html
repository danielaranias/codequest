<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CodeQuest — claude-quickstarts</title>
<style>
:root {
  --sea: #123a4f;
  --panel: rgba(12, 33, 46, 0.95);
  --panel-2: rgba(234, 244, 244, 0.06);
  --line: rgba(234, 244, 244, 0.14);
  --ink: #eaf4f4;
  --muted: #9dbac6;
  --lantern: #ffc857;
  --lantern-ink: #2a1d00;
  --pass: #5fe0a3;
  --block: #ff6b6b;
  --error: #ffa24c;
  --drift: #f5b84a;
  --ai: #8ff0ff;
  --r-panel: 18px;
  --r-ctl: 10px;
  --ui: ui-rounded, 'SF Pro Rounded', 'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--sea); color: var(--ink); overflow: hidden; }
body { font-family: var(--ui); font-size: 15px; line-height: 1.45; font-variation-settings: 'CASL' 0.5; -webkit-font-smoothing: antialiased; }
#app { position: fixed; inset: 0; }
#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; cursor: crosshair; }
button { font: inherit; color: inherit; }
kbd { font-family: var(--ui); font-variation-settings: 'MONO' 1; font-size: 11px; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
code, pre, .mono, pre.src, .md-code, .b-console, details.code summary { font-family: var(--mono); }
:focus-visible { outline: 2px solid var(--lantern); outline-offset: 2px; }
[hidden] { display: none !important; }

.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: var(--r-ctl); padding: 7px 12px; cursor: pointer; font-weight: 600; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
.btn:hover { background: rgba(234, 244, 244, 0.12); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: rgba(234, 244, 244, 0.08); }
.btn.primary { background: var(--lantern); color: var(--lantern-ink); border-color: var(--lantern); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ai { border-color: rgba(143, 240, 255, 0.5); color: var(--ai); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 11px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--pass); flex: none; }
.dot.drifted { background: var(--drift); }
.dot.stale, .dot.lost { background: #c9d6de; box-shadow: 0 0 0 3px rgba(201, 214, 222, 0.25); }
.dot.snapshot { background: var(--muted); }

/* ---------- HUD ---------- */
.hud-top { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; gap: 12px; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px; pointer-events: none; flex-wrap: wrap; }
.hud-top > * { pointer-events: auto; }
.where, .me { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 8px 5px 14px; min-width: 0; }
.where { padding-left: 8px; }
.crumbs { font-weight: 700; font-variation-settings: 'CASL' 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 42vw; }
.crumbs #crumb-repo { color: var(--muted); font-weight: 600; }
.crumbs #crumb-world:not(:empty)::before { content: ' / '; color: var(--muted); }
.xp { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.xp .bar { width: 90px; height: 7px; border-radius: 99px; background: rgba(234, 244, 244, 0.12); overflow: hidden; }
.xp .bar i { display: block; height: 100%; background: var(--lantern); border-radius: 99px; transition: width 0.5s; }
.mastery { font-size: 13px; color: var(--muted); white-space: nowrap; }
.mastery b { color: var(--ink); }
.tabs { display: flex; gap: 2px; }

.hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--dockh, 120px) + 34px); background: var(--panel); border: 1px solid var(--line); padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; pointer-events: none; white-space: nowrap; }
.hint kbd { color: var(--lantern); border-color: rgba(255, 200, 87, 0.5); margin-right: 6px; }
body.no-dock .hint { bottom: 28px; }

/* caption over the moving packet */
.caption { position: absolute; transform: translate(-50%, calc(-100% - 70px)); max-width: min(360px, 86vw); background: #fbf7ec; color: #1c2a33; border-radius: 14px; padding: 10px 13px 11px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35); font-size: 14px; pointer-events: auto; }
.caption::after { content: ''; position: absolute; left: 50%; bottom: -8px; margin-left: -8px; border: 8px solid transparent; border-bottom: 0; border-top-color: #fbf7ec; }
.caption .cap-step { font-size: 12px; font-weight: 700; color: #5c6f79; display: flex; gap: 8px; justify-content: space-between; }
.caption .cap-act { font-weight: 650; margin: 2px 0; font-variation-settings: 'CASL' 1; }
.caption .cap-input { color: #7a5a12; font-weight: 600; margin-top: 2px; }
.caption .cap-carry { font-size: 12.5px; color: #3b5260; font-variation-settings: 'MONO' 1; word-break: break-word; }
.caption .cap-ai { font-size: 13px; color: #10566a; border-left: 3px solid #39b6cc; padding-left: 8px; margin-top: 6px; }
.caption .cap-choices { display: grid; gap: 6px; margin-top: 8px; }
.caption .cap-choices button { text-align: left; background: #fff; border: 1px solid #d8d2c2; border-radius: 9px; padding: 6px 9px; cursor: pointer; font-size: 13px; color: #1c2a33; }
.caption .cap-choices button:hover { border-color: #b88a2a; background: #fff6dc; }
.caption .cap-choices .to { font-weight: 700; }
.caption.end { transform: translate(-50%, calc(-100% - 112px)); background: #10293a; color: var(--ink); border: 2px solid var(--pass); }
.caption.end::after { border-top-color: var(--pass); }
.caption.end.blocked { border-color: var(--block); } .caption.end.blocked::after { border-top-color: var(--block); }
.caption.end.error { border-color: var(--error); } .caption.end.error::after { border-top-color: var(--error); }
.caption.end .cap-step { color: var(--muted); }
.caption .cap-next { margin-top: 8px; display: flex; gap: 6px; }
.caption .cap-next button { background: #1c2a33; color: #fbf7ec; border: 0; border-radius: 8px; padding: 5px 10px; cursor: pointer; font-weight: 700; font-size: 12.5px; }

/* ---------- dock (flows) ---------- */
.dock { position: absolute; left: 16px; right: 16px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-panel); padding: 10px 12px; display: grid; gap: 8px; max-width: 1100px; }
.drawer:not([hidden]) ~ .dock, body.drawer-open .dock { right: min(452px, 46vw); }
.flowbar { display: flex; gap: 8px; align-items: center; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
.flowbar .lbl { font-size: 13px; color: var(--muted); white-space: nowrap; font-weight: 600; }
.fchip { white-space: nowrap; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13.5px; font-weight: 600; }
.fchip.on { background: var(--lantern); color: var(--lantern-ink); border-color: var(--lantern); }
.fchip .tick { color: var(--pass); margin-left: 4px; }
.fchip.on .tick { color: #1f6b48; }
.flowctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.flowctl select { font: inherit; font-size: 13.5px; background: rgba(234, 244, 244, 0.07); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-ctl); padding: 6px 8px; max-width: 320px; }
.flowctl .trigger { flex-basis: 100%; font-size: 13px; color: var(--muted); }
.flowctl .trigger b { color: var(--ink); font-weight: 650; }
.steps { display: flex; gap: 4px; align-items: center; overflow-x: auto; scrollbar-width: thin; padding: 2px 0; }
.steps .st { white-space: nowrap; font-size: 12.5px; border-radius: 8px; padding: 3px 8px; background: rgba(234, 244, 244, 0.06); border: 1px solid transparent; cursor: pointer; }
.steps .st.on { border-color: var(--lantern); color: var(--lantern); }
.steps .st.past { color: var(--muted); }
.steps .arr { color: var(--muted); font-size: 12px; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-ctl); overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 9px; cursor: pointer; font-size: 13px; font-weight: 700; color: var(--muted); }
.seg button.on { background: rgba(234, 244, 244, 0.14); color: var(--ink); }

/* ---------- drawer ---------- */
.drawer { position: absolute; top: calc(128px + env(safe-area-inset-top, 0px)); right: 16px; bottom: 14px; width: min(420px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-panel); overflow-y: auto; padding: 18px 20px 24px; scrollbar-width: thin; }
.drawer-close { position: absolute; top: 10px; right: 10px; font-size: 13px; color: var(--muted); }
.drawer h2 { font-size: 23px; line-height: 1.15; margin: 6px 0 6px; font-variation-settings: 'CASL' 1; font-weight: 800; letter-spacing: -0.01em; padding-right: 50px; }
.drawer h3 { font-size: 15px; margin: 22px 0 8px; font-weight: 750; font-variation-settings: 'CASL' 1; }
.drawer p { margin: 6px 0; }
.drawer ul { margin: 6px 0; padding-left: 18px; }
.drawer li { margin: 3px 0; }
.lead { color: #cfe1e6; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.kindrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.kind { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; padding: 3px 10px 3px 8px; border-radius: 999px; background: rgba(234, 244, 244, 0.08); }
.kind i { font-style: normal; width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; font-size: 12px; color: #13232d; }
.card { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 8px 0; background: rgba(234, 244, 244, 0.03); }
.card.guard { border-color: rgba(255, 107, 107, 0.45); }
.card.guard dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 0; font-size: 14px; }
.card.guard dt { color: var(--muted); font-weight: 600; }
.card.guard dd { margin: 0; }
.card.crack { border-color: rgba(255, 200, 87, 0.55); background: rgba(255, 200, 87, 0.06); }
.card.found { border-color: rgba(95, 224, 163, 0.5); }
.flowlink { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: transparent; border-radius: 10px; padding: 7px 10px; margin: 6px 0; cursor: pointer; }
.flowlink:hover { border-color: var(--lantern); }
.flowlink b { display: block; font-size: 14px; }
.flowlink span { font-size: 13px; color: var(--muted); }
details.code { border: 1px solid var(--line); border-radius: 10px; margin: 8px 0; overflow: hidden; }
details.code summary { cursor: pointer; padding: 7px 10px; font-size: 13px; font-variation-settings: 'MONO' 1; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
details.code summary a { color: var(--lantern); text-decoration: none; font-family: var(--ui); font-variation-settings: 'MONO' 0; }
pre.src { margin: 0; padding: 10px 12px; font-size: 12px; line-height: 1.5; overflow-x: auto; background: rgba(0, 0, 0, 0.25); counter-reset: ln; }
pre.src span.l { display: block; white-space: pre; }
pre.src span.l::before { counter-increment: ln; content: attr(data-n); display: inline-block; width: 3.2em; color: rgba(157, 186, 198, 0.55); }
.md-code { background: rgba(0, 0, 0, 0.25); padding: 8px 10px; border-radius: 8px; font-size: 12px; overflow-x: auto; font-variation-settings: 'MONO' 1; }
p code, li code { background: rgba(234, 244, 244, 0.09); padding: 1px 5px; border-radius: 5px; font-size: 0.9em; }
textarea, input[type=text] { width: 100%; font: inherit; font-size: 14px; color: var(--ink); background: rgba(0, 0, 0, 0.22); border: 1px solid var(--line); border-radius: var(--r-ctl); padding: 8px 10px; resize: vertical; }
textarea:focus, input[type=text]:focus { outline: none; border-color: var(--lantern); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.answer { border-left: 3px solid var(--ai); padding: 2px 0 2px 12px; margin: 10px 0; }
.answer .q { font-weight: 700; margin-bottom: 4px; }
.answer.pending { color: var(--muted); }
.verdict { font-weight: 800; }
.verdict.confirmed { color: var(--block); } .verdict.partly { color: var(--drift); } .verdict.not-a-problem { color: var(--pass); }
.note { padding: 9px 0; border-bottom: 1px solid var(--line); }
.note .meta { font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.task { padding: 9px 0; border-bottom: 1px solid var(--line); }
.task b { display: block; }
.status { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: rgba(234, 244, 244, 0.1); }
.status.done { background: rgba(95, 224, 163, 0.2); color: var(--pass); }
.status.running { background: rgba(143, 240, 255, 0.16); color: var(--ai); }
.status.failed { background: rgba(255, 107, 107, 0.18); color: var(--block); }
.quest { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; border: 1px solid var(--line); background: transparent; border-radius: 12px; padding: 9px 11px; margin: 7px 0; cursor: pointer; }
.quest:hover { border-color: var(--lantern); }
.quest .box { flex: none; width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--muted); margin-top: 2px; display: grid; place-items: center; font-size: 13px; font-weight: 900; }
.quest.done .box { background: var(--pass); border-color: var(--pass); color: #0d2a1d; }
.quest .qt { font-weight: 700; }
.quest .qd { font-size: 13px; color: var(--muted); }
.quest .xpv { margin-left: auto; font-size: 12.5px; color: var(--lantern); font-weight: 700; white-space: nowrap; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.badge { border: 1px solid var(--line); border-radius: 14px; padding: 10px; opacity: 0.45; }
.badge.on { opacity: 1; border-color: rgba(255, 200, 87, 0.6); background: rgba(255, 200, 87, 0.07); }
.badge b { display: block; font-variation-settings: 'CASL' 1; }
.badge span { font-size: 12.5px; color: var(--muted); }
.syncworld { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.syncworld .files { grid-column: 2 / 4; font-size: 12px; color: var(--muted); font-variation-settings: 'MONO' 1; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-variation-settings: 'MONO' 0.6; }
.opt { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: rgba(234, 244, 244, 0.03); border-radius: 10px; padding: 9px 12px; margin: 7px 0; cursor: pointer; font-size: 14.5px; }
.opt:hover:not(:disabled) { border-color: var(--lantern); }
.opt.right { border-color: var(--pass); background: rgba(95, 224, 163, 0.12); }
.opt.wrong { border-color: var(--block); background: rgba(255, 107, 107, 0.1); }
.edits label { display: grid; grid-template-columns: 1fr; gap: 3px; font-size: 13.5px; margin: 8px 0; }
.edits select { font: inherit; font-size: 13px; background: rgba(0, 0, 0, 0.22); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 5px 7px; }
.result { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-top: 12px; }
.result.success { border-color: var(--pass); } .result.blocked { border-color: var(--block); } .result.error { border-color: var(--error); }
pre.log { max-height: 220px; overflow: auto; font-size: 11.5px; background: rgba(0, 0, 0, 0.3); padding: 8px; border-radius: 8px; white-space: pre-wrap; }
.tag-ai { font-size: 11.5px; font-weight: 800; color: var(--ai); border: 1px solid rgba(143, 240, 255, 0.45); border-radius: 99px; padding: 1px 7px; }

/* ---------- toasts / modal / intro ---------- */
.toasts { position: absolute; top: calc(70px + env(safe-area-inset-top, 0px)); right: 16px; display: grid; gap: 6px; justify-items: end; pointer-events: none; z-index: 20; }
.toast { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 13.5px; font-weight: 650; animation: toast 3.2s forwards; }
.toast.xp { color: var(--lantern); }
.toast.badge, .toast.level { background: var(--lantern); color: var(--lantern-ink); border-color: var(--lantern); }
.toast.err { border-color: var(--block); color: #ffd0d0; }
@keyframes toast { 0% { opacity: 0; transform: translateY(-6px); } 8%, 82% { opacity: 1; transform: none; } 100% { opacity: 0; } }
.modal { position: absolute; inset: 0; background: rgba(6, 18, 26, 0.6); display: grid; place-items: center; z-index: 30; padding: 16px; }
.modal .box { width: min(560px, 100%); max-height: 90vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 22px 24px; }
.modal h2 { margin: 0 0 6px; font-variation-settings: 'CASL' 1; font-size: 22px; }
.intro { position: absolute; inset: 0; z-index: 40; display: grid; place-items: center; background: radial-gradient(ellipse at center, rgba(18, 58, 79, 0.55), rgba(6, 18, 26, 0.88)); padding: 16px; }
.intro .box { width: min(620px, 100%); }
.intro h1 { font-size: clamp(40px, 7vw, 68px); line-height: 0.95; margin: 0 0 10px; font-variation-settings: 'CASL' 1, 'slnt' -8; font-weight: 900; letter-spacing: -0.02em; }
.intro .sub { font-size: 18px; color: #cfe1e6; margin: 0 0 22px; max-width: 34em; }
.intro dl { display: grid; grid-template-columns: 9.5em 1fr; gap: 9px 16px; margin: 0 0 24px; font-size: 15px; }
.intro dt { font-weight: 800; color: var(--lantern); font-variation-settings: 'CASL' 1; }
.intro dd { margin: 0; color: #d7e6ea; }
.boot { position: absolute; inset: 0; display: grid; place-items: center; font-size: 18px; color: var(--muted); background: var(--sea); z-index: 50; font-variation-settings: 'CASL' 1; }
.boot.err { color: #ffd0d0; padding: 24px; text-align: center; }

@media (max-width: 760px) {
  .hud-top { padding: 8px; gap: 6px; }
  .where, .me { padding: 3px 6px 3px 10px; }
  .crumbs { max-width: 46vw; font-size: 14px; }
  .xp .bar { width: 50px; }
  .mastery, .tabs kbd { display: none; }
  .tabs .btn { padding: 6px 7px; font-size: 13px; }
  .btn { white-space: nowrap; }
  body.in-world #crumb-repo { display: none; }
  body.in-world .crumbs #crumb-world::before { content: ''; }
  .xp .bar, .opt-desk { display: none !important; }
  .flowctl { gap: 6px; }
  .flowctl select { max-width: 100%; flex: 1 1 60%; }
  .drawer { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 62vh; }
  .dock { left: 8px; right: 8px; bottom: 8px; padding: 8px; }
  body.drawer-open .dock { display: none; }
  .hint { bottom: 170px; }
  .intro dl { grid-template-columns: 1fr; gap: 2px; }
  .intro dd { margin-bottom: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  .toast { animation-duration: 0.01s; animation-delay: 3s; animation-fill-mode: both; }
}

/* ---------- missions ---------- */
.mhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.mtitle { font-variation-settings: 'CASL' 1; font-size: 17px; margin-right: 10px; }
.mgoal { font-size: 13.5px; color: var(--muted); }
.mgoal.ok { color: var(--pass); }
.btn.big { font-size: 15px; padding: 9px 16px; max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; }
.mflows { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 14px; max-height: 26vh; overflow-y: auto; scrollbar-width: thin; }
.mflow { min-width: 0; }
.mf-name { font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mf-name .tick { color: var(--pass); }
.mcase { display: flex; gap: 8px; align-items: baseline; width: 100%; text-align: left; border: 1px solid transparent; background: rgba(234, 244, 244, 0.05); border-radius: 9px; padding: 5px 9px; margin: 3px 0; cursor: pointer; font-size: 13.5px; }
.mcase:hover { border-color: var(--lantern); }
.mcase.next { border-color: rgba(255, 200, 87, 0.7); background: rgba(255, 200, 87, 0.1); }
.mcase .stars { color: rgba(234, 244, 244, 0.28); letter-spacing: 1px; flex: none; font-size: 13px; }
.mcase.done .stars { color: var(--lantern); }
.mc-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dock.mission { border-color: rgba(255, 200, 87, 0.55); }
.mbar { display: flex; gap: 14px; align-items: center; }
.hearts { font-size: 24px; color: var(--block); letter-spacing: 3px; flex: none; line-height: 1; }
.mb-case { min-width: 0; flex: 1; }
.mb-case b { font-variation-settings: 'CASL' 1; }

<script>window.CODEQUEST_WORLD={"schemaVersion":1,"repo":{"name":"claude-quickstarts","url":"https://github.com/anthropics/claude-quickstarts","branch":"main","commit":"3994db7dc2464d9ab255aba1dfda3594fc994c21","mappedAt":"2026-10-02T09:01:42.529Z"},"summary":"A collection of small, independent starter apps that show how to build with Claude: a bare agent loop, a two-agent autonomous coder, a support chat with a knowledge base, a data analyst that draws charts, and an agent that drives a desktop. Each app is its own world; the roads between them are shared ideas, not shared code.","worlds":[{"id":"agent-forge","name":"agents","theme":"volcano","tagline":"Where a question goes round the model-and-tools loop until Claude stops asking for tools","summary":"A small teaching example of an LLM agent. The Agent sends the chat history to Claude, runs any tools Claude asks for, adds the results to the history and calls Claude again, until a reply has no tool calls. It can also plug in tools from MCP servers, and it trims old history when the token count gets too high.","paths":["agents/"],"districts":[{"id":"gate","name":"Start-up gate"},{"id":"core","name":"Loop core"},{"id":"memory","name":"History vault"},{"id":"tools","name":"Tool shrines"},{"id":"beyond","name":"Outside services"}],"entities":[{"id":"run-entry","kind":"entry","name":"agent.run / run_async","district":"gate","summary":"The front door. You call run() with a question; it connects MCP servers, runs the loop, and returns Claude's last reply.","details":"- run() just wraps run_async() in asyncio.run()\n- run_async() opens an AsyncExitStack so MCP connections close at the end\n- MCP tools are added to self.tools only for this run\n- A finally block puts the original tool list back, even on errors","source":[{"file":"agents/agent.py","lines":[157,173],"anchor":"async def run_async(self, user_input: str)","snippet":"    async def run_async(self, user_input: str) -> list[dict[str, Any]]:\n        \"\"\"Run agent with MCP tools asynchronously.\"\"\"\n        async with AsyncExitStack() as stack:\n            original_tools = list(self.tools)\n\n            try:\n                mcp_tools = await setup_mcp_connections(\n                    self.mcp_servers, stack\n                )\n                self.tools.extend(mcp_tools)\n                return await self._agent_loop(user_input)\n            finally:\n                self.tools = original_tools\n\n    def run(self, user_input: str) -> list[dict[str, Any]]:\n        \"\"\"Run agent synchronously\"\"\"\n        return asyncio.run(self.run_async(user_input))","fileHash":"44abd1b32eb7f31ecbe7b8ee28b9d184d96b231c"}]},{"id":"model-config","kind":"config","name":"ModelConfig and system prompt","district":"gate","summary":"The settings for each Claude call: model name, max_tokens, temperature, context window size, plus the system prompt string the caller passes in.","details":"- Defaults: claude-sonnet-4-20250514, max_tokens 4096, temperature 1.0\n- context_window_tokens 180000 is the trim limit for history\n- The system prompt is just a string given to Agent(...)\n- API key comes from ANTHROPIC_API_KEY, empty string if missing","source":[{"file":"agents/agent.py","lines":[17,30],"anchor":"class ModelConfig:","snippet":"@dataclass\nclass ModelConfig:\n    \"\"\"Configuration settings for Claude model parameters.\"\"\"\n\n    # Available models include:\n    # - claude-sonnet-4-20250514 (default)\n    # - claude-opus-4-20250514\n    # - claude-haiku-4-5-20251001\n    # - claude-3-5-sonnet-20240620\n    # - claude-3-haiku-20240307\n    model: str = \"claude-sonnet-4-20250514\"\n    max_tokens: int = 4096\n    temperature: float = 1.0\n    context_window_tokens: int = 180000","fileHash":"44abd1b32eb7f31ecbe7b8ee28b9d184d96b231c"},{"file":"agents/agent.py","lines":[60,69],"anchor":"api_key=os.environ.get(\"ANTHROPIC_API_KEY\", \"\")","snippet":"        self.name = name\n        self.system = system\n        self.verbose = verbose\n        self.tools = list(tools or [])\n        self.config = config or ModelConfig()\n        self.mcp_servers = mcp_servers or []\n        self.message_params = message_params or {}\n        self.client = client or Anthropic(\n            api_key=os.environ.get(\"ANTHROPIC_API_KEY\", \"\")\n        )","fileHash":"44abd1b32eb7f31ecbe7b8ee28b9d184d96b231c"}]},{"id":"mcp-config-check","kind":"guardrail","name":"MCP config check","district":"gate","summary":"Looks at each MCP server config and refuses ones that cannot work, before any connection is tried.","details":"- type defaults to stdio\n- stdio needs a command, sse needs a url\n- Any other type is rejected\n- The ValueError is caught one level up, so the server is skipped, not fatal","source":[{"file":"agents/utils/connections.py","lines":[93,114],"anchor":"raise ValueError(\"Command is required for STDIO connections\")","snippet":"def create_mcp_connection(config: dict[str, Any]) -> MCPConnection:\n    \"\"\"Factory function to create the appropriate MCP connection.\"\"\"\n    conn_type = config.get(\"type\", \"stdio\").lower()\n\n    if conn_type == \"stdio\":\n        if not config.get(\"command\"):\n            raise ValueError(\"Command is required for STDIO connections\")\n        return MCPConnectionStdio(\n            command=config[\"command\"],\n            args=config.get(\"args\"),\n            env=config.get(\"env\"),\n        )\n\n    elif conn_type == \"sse\":\n        if not config.get(\"url\"):\n            raise ValueError(\"URL is required for SSE connections\")\n        return MCPConnectionSSE(\n            url=config[\"url\"], headers=config.get(\"headers\")\n        )\n\n    else:\n        raise ValueError(f\"Unsupported connection type: {conn_type}\")","fileHash":"b52992d9ebf05212aa4f05d69c70064e8a3c9858"}],"guard":{"rule":"An MCP server config must have a known type and the field that type needs","checks":"type is stdio (needs command) or sse (needs url)","onFail":"ValueError is raised, printed as 'Error setting up MCP server', and that server is skipped"}},{"id":"mcp-connector","kind":"module","name":"MCP connector","district":"gate","summary":"Opens a session to each MCP server, asks it for its tool list, and turns each tool into an MCPTool the agent can call.","details":"- One connection per server config, kept open on the exit stack\n- Connects, runs session.initialize(), then list_tools()\n- Any error for one server is printed and that server is skipped\n- Prints how many MCP tools were loaded","source":[{"file":"agents/utils/connections.py","lines":[117,150],"anchor":"async def setup_mcp_connections(","snippet":"async def setup_mcp_connections(\n    mcp_servers: list[dict[str, Any]] | None,\n    stack: AsyncExitStack,\n) -> list[MCPTool]:\n    \"\"\"Set up MCP server connections and create tool interfaces.\"\"\"\n    if not mcp_servers:\n        return []\n\n    mcp_tools = []\n\n    for config in mcp_servers:\n        try:\n            connection = create_mcp_connection(config)\n            await stack.enter_async_context(connection)\n            tool_definitions = await connection.list_tools()\n\n            for tool_info in tool_definitions:\n                mcp_tools.append(\n                    MCPTool(\n                        name=tool_info.name,\n                        description=tool_info.description\n                        or f\"MCP tool: {tool_info.name}\",\n                        input_schema=tool_info.inputSchema,\n                        connection=connection,\n                    )\n                )\n\n        except Exception as e:\n            print(f\"Error setting up MCP server {config}: {e}\")\n\n    print(\n        f\"Loaded {len(mcp_tools)} MCP tools from {len(mcp_servers)} servers.\"\n    )\n    return mcp_tools","fileHash":"b52992d9ebf05212aa4f05d69c70064e8a3c9858"},{"file":"agents/utils/connections.py","lines":[26,34],"anchor":"async def __aenter__(self):","snippet":"    async def __aenter__(self):\n        \"\"\"Initialize MCP server connection.\"\"\"\n        self._rw_ctx = await self._create_rw_context()\n        read_write = await self._rw_ctx.__aenter__()\n        read, write = read_write\n        self._session_ctx = ClientSession(read, write)\n        self.session = await self._session_ctx.__aenter__()\n        await self.session.initialize()\n        return self","fileHash":"b52992d9ebf05212aa4f05d69c70064e8a3c9858"}]},{"id":"forge-agent","kind":"agent","name":"The Agent","district":"core","summary":"The loop itself. Calls Claude, saves the reply, runs any tool calls, adds the results, and goes again until Claude answers without tools.","details":"- Adds the user's text to history first\n- Each pass: trim history, build params, call Claude\n- Only blocks with type 'tool_use' are run locally\n- No tool calls in the reply means done: the whole response is returned\n- There is no limit on the number of passes","source":[{"file":"agents/agent.py","lines":[96,155],"anchor":"async def _agent_loop(self, user_input: str)","snippet":"    async def _agent_loop(self, user_input: str) -> list[dict[str, Any]]:\n        \"\"\"Process user input and handle tool calls in a loop\"\"\"\n        if self.verbose:\n            print(f\"\\n[{self.name}] Received: {user_input}\")\n        await self.history.add_message(\"user\", user_input, None)\n\n        tool_dict = {tool.name: tool for tool in self.tools}\n\n        while True:\n            self.history.truncate()\n            params = self._prepare_message_params()\n\n            # Merge headers properly - default beta header can be overridden by message_params\n            default_headers = {\"anthropic-beta\": \"code-execution-2025-05-22\"}\n            if \"extra_headers\" in params:\n                # Pop extra_headers from params and merge with defaults\n                custom_headers = params.pop(\"extra_headers\")\n                merged_headers = {**default_headers, **custom_headers}\n            else:\n                merged_headers = default_headers\n\n            response = self.client.messages.create(\n                **params,\n                extra_headers=merged_headers\n            )\n            tool_calls = [\n                block for block in response.content if block.type == \"tool_use\"\n            ]\n\n            if self.verbose:\n                for block in response.content:\n                    if block.type == \"text\":\n                        print(f\"\\n[{self.name}] Output: {block.text}\")\n                    elif block.type == \"tool_use\":\n                        params_str = \", \".join(\n                            [f\"{k}={v}\" for k, v in block.input.items()]\n                        )\n                        print(\n                            f\"\\n[{self.name}] Tool call: \"\n                            f\"{block.name}({params_str})\"\n                        )\n\n            await self.history.add_message(\n                \"assistant\", response.content, response.usage\n            )\n\n            if tool_calls:\n                tool_results = await execute_tools(\n                    tool_calls,\n                    tool_dict,\n                )\n                if self.verbose:\n                    for block in tool_results:\n                        print(\n                            f\"\\n[{self.name}] Tool result: \"\n                            f\"{block.get('content')}\"\n                        )\n                await self.history.add_message(\"user\", tool_results)\n            else:\n                return response","fileHash":"44abd1b32eb7f31ecbe7b8ee28b9d184d96b231c"},{"file":"agents/agent.py","lines":[33,75],"anchor":"class Agent:","snippet":"class Agent:\n    \"\"\"Claude-powered agent with tool use capabilities.\"\"\"\n\n    def __init__(\n        self,\n        name: str,\n        system: str,\n        tools: list[Tool] | None = None,\n        mcp_servers: list[dict[str, Any]] | None = None,\n        config: ModelConfig | None = None,\n        verbose: bool = False,\n        client: Anthropic | None = None,\n        message_params: dict[str, Any] | None = None,\n    ):\n        \"\"\"Initialize an Agent.\n        \n        Args:\n            name: Agent identifier for logging\n            system: System prompt for the agent\n            tools: List of tools available to the agent\n            mcp_servers: MCP server configurations\n            config: Model configuration with defaults\n            verbose: Enable detailed logging\n            client: Anthropic client instance\n            message_params: Additional parameters for client.messages.create().\n                           These override any conflicting parameters from config.\n        \"\"\"\n        self.name = name\n        self.system = system\n        self.verbose = verbose\n        self.tools = list(tools or [])\n        self.config = config or ModelConfig()\n        self.mcp_servers = mcp_servers or []\n        self.message_params = message_params or {}\n        self.client = client or Anthropic(\n            api_key=os.environ.get(\"ANTHROPIC_API_KEY\", \"\")\n        )\n        self.history = MessageHistory(\n            model=self.config.model,\n            system=self.system,\n            context_window_tokens=self.config.context_window_tokens,\n            client=self.client,\n        )","fileHash":"44abd1b32eb7f31ecbe7b8ee28b9d184d96b231c"}],"agent":{"role":"Answers a user question by calling Claude and running the tools Claude asks for, in a loop","model":"claude-sonnet-4-20250514","tools":["file-read-tool","file-write-tool","think-tool","server-tools","mcp-tool"],"prompt":"model-config"}},{"id":"param-builder","kind":"module","name":"Request builder","district":"core","summary":"Builds the arguments for each Claude call from the config, history and tools, then lets message_params override anything.","details":"- Starts from model, max_tokens, temperature, system, messages, tools\n- **self.message_params goes last, so it wins on any clash\n- Adds a default anthropic-beta header for code execution\n- Custom extra_headers are merged on top and can replace that beta header","source":[{"file":"agents/agent.py","lines":[80,94],"anchor":"**self.message_params,","snippet":"    def _prepare_message_params(self) -> dict[str, Any]:\n        \"\"\"Prepare parameters for client.messages.create() call.\n        \n        Returns a dict with base parameters from config, with any\n        message_params overriding conflicting keys.\n        \"\"\"\n        return {\n            \"model\": self.config.model,\n            \"max_tokens\": self.config.max_tokens,\n            \"temperature\": self.config.temperature,\n            \"system\": self.system,\n            \"messages\": self.history.format_for_api(),\n            \"tools\": [tool.to_dict() for tool in self.tools],\n            **self.message_params,\n        }","fileHash":"44abd1b32eb7f31ecbe7b8ee28b9d184d96b231c"},{"file":"agents/agent.py","lines":[108,120],"anchor":"default_headers = {\"anthropic-beta\": \"code-execution-2025-05-22\"}","snippet":"            # Merge headers properly - default beta header can be overridden by message_params\n            default_headers = {\"anthropic-beta\": \"code-execution-2025-05-22\"}\n            if \"extra_headers\" in params:\n                # Pop extra_headers from params and merge with defaults\n                custom_headers = params.pop(\"extra_headers\")\n                merged_headers = {**default_headers, **custom_headers}\n            else:\n                merged_headers = default_headers\n\n            response = self.client.messages.create(\n                **params,\n                extra_headers=merged_headers\n            )","fileHash":"44abd1b32eb7f31ecbe7b8ee28b9d184d96b231c"}]},{"id":"tool-runner","kind":"guardrail","name":"Tool runner","district":"core","summary":"Runs every tool call from one reply, in parallel, and makes sure a broken or unknown tool turns into an error message instead of a crash.","details":"- Looks the tool up by name in tool_dict\n- Unknown name -> \"Tool '...' not found\" with is_error\n- Any other exception -> 'Error executing tool: ...' with is_error\n- Results are str() of whatever the tool returned\n- Uses asyncio.gather, so calls run at the same time","source":[{"file":"agents/utils/tool_util.py","lines":[7,24],"anchor":"async def _execute_single_tool(","snippet":"async def _execute_single_tool(\n    call: Any, tool_dict: dict[str, Any]\n) -> dict[str, Any]:\n    \"\"\"Execute a single tool and handle errors.\"\"\"\n    response = {\"type\": \"tool_result\", \"tool_use_id\": call.id}\n\n    try:\n        # Execute the tool directly\n        result = await tool_dict[call.name].execute(**call.input)\n        response[\"content\"] = str(result)\n    except KeyError:\n        response[\"content\"] = f\"Tool '{call.name}' not found\"\n        response[\"is_error\"] = True\n    except Exception as e:\n        response[\"content\"] = f\"Error executing tool: {str(e)}\"\n        response[\"is_error\"] = True\n\n    return response","fileHash":"3871afa47e83d42a1c3ab51c0c0a160d28c9e13f"},{"file":"agents/utils/tool_util.py","lines":[27,39],"anchor":"return await asyncio.gather(","snippet":"async def execute_tools(\n    tool_calls: list[Any], tool_dict: dict[str, Any], parallel: bool = True\n) -> list[dict[str, Any]]:\n    \"\"\"Execute multiple tools sequentially or in parallel.\"\"\"\n\n    if parallel:\n        return await asyncio.gather(\n            *[_execute_single_tool(call, tool_dict) for call in tool_calls]\n        )\n    else:\n        return [\n            await _execute_single_tool(call, tool_dict) for call in tool_calls\n        ]","fileHash":"3871afa47e83d42a1c3ab51c0c0a160d28c9e13f"}],"guard":{"rule":"A failing or unknown tool must never crash the agent loop","checks":"tool name exists in tool_dict and execute() does not raise","onFail":"A tool_result with is_error=True and an error text is sent back to Claude"}},{"id":"message-history","kind":"store","name":"Message history","district":"memory","summary":"The list of chat messages sent to Claude each time, plus a running token count used to decide when to trim.","details":"- Starts the token count at the size of the system prompt (count_tokens, or length/4 if that fails)\n- Plain strings are wrapped as text blocks\n- Only assistant messages with usage update the token count\n- format_for_api marks the last message with cache_control for prompt caching","source":[{"file":"agents/utils/history_util.py","lines":[6,67],"anchor":"class MessageHistory:","snippet":"class MessageHistory:\n    \"\"\"Manages chat history with token tracking and context management.\"\"\"\n\n    def __init__(\n        self,\n        model: str,\n        system: str,\n        context_window_tokens: int,\n        client: Any,\n        enable_caching: bool = True,\n    ):\n        self.model = model\n        self.system = system\n        self.context_window_tokens = context_window_tokens\n        self.messages: list[dict[str, Any]] = []\n        self.total_tokens = 0\n        self.enable_caching = enable_caching\n        self.message_tokens: list[tuple[int, int]] = (\n            []\n        )  # List of (input_tokens, output_tokens) tuples\n        self.client = client\n\n        # set initial total tokens to system prompt\n        try:\n            system_token = (\n                self.client.messages.count_tokens(\n                    model=self.model,\n                    system=self.system,\n                    messages=[{\"role\": \"user\", \"content\": \"test\"}],\n                ).input_tokens\n                - 1\n            )\n\n        except Exception:\n            system_token = len(self.system) / 4\n\n        self.total_tokens = system_token\n\n    async def add_message(\n        self,\n        role: str,\n        content: str | list[dict[str, Any]],\n        usage: Any | None = None,\n    ):\n        \"\"\"Add a message to the history and track token usage.\"\"\"\n        if isinstance(content, str):\n            content = [{\"type\": \"text\", \"text\": content}]\n\n        message = {\"role\": role, \"content\": content}\n        self.messages.append(message)\n\n        if role == \"assistant\" and usage:\n            total_input = (\n                usage.input_tokens\n                + getattr(usage, \"cache_read_input_tokens\", 0)\n                + getattr(usage, \"cache_creation_input_tokens\", 0)\n            )\n            output_tokens = usage.output_tokens\n\n            current_turn_input = total_input - self.total_tokens","snippetCut":true,"fileHash":"dadaf38378a987fd8ec0b730fe7fd1c18f5bbf7a"},{"file":"agents/utils/history_util.py","lines":[113,124],"anchor":"\"cache_control\": {\"type\": \"ephemeral\"}","snippet":"    def format_for_api(self) -> list[dict[str, Any]]:\n        \"\"\"Format messages for Claude API with optional caching.\"\"\"\n        result = [\n            {\"role\": m[\"role\"], \"content\": m[\"content\"]} for m in self.messages\n        ]\n\n        if self.enable_caching and self.messages:\n            result[-1][\"content\"] = [\n                {**block, \"cache_control\": {\"type\": \"ephemeral\"}}\n                for block in self.messages[-1][\"content\"]\n            ]\n        return result","fileHash":"dadaf38378a987fd8ec0b730fe7fd1c18f5bbf7a"}]},{"id":"context-trimmer","kind":"guardrail","name":"Context trimmer","district":"memory","summary":"Before each Claude call, drops the oldest messages two at a time while the tracked token count is over the window.","details":"- Does nothing if total_tokens \u003c= context_window_tokens\n- Pops the two oldest messages and subtracts their recorded tokens\n- Replaces the new first message with '[Earlier history has been truncated.]'\n- Counts that notice as 25 tokens\n- Repeats while still over the limit","source":[{"file":"agents/utils/history_util.py","lines":[69,111],"anchor":"def truncate(self) -> None:","snippet":"    def truncate(self) -> None:\n        \"\"\"Remove oldest messages when context window limit is exceeded.\"\"\"\n        if self.total_tokens \u003c= self.context_window_tokens:\n            return\n\n        TRUNCATION_NOTICE_TOKENS = 25\n        TRUNCATION_MESSAGE = {\n            \"role\": \"user\",\n            \"content\": [\n                {\n                    \"type\": \"text\",\n                    \"text\": \"[Earlier history has been truncated.]\",\n                }\n            ],\n        }\n\n        def remove_message_pair():\n            self.messages.pop(0)\n            self.messages.pop(0)\n\n            if self.message_tokens:\n                input_tokens, output_tokens = self.message_tokens.pop(0)\n                self.total_tokens -= input_tokens + output_tokens\n\n        while (\n            self.message_tokens\n            and len(self.messages) >= 2\n            and self.total_tokens > self.context_window_tokens\n        ):\n            remove_message_pair()\n\n            if self.messages and self.message_tokens:\n                original_input_tokens, original_output_tokens = (\n                    self.message_tokens[0]\n                )\n                self.messages[0] = TRUNCATION_MESSAGE\n                self.message_tokens[0] = (\n                    TRUNCATION_NOTICE_TOKENS,\n                    original_output_tokens,\n                )\n                self.total_tokens += (\n                    TRUNCATION_NOTICE_TOKENS - original_input_tokens\n                )","fileHash":"dadaf38378a987fd8ec0b730fe7fd1c18f5bbf7a"}],"guard":{"rule":"Tracked history must stay within context_window_tokens","checks":"self.total_tokens > self.context_window_tokens","onFail":"Oldest message pairs are removed and a truncation notice takes their place"}},{"id":"file-read-tool","kind":"skill","name":"file_read tool","district":"tools","summary":"Lets Claude read a file or list a folder on the local disk.","details":"- operation 'read' or 'list'\n- read: checks the path exists and is a file, max_lines 0 means whole file\n- list: glob with a pattern, default '*'\n- Errors come back as normal text like 'Error: File not found at ...'\n- No limit on which paths can be read","source":[{"file":"agents/tools/file_tools.py","lines":[11,135],"anchor":"class FileReadTool(Tool):","snippet":"class FileReadTool(Tool):\n    \"\"\"Tool for reading files and listing directories.\"\"\"\n\n    def __init__(self):\n        super().__init__(\n            name=\"file_read\",\n            description=\"\"\"\n            Read files or list directory contents.\n\n            Operations:\n            - read: Read the contents of a file\n            - list: List files in a directory\n            \"\"\",\n            input_schema={\n                \"type\": \"object\",\n                \"properties\": {\n                    \"operation\": {\n                        \"type\": \"string\",\n                        \"enum\": [\"read\", \"list\"],\n                        \"description\": \"File operation to perform\",\n                    },\n                    \"path\": {\n                        \"type\": \"string\",\n                        \"description\": \"File path for read or directory path\",\n                    },\n                    \"max_lines\": {\n                        \"type\": \"integer\",\n                        \"description\": \"Maximum lines to read (0 means no limit)\",\n                    },\n                    \"pattern\": {\n                        \"type\": \"string\",\n                        \"description\": \"File pattern to match\",\n                    },\n                },\n                \"required\": [\"operation\", \"path\"],\n            },\n        )\n\n    async def execute(\n        self,\n        operation: str,\n        path: str,\n        max_lines: int = 0,\n        pattern: str = \"*\",\n    ) -> str:\n        \"\"\"Execute a file read operation.\n\n        Args:\n            operation: The operation to perform (read or list)\n            path: The file or directory path\n            max_lines: Maximum lines to read (for read operation, 0 means no limit)\n            pattern: File pattern to match (for list operation)\n\n        Returns:\n            Result of the operation as string\n        \"\"\"\n        if operation == \"read\":\n            return await self._read_file(path, max_lines)\n        elif operation == \"list\":\n            return await self._list_files(path, pattern)","snippetCut":true,"fileHash":"c2bf555ec6d619bbaea08f247ab342d62940701e"}]},{"id":"file-write-tool","kind":"skill","name":"file_write tool","district":"tools","summary":"Lets Claude create, overwrite or edit files on the local disk.","details":"- write: needs non-empty content, creates missing parent folders\n- edit: needs old_text and new_text, old_text must be in the file\n- If old_text appears many times, all copies are replaced with a warning\n- No limit on which paths can be written","source":[{"file":"agents/tools/file_tools.py","lines":[138,277],"anchor":"class FileWriteTool(Tool):","snippet":"class FileWriteTool(Tool):\n    \"\"\"Tool for writing and editing files.\"\"\"\n\n    def __init__(self):\n        super().__init__(\n            name=\"file_write\",\n            description=\"\"\"\n            Write or edit files.\n\n            Operations:\n            - write: Create or completely replace a file\n            - edit: Make targeted changes to parts of a file\n            \"\"\",\n            input_schema={\n                \"type\": \"object\",\n                \"properties\": {\n                    \"operation\": {\n                        \"type\": \"string\",\n                        \"enum\": [\"write\", \"edit\"],\n                        \"description\": \"File operation to perform\",\n                    },\n                    \"path\": {\n                        \"type\": \"string\",\n                        \"description\": \"File path to write to or edit\",\n                    },\n                    \"content\": {\n                        \"type\": \"string\",\n                        \"description\": \"Content to write\",\n                    },\n                    \"old_text\": {\n                        \"type\": \"string\",\n                        \"description\": \"Text to replace (for edit operation)\",\n                    },\n                    \"new_text\": {\n                        \"type\": \"string\",\n                        \"description\": \"Replacement text (for edit operation)\",\n                    },\n                },\n                \"required\": [\"operation\", \"path\"],\n            },\n        )\n\n    async def execute(\n        self,\n        operation: str,\n        path: str,\n        content: str = \"\",\n        old_text: str = \"\",\n        new_text: str = \"\",\n    ) -> str:\n        \"\"\"Execute a file write operation.\n\n        Args:\n            operation: The operation to perform (write or edit)\n            path: The file path\n            content: Content to write (for write operation)\n            old_text: Text to replace (for edit operation)\n            new_text: Replacement text (for edit operation)\n\n        Returns:","snippetCut":true,"fileHash":"c2bf555ec6d619bbaea08f247ab342d62940701e"}]},{"id":"think-tool","kind":"skill","name":"think tool","district":"tools","summary":"A scratchpad tool. Claude writes a thought into it; the tool does nothing and replies 'Thinking complete!'.","details":"- The thought is only kept because it sits in the tool_use block in history\n- Gives Claude a place to reason between other tool calls","source":[{"file":"agents/tools/think.py","lines":[6,32],"anchor":"return \"Thinking complete!\"","snippet":"class ThinkTool(Tool):\n    \"\"\"Tool for internal reasoning without executing external actions.\"\"\"\n\n    def __init__(self):\n        super().__init__(\n            name=\"think\",\n            description=(\n                \"Use the tool to think about something. It will not obtain \"\n                \"new information or change the database, but just append the \"\n                \"thought to the log. Use it when complex reasoning or some \"\n                \"cache memory is needed.\"\n            ),\n            input_schema={\n                \"type\": \"object\",\n                \"properties\": {\n                    \"thought\": {\n                        \"type\": \"string\",\n                        \"description\": \"A thought to think about.\",\n                    }\n                },\n                \"required\": [\"thought\"],\n            },\n        )\n\n    async def execute(self, thought: str) -> str:\n        \"\"\"Simply returns the thought back to the model.\"\"\"\n        return \"Thinking complete!\"","fileHash":"99f5241aa033c6b81bde17efca28740a350a491d"}]},{"id":"server-tools","kind":"skill","name":"Server tools (web search, code execution)","district":"tools","summary":"Tools that Anthropic runs on its side. The agent only sends their description; it never runs them itself.","details":"- WebSearchServerTool can set max_uses, allowed/blocked domains, location\n- CodeExecutionServerTool needs the code-execution beta header\n- They have to_dict() but no execute()\n- Their blocks come back as server_tool_use, so the loop's 'tool_use' filter skips them","source":[{"file":"agents/tools/web_search.py","lines":[7,38],"anchor":"type: str = \"web_search_20250305\"","snippet":"@dataclass\nclass WebSearchServerTool:\n    \"\"\"Web search server tool that uses Anthropic's server tool format.\"\"\"\n    \n    name: str = \"web_search\"\n    type: str = \"web_search_20250305\"\n    max_uses: Optional[int] = None\n    allowed_domains: Optional[list[str]] = None\n    blocked_domains: Optional[list[str]] = None\n    user_location: Optional[dict[str, Any]] = None\n    \n    def to_dict(self) -> dict[str, Any]:\n        \"\"\"Convert to Anthropic server tool format.\"\"\"\n        tool_dict: dict[str, Any] = {\n            \"type\": self.type,\n            \"name\": self.name,\n        }\n        \n        # Add optional parameters if provided\n        if self.max_uses is not None:\n            tool_dict[\"max_uses\"] = self.max_uses\n            \n        if self.allowed_domains is not None:\n            tool_dict[\"allowed_domains\"] = self.allowed_domains\n            \n        if self.blocked_domains is not None:\n            tool_dict[\"blocked_domains\"] = self.blocked_domains\n            \n        if self.user_location is not None:\n            tool_dict[\"user_location\"] = self.user_location\n            \n        return tool_dict","fileHash":"56b0dc8ecc4c5a71c42170ea090f9869e44c51b2"},{"file":"agents/tools/code_execution.py","lines":[7,19],"anchor":"type: str = \"code_execution_20250522\"","snippet":"@dataclass\nclass CodeExecutionServerTool:\n    \"\"\"Code execution server tool that uses Anthropic's server tool format.\"\"\"\n    \n    name: str = \"code_execution\"\n    type: str = \"code_execution_20250522\"\n    \n    def to_dict(self) -> dict[str, Any]:\n        \"\"\"Convert to Anthropic server tool format.\"\"\"\n        return {\n            \"type\": self.type,\n            \"name\": self.name,\n        }","fileHash":"c7a58b69019adc410cd75afc2e973671d0912d6d"}]},{"id":"mcp-tool","kind":"skill","name":"MCPTool wrapper","district":"tools","summary":"Makes a tool from an MCP server look like a normal local tool. Calling it forwards the arguments to the server.","details":"- Name, description and schema come from the server's list_tools\n- Returns the first text item of the result only\n- No text -> 'No text content in tool response'\n- Catches its own errors and returns them as text","source":[{"file":"agents/tools/mcp_tool.py","lines":[8,36],"anchor":"class MCPTool(Tool):","snippet":"class MCPTool(Tool):\n    def __init__(\n        self,\n        name: str,\n        description: str,\n        input_schema: dict[str, Any],\n        connection: \"MCPConnection\",\n    ):\n        super().__init__(\n            name=name, description=description, input_schema=input_schema\n        )\n        self.connection = connection\n\n    async def execute(self, **kwargs) -> str:\n        \"\"\"Execute the MCP tool with the given input_schema.\n        Note: Currently only supports text results from MCP tools.\"\"\"\n        try:\n            result = await self.connection.call_tool(\n                self.name, arguments=kwargs\n            )\n\n            if hasattr(result, \"content\") and result.content:\n                for item in result.content:\n                    if getattr(item, \"type\", None) == \"text\":\n                        return item.text\n\n            return \"No text content in tool response\"\n        except Exception as e:\n            return f\"Error executing {self.name}: {e}\"","fileHash":"9f018a67b0b5ee178d5b8e8945a6ad212fb45b46"}]},{"id":"anthropic-api","kind":"external","name":"Anthropic Messages API","district":"beyond","summary":"Claude itself. Called once per loop pass with messages.create, and once at start-up with count_tokens to size the system prompt.","details":"- messages.create is not wrapped in try/except, so its errors go straight up to the caller\n- count_tokens failure is caught and replaced by a rough length/4 guess\n- Returns usage numbers that feed the history token count","source":[{"file":"agents/agent.py","lines":[117,120],"anchor":"response = self.client.messages.create(","snippet":"            response = self.client.messages.create(\n                **params,\n                extra_headers=merged_headers\n            )","fileHash":"44abd1b32eb7f31ecbe7b8ee28b9d184d96b231c"},{"file":"agents/utils/history_util.py","lines":[29,40],"anchor":"self.client.messages.count_tokens(","snippet":"        try:\n            system_token = (\n                self.client.messages.count_tokens(\n                    model=self.model,\n                    system=self.system,\n                    messages=[{\"role\": \"user\", \"content\": \"test\"}],\n                ).input_tokens\n                - 1\n            )\n\n        except Exception:\n            system_token = len(self.system) / 4","fileHash":"dadaf38378a987fd8ec0b730fe7fd1c18f5bbf7a"}]},{"id":"mcp-servers","kind":"external","name":"MCP servers","district":"beyond","summary":"Separate programs that offer tools over MCP, reached by a local process (stdio) or over HTTP (SSE). A small calculator server is included.","details":"- stdio: the agent starts the command as a child process\n- sse: the agent connects to a URL with optional headers\n- calculator_mcp.py offers one 'calculator' tool with + - * / ^ sqrt","source":[{"file":"agents/tools/calculator_mcp.py","lines":[9,55],"anchor":"@mcp.tool(name=\"calculator\")","snippet":"mcp = FastMCP(\"Calculator\")\n\n\n@mcp.tool(name=\"calculator\")\ndef calculator(number1: float, number2: float, operator: str) -> str:\n    \"\"\"Performs basic calculations with two numbers.\n\n    Args:\n        number1: First number in the calculation\n        number2: Second number in the calculation\n        operator: Operation symbol to perform (+, -, *, /, ^, sqrt)\n               Note: Only these exact symbols are supported, not words\n\n    Returns:\n        Result of the calculation\n    \"\"\"\n    try:\n        if operator == \"+\":\n            result = number1 + number2\n        elif operator == \"-\":\n            result = number1 - number2\n        elif operator == \"*\":\n            result = number1 * number2\n        elif operator == \"/\":\n            if number2 == 0:\n                return \"Error: Division by zero\"\n            result = number1 / number2\n        elif operator == \"^\":\n            result = number1**number2\n        elif operator == \"sqrt\":\n            if number1 \u003c 0:\n                return \"Error: Cannot take square root of negative number\"\n            result = math.sqrt(number1)\n        else:\n            return f\"Error: Unsupported operator '{operator}'\"\n\n        # Format the result\n        if isinstance(result, float) and result.is_integer():\n            result = int(result)\n\n        return f\"Result: {result}\"\n    except Exception as e:\n        return f\"Error: {str(e)}\"\n\n\nif __name__ == \"__main__\":\n    mcp.run()","fileHash":"d4d32511edb48b1d8a8c9e5ef72fbb9bbcd03bb1"},{"file":"agents/utils/connections.py","lines":[62,90],"anchor":"class MCPConnectionStdio(MCPConnection):","snippet":"class MCPConnectionStdio(MCPConnection):\n    \"\"\"MCP connection using standard input/output.\"\"\"\n\n    def __init__(\n        self, command: str, args: list[str] = [], env: dict[str, str] = None\n    ):\n        super().__init__()\n        self.command = command\n        self.args = args\n        self.env = env\n\n    async def _create_rw_context(self):\n        return stdio_client(\n            StdioServerParameters(\n                command=self.command, args=self.args, env=self.env\n            )\n        )\n\n\nclass MCPConnectionSSE(MCPConnection):\n    \"\"\"MCP connection using Server-Sent Events.\"\"\"\n\n    def __init__(self, url: str, headers: dict[str, str] = None):\n        super().__init__()\n        self.url = url\n        self.headers = headers or {}\n\n    async def _create_rw_context(self):\n        return sse_client(url=self.url, headers=self.headers)","fileHash":"b52992d9ebf05212aa4f05d69c70064e8a3c9858"}]}],"flows":[{"id":"agent-loop","name":"One question through the loop","trigger":"Code calls agent.run(\"...\")","summary":"The question is added to history, then the agent keeps calling Claude and running tools until a reply has no tool calls.","start":"s1","steps":[{"id":"s1","at":"run-entry","action":"Starts the async run, loads MCP tools, then enters the loop","carries":"user_input: 'What is 17 * 23?'","source":{"file":"agents/agent.py","lines":[157,173],"anchor":"return await self._agent_loop(user_input)","snippet":"    async def run_async(self, user_input: str) -> list[dict[str, Any]]:\n        \"\"\"Run agent with MCP tools asynchronously.\"\"\"\n        async with AsyncExitStack() as stack:\n            original_tools = list(self.tools)\n\n            try:\n                mcp_tools = await setup_mcp_connections(\n                    self.mcp_servers, stack\n                )\n                self.tools.extend(mcp_tools)\n                return await self._agent_loop(user_input)\n            finally:\n                self.tools = original_tools\n\n    def run(self, user_input: str) -> list[dict[str, Any]]:\n        \"\"\"Run agent synchronously\"\"\"\n        return asyncio.run(self.run_async(user_input))","fileHash":"44abd1b32eb7f31ecbe7b8ee28b9d184d96b231c"},"next":[{"to":"s2","when":"always"}],"screen":{"name":"agent.run() with verbose=True","kind":"terminal","blocks":[{"t":"text","text":"agent.run(\"\u003cthe question>\")"},{"t":"console","items":["[\u003cagent name>] Agent initialized"]},{"t":"text","text":"No screen of its own: these lines are printed only when verbose=True.","state":"muted"}],"note":"The script calls run(); the only line so far is the one printed when the agent was created."}},{"id":"s2","at":"message-history","action":"Adds the question as a user text message","carries":"{ role: 'user', content: [{ type: 'text', text: 'What is 17 * 23?' }] }","next":[{"to":"s3","when":"always"}],"screen":{"name":"agent.run() with verbose=True","kind":"terminal","blocks":[{"t":"title","text":"agent.run() with verbose=True"},{"t":"console","items":["[\u003cagent name>] Agent initialized"]},{"t":"console","items":["[\u003cagent name>] Received: \u003cthe question>"],"state":"active"}],"note":"A \"Received\" line with the question appears."}},{"id":"s3","at":"context-trimmer","action":"Trims old messages if the token count is over the window","source":{"file":"agents/agent.py","lines":[104,106],"anchor":"self.history.truncate()","snippet":"        while True:\n            self.history.truncate()\n            params = self._prepare_message_params()","fileHash":"44abd1b32eb7f31ecbe7b8ee28b9d184d96b231c"},"next":[{"to":"s4","when":"always"}]},{"id":"s4","at":"param-builder","action":"Builds model, system, messages, tools and headers for the call","carries":"{ model, max_tokens: 4096, messages: [...], tools: [...], extra_headers }","next":[{"to":"s5","when":"always"}]},{"id":"s5","at":"anthropic-api","action":"Sends the request to Claude","next":[{"to":"s6","when":"Claude replies"},{"to":"outcome:api-error","when":"the API raises (bad key, rate limit, request too big)"}]},{"id":"s6","at":"forge-agent","action":"Saves the reply in history and picks out the tool_use blocks","carries":"response.content, response.usage","source":{"file":"agents/agent.py","lines":[121,142],"anchor":"if tool_calls:","snippet":"            tool_calls = [\n                block for block in response.content if block.type == \"tool_use\"\n            ]\n\n            if self.verbose:\n                for block in response.content:\n                    if block.type == \"text\":\n                        print(f\"\\n[{self.name}] Output: {block.text}\")\n                    elif block.type == \"tool_use\":\n                        params_str = \", \".join(\n                            [f\"{k}={v}\" for k, v in block.input.items()]\n                        )\n                        print(\n                            f\"\\n[{self.name}] Tool call: \"\n                            f\"{block.name}({params_str})\"\n                        )\n\n            await self.history.add_message(\n                \"assistant\", response.content, response.usage\n            )\n\n            if tool_calls:","fileHash":"44abd1b32eb7f31ecbe7b8ee28b9d184d96b231c"},"next":[{"to":"s7","when":"reply has tool_use blocks"},{"to":"outcome:answered","when":"reply has no tool_use blocks"}],"screen":{"name":"agent.run() with verbose=True","kind":"terminal","blocks":[{"t":"title","text":"agent.run() with verbose=True"},{"t":"console","items":["[\u003cagent name>] Received: \u003cthe question>","[\u003cagent name>] Output: \u003cClaude's text>","[\u003cagent name>] Tool call: \u003ctool name>(\u003ckey>=\u003cvalue>, \u003ckey>=\u003cvalue>)"]},{"t":"text","text":"One line per block in the reply. A \"Tool call\" line shows up only if Claude asked for a tool.","state":"muted"}],"note":"Claude's reply is printed: its text, and any tool it wants to use."}},{"id":"s7","at":"tool-runner","action":"Runs all requested tools in parallel","carries":"[{ name: 'calculator', input: { number1: 17, number2: 23, operator: '*' } }]","next":[{"to":"s8","when":"always"}]},{"id":"s8","at":"message-history","action":"Adds the tool results as one user message, then loops back","carries":"[{ type: 'tool_result', tool_use_id, content: 'Result: 391' }]","next":[{"to":"s3","when":"always (next pass)"}],"screen":{"name":"agent.run() with verbose=True","kind":"terminal","blocks":[{"t":"title","text":"agent.run() with verbose=True"},{"t":"console","items":["[\u003cagent name>] Tool call: \u003ctool name>(\u003ckey>=\u003cvalue>, \u003ckey>=\u003cvalue>)"]},{"t":"console","items":["[\u003cagent name>] Tool result: \u003cthe tool's text>"],"state":"active"}],"note":"A \"Tool result\" line appears for each tool that ran."}}],"outcomes":[{"id":"answered","label":"Claude's final reply is returned","kind":"success","screen":{"name":"agent.run() with verbose=True","kind":"terminal","blocks":[{"t":"title","text":"agent.run() with verbose=True"},{"t":"console","items":["[\u003cagent name>] Received: \u003cthe question>","[\u003cagent name>] Output: \u003cClaude's final answer>"]},{"t":"text","text":"run() hands the reply object back to the calling code.","state":"ok"}],"note":"The last \"Output\" line is the answer; nothing else is printed."}},{"id":"api-error","label":"API error escapes to the caller","kind":"error","screen":{"name":"agent.run() with verbose=True","kind":"terminal","blocks":[{"t":"console","items":["[\u003cagent name>] Received: \u003cthe question>"]},{"t":"banner","text":"\u003cthe SDK's exception and Python traceback>","state":"error"},{"t":"text","text":"The library prints no message of its own for this.","state":"muted"}],"note":"The program stops with a raw Python error; there is no \"Output\" line."}}],"cases":[{"id":"c1","name":"Plain question, no tools needed","input":"agent with think tool, user asks 'Say hi'","path":["s1","s2","s3","s4","s5","s6"],"outcome":"answered","explain":"Claude answers with text only, so tool_calls is empty and the response is returned on the first pass.","brief":"An agent with one simple tool is asked to just say hi.","facts":["API key set","has a think tool","question needs no tool"]},{"id":"c2","name":"Question that needs the calculator","input":"calculator MCP server attached, user asks 'What is 17 * 23?'","path":["s1","s2","s3","s4","s5","s6","s7","s8","s3","s4","s5","s6"],"outcome":"answered","explain":"First reply asks for the calculator, the result 'Result: 391' is added, and the second reply has no tool calls.","brief":"An agent with a calculator is asked to multiply two numbers.","facts":["API key set","calculator attached","question needs a tool"]},{"id":"c3","name":"No API key set","input":"ANTHROPIC_API_KEY missing, user asks anything","path":["s1","s2","s3","s4","s5"],"outcome":"api-error","explain":"The client was built with an empty key. messages.create raises an auth error and nothing in the loop catches it.","brief":"Someone asks the agent a question but never set an API key.","facts":["API key missing","any question"]}]},{"id":"tool-call","name":"Claude asks to read a file","trigger":"A Claude reply contains a tool_use block","summary":"One tool call is looked up, run, and wrapped as a tool_result. Errors become messages for Claude, not crashes.","start":"t1","steps":[{"id":"t1","at":"forge-agent","action":"Collects tool_use blocks and has tool_dict ready (name -> tool)","carries":"{ id: 'toolu_1', name: 'file_read', input: { operation: 'read', path: 'notes.txt' } }","next":[{"to":"t2","when":"always"}],"screen":{"name":"agent.run() with verbose=True","kind":"terminal","blocks":[{"t":"title","text":"agent.run() with verbose=True"},{"t":"console","items":["[\u003cagent name>] Tool call: file_read(operation=read, path=\u003cfile path>)"]},{"t":"text","text":"Printed only when verbose=True.","state":"muted"}],"note":"The tool Claude asked for is printed with its inputs."}},{"id":"t2","at":"tool-runner","action":"Looks up tool_dict[call.name] and calls execute(**call.input)","source":{"file":"agents/utils/tool_util.py","lines":[11,16],"anchor":"result = await tool_dict[call.name].execute(**call.input)","snippet":"    response = {\"type\": \"tool_result\", \"tool_use_id\": call.id}\n\n    try:\n        # Execute the tool directly\n        result = await tool_dict[call.name].execute(**call.input)\n        response[\"content\"] = str(result)","fileHash":"3871afa47e83d42a1c3ab51c0c0a160d28c9e13f"},"next":[{"to":"t3","when":"name is in tool_dict"},{"to":"t6","when":"name is not in tool_dict (KeyError)"}]},{"id":"t3","at":"file-read-tool","action":"Checks the path exists and is a file","next":[{"to":"t4","when":"file exists"},{"to":"t5","when":"path missing or is a folder"}]},{"id":"t4","at":"file-read-tool","action":"Reads the file in a thread, up to max_lines (0 = all)","carries":"file text","next":[{"to":"t7","when":"always"}]},{"id":"t5","at":"file-read-tool","action":"Returns an error string as a normal result","carries":"'Error: File not found at notes.txt'","source":{"file":"agents/tools/file_tools.py","lines":[84,87],"anchor":"return f\"Error: File not found at {path}\"","snippet":"            if not file_path.exists():\n                return f\"Error: File not found at {path}\"\n            if not file_path.is_file():\n                return f\"Error: {path} is not a file\"","fileHash":"c2bf555ec6d619bbaea08f247ab342d62940701e"},"next":[{"to":"t7","when":"always"}]},{"id":"t6","at":"tool-runner","action":"Builds an error result: tool not found, is_error=True","carries":"{ content: \"Tool 'bash' not found\", is_error: true }","next":[{"to":"t8","when":"always"}]},{"id":"t7","at":"tool-runner","action":"Puts str(result) into a tool_result with the matching tool_use_id","carries":"{ type: 'tool_result', tool_use_id: 'toolu_1', content: '...' }","next":[{"to":"t8","when":"always"}]},{"id":"t8","at":"message-history","action":"Tool results are added as the next user message","next":[{"to":"outcome:result-sent","when":"is_error not set"},{"to":"outcome:error-sent","when":"is_error is true"}]}],"outcomes":[{"id":"result-sent","label":"Plain result goes back to Claude","kind":"success","screen":{"name":"agent.run() with verbose=True","kind":"terminal","blocks":[{"t":"title","text":"agent.run() with verbose=True"},{"t":"console","items":["[\u003cagent name>] Tool call: file_read(operation=read, path=\u003cfile path>)","[\u003cagent name>] Tool result: \u003cthe tool's text>"]},{"t":"text","text":"The text can be the file content or a line like \"Error: File not found at \u003cfile path>\". Both print the same way.","state":"muted"}],"note":"A plain \"Tool result\" line appears with whatever text the tool returned."}},{"id":"error-sent","label":"Flagged error (is_error) goes back to Claude","kind":"error","screen":{"name":"agent.run() with verbose=True","kind":"terminal","blocks":[{"t":"title","text":"agent.run() with verbose=True"},{"t":"console","items":["[\u003cagent name>] Tool call: \u003ctool name>(\u003ckey>=\u003cvalue>)","[\u003cagent name>] Tool result: Tool '\u003ctool name>' not found"]},{"t":"text","text":"Only the text is printed; the error flag itself is not shown.","state":"muted"}],"note":"The \"Tool result\" line says the tool was not found."}}],"cases":[{"id":"c1","name":"Read a file that exists","input":"file_read { operation: 'read', path: 'README.md' }","path":["t1","t2","t3","t4","t7","t8"],"outcome":"result-sent","explain":"The tool is found, the file is read, and its text is sent back as a normal tool_result.","brief":"Claude asks to read a file that is there.","facts":["tool: file_read","tool is registered","file exists"]},{"id":"c2","name":"Read a file that is missing","input":"file_read { operation: 'read', path: 'nope.txt' }","path":["t1","t2","t3","t5","t7","t8"],"outcome":"result-sent","explain":"file_read catches the problem itself and returns 'Error: File not found...' as plain text, so is_error is never set.","brief":"Claude asks to read a file that is not there.","facts":["tool: file_read","tool is registered","file is missing"]},{"id":"c3","name":"Claude calls a tool that does not exist","input":"tool_use { name: 'bash', input: { cmd: 'ls' } }","path":["t1","t2","t6","t8"],"outcome":"error-sent","explain":"tool_dict['bash'] raises KeyError, which the runner turns into \"Tool 'bash' not found\" with is_error=True.","brief":"Claude asks for a tool this agent was never given.","facts":["tool: bash","bash is not registered"]}]},{"id":"history-truncation","name":"History gets too long","trigger":"Start of every loop pass, before calling Claude","summary":"If the tracked token count is above the window, the oldest messages are dropped two at a time and a short notice takes their place.","start":"h1","steps":[{"id":"h1","at":"forge-agent","action":"Calls history.truncate() before building the request","next":[{"to":"h2","when":"always"}],"screen":{"name":"MessageHistory.truncate()","kind":"none","blocks":[],"note":"Nothing is printed or shown: trimming happens silently, even with verbose=True."}},{"id":"h2","at":"context-trimmer","action":"Compares total_tokens to context_window_tokens","source":{"file":"agents/utils/history_util.py","lines":[69,72],"anchor":"if self.total_tokens \u003c= self.context_window_tokens:","snippet":"    def truncate(self) -> None:\n        \"\"\"Remove oldest messages when context window limit is exceeded.\"\"\"\n        if self.total_tokens \u003c= self.context_window_tokens:\n            return","fileHash":"dadaf38378a987fd8ec0b730fe7fd1c18f5bbf7a"},"next":[{"to":"outcome:untouched","when":"total_tokens \u003c= window"},{"to":"h3","when":"total_tokens > window"}]},{"id":"h3","at":"context-trimmer","action":"Pops the two oldest messages and subtracts the oldest token record","carries":"total_tokens -= input + output of record[0]","next":[{"to":"h4","when":"always"}]},{"id":"h4","at":"context-trimmer","action":"Overwrites the new first message with the truncation notice and books it as 25 input tokens","carries":"'[Earlier history has been truncated.]'","next":[{"to":"h5","when":"always"}]},{"id":"h5","at":"context-trimmer","action":"Checks the while condition again","source":{"file":"agents/utils/history_util.py","lines":[93,98],"anchor":"and self.total_tokens > self.context_window_tokens","snippet":"        while (\n            self.message_tokens\n            and len(self.messages) >= 2\n            and self.total_tokens > self.context_window_tokens\n        ):\n            remove_message_pair()","fileHash":"dadaf38378a987fd8ec0b730fe7fd1c18f5bbf7a"},"next":[{"to":"h3","when":"still over window, 2+ messages and token records left"},{"to":"h6","when":"under window or nothing left to drop"}]},{"id":"h6","at":"message-history","action":"format_for_api sends the shorter list, last message marked for caching","next":[{"to":"outcome:trimmed","when":"always"}]}],"outcomes":[{"id":"untouched","label":"History sent as is","kind":"success","screen":{"name":"MessageHistory.truncate()","kind":"none","blocks":[],"note":"Nothing is shown; the whole chat is sent as it is."}},{"id":"trimmed","label":"Oldest messages dropped, notice added","kind":"blocked","screen":{"name":"MessageHistory.truncate()","kind":"none","blocks":[],"note":"Nothing is shown; old messages are gone and Claude sees \"[Earlier history has been truncated.]\" in their place."}}],"cases":[{"id":"c1","name":"Short chat","input":"total_tokens = 12,000, window = 180,000","path":["h1","h2"],"outcome":"untouched","explain":"12,000 is under 180,000, so truncate() returns right away.","brief":"A short chat is about to be sent to Claude.","facts":["12,000 tokens used","window 180,000"]},{"id":"c2","name":"Just over the limit","input":"total_tokens = 181,000; records (12,000 in, 800 out), (5,000 in, 300 out), ...","path":["h1","h2","h3","h4","h5","h6"],"outcome":"trimmed","explain":"181,000 - 12,800 = 168,200, then the next record is reset to 25 input: 168,200 + 25 - 5,000 = 163,225, which is under the window, so one round is enough.","brief":"The chat has grown a little past what fits.","facts":["181,000 tokens used","window 180,000","turn 1: 12,000 in, 800 out","turn 2: 5,000 in, 300 out"]},{"id":"c3","name":"Well over the limit","input":"total_tokens = 200,000; records (8,000, 500), (6,000, 400), (7,000, 600), ...","path":["h1","h2","h3","h4","h5","h3","h4","h5","h6"],"outcome":"trimmed","explain":"Round 1: 200,000 - 8,500 + 25 - 6,000 = 185,525, still over. Round 2: - 425 + 25 - 7,000 = 178,125, under the window.","brief":"The chat has grown far past what fits.","facts":["200,000 tokens used","window 180,000","turn 1: 8,000 in, 500 out","turn 2: 6,000 in, 400 out","turn 3: 7,000 in, 600 out"]}]},{"id":"mcp-setup","name":"Connecting MCP servers at start","trigger":"run_async() begins, with mcp_servers given to Agent(...)","summary":"Each server config is checked, connected, and its tools wrapped. A broken server is printed and skipped; the agent still runs.","start":"m1","steps":[{"id":"m1","at":"mcp-connector","action":"setup_mcp_connections gets the server list","next":[{"to":"m6","when":"mcp_servers is empty"},{"to":"m2","when":"there are server configs"}],"screen":{"name":"setup_mcp_connections()","kind":"none","blocks":[],"note":"Nothing is printed while the server list is read."}},{"id":"m2","at":"mcp-config-check","action":"Checks type and require
