PI.","Set the CLOUD_ML_REGION environment variable to use the Vertex API.","Your google cloud credentials are not set up correctly."]},{"t":"text","text":"One of these lines is shown, depending on the provider. No tabs and no message box are drawn.","state":"muted"}],"note":"A yellow warning names the problem; the chat is not drawn at all."}}],"cases":[{"id":"c1","name":"Bedrock with no AWS credentials","input":"provider=bedrock, no ~/.aws credentials","path":["s1"],"outcome":"auth-blocked","explain":"boto3 finds no credentials, so validate_auth returns a message and main() returns before the chat is drawn.","brief":"You open the demo set to Bedrock on a machine with no AWS login.","facts":["provider: Bedrock","no AWS credentials"]},{"id":"c2","name":"Simple question","input":"'What is 2+2?'","path":["s1","s2","s3","s4","s5"],"outcome":"done","explain":"Claude answers with text only, so tool_result_content is empty and the loop returns.","brief":"You ask Claude a simple sum.","facts":["provider: Anthropic","API key works","answer needs no tool"]},{"id":"c3","name":"Take a screenshot, then answer","input":"'What is on the screen?'","path":["s1","s2","s3","s4","s5","s6","s7","s8","s9","s3","s4","s5"],"outcome":"done","explain":"First reply asks for a screenshot; the image goes back as a tool_result; the second reply is plain text so the loop ends.","brief":"You ask Claude what is on the screen.","facts":["provider: Anthropic","API key works","needs one screenshot","computer tool is known"]},{"id":"c4","name":"Wrong API key","input":"api_key='sk-ant-wrong'","path":["s1","s2","s3","s4"],"outcome":"api-error","explain":"The key is not empty so auth-check passes, but the API returns 401; the loop calls api_response_callback with the error and returns messages.","brief":"You send a message with an API key that is typed wrong.","facts":["provider: Anthropic","key filled in but wrong","API answers 401"]}]},{"id":"edit-str-replace","name":"Claude edits a file with str_replace","trigger":"Claude calls str_replace_based_edit_tool with command 'str_replace'","summary":"The edit tool checks the path and that old_str is unique, then rewrites the file and saves the old text in history.","start":"s1","steps":[{"id":"s1","at":"edit-tool","action":"Receives the call and builds a Path","carries":"{ command: 'str_replace', path: '/home/computeruse/app.py', old_str: 'DEBUG = True', new_str: 'DEBUG = False' }","next":[{"to":"s2","when":"always"}],"screen":{"name":"streamlit.py — main()","kind":"browser","blocks":[{"t":"tabs","items":["Chat","HTTP Exchange Logs"]},{"t":"card","text":"assistant","items":["Tool Use: str_replace_based_edit_tool","Input: {'command': 'str_replace', 'path': '\u003cfile path>', 'old_str': '\u003cold text>', 'new_str': '\u003cnew text>'}"]},{"t":"input","text":"Type a message to send to Claude to control the computer..."}],"note":"Claude's edit request appears in the chat as a code box."}},{"id":"s2","at":"edit-checks","action":"Checks path is absolute, exists, and is not a directory","source":{"file":"computer-use-demo/computer_use_demo/tools/edit.py","lines":[87,111],"anchor":"if not path.is_absolute():","snippet":"    def validate_path(self, command: str, path: Path):\n        \"\"\"\n        Check that the path/command combination is valid.\n        \"\"\"\n        # Check if its an absolute path\n        if not path.is_absolute():\n            suggested_path = Path(\"\") / path\n            raise ToolError(\n                f\"The path {path} is not an absolute path, it should start with `/`. Maybe you meant {suggested_path}?\"\n            )\n        # Check if path exists\n        if not path.exists() and command != \"create\":\n            raise ToolError(\n                f\"The path {path} does not exist. Please provide a valid path.\"\n            )\n        if path.exists() and command == \"create\":\n            raise ToolError(\n                f\"File already exists at: {path}. Cannot overwrite files using command `create`.\"\n            )\n        # Check if the path points to a directory\n        if path.is_dir():\n            if command != \"view\":\n                raise ToolError(\n                    f\"The path {path} is a directory and only the `view` command can be used on directories\"\n                )","fileHash":"33e6f3dba6fa6177de1e19ecc7b809ce173a0690"},"next":[{"to":"s3","when":"path ok"},{"to":"outcome:bad-path","when":"relative, missing or a directory"}]},{"id":"s3","at":"edit-tool","action":"Checks old_str was given","next":[{"to":"s4","when":"old_str present"},{"to":"outcome:missing-param","when":"old_str is None"}]},{"id":"s4","at":"edit-checks","action":"Counts how many times old_str appears (tabs expanded)","carries":"occurrences = file_content.count(old_str)","source":{"file":"computer-use-demo/computer_use_demo/tools/edit.py","lines":[167,182],"anchor":"occurrences = file_content.count(old_str)","snippet":"        # Check if old_str is unique in the file\n        occurrences = file_content.count(old_str)\n        if occurrences == 0:\n            raise ToolError(\n                f\"No replacement was performed, old_str `{old_str}` did not appear verbatim in {path}.\"\n            )\n        elif occurrences > 1:\n            file_content_lines = file_content.split(\"\\n\")\n            lines = [\n                idx + 1\n                for idx, line in enumerate(file_content_lines)\n                if old_str in line\n            ]\n            raise ToolError(\n                f\"No replacement was performed. Multiple occurrences of old_str `{old_str}` in lines {lines}. Please ensure it is unique\"\n            )","fileHash":"33e6f3dba6fa6177de1e19ecc7b809ce173a0690"},"next":[{"to":"s5","when":"exactly 1"},{"to":"outcome:not-found","when":"0 times"},{"to":"outcome:not-unique","when":"more than 1"}]},{"id":"s5","at":"edit-tool","action":"Replaces the text and writes the file","next":[{"to":"s6","when":"always"}]},{"id":"s6","at":"file-history","action":"Saves the old file text, returns a snippet of the change","next":[{"to":"outcome:edited","when":"always"}]}],"outcomes":[{"id":"edited","label":"File edited, snippet returned","kind":"success","screen":{"name":"streamlit.py — main()","kind":"browser","blocks":[{"t":"tabs","items":["Chat","HTTP Exchange Logs"]},{"t":"card","text":"assistant","items":["Tool Use: str_replace_based_edit_tool","Input: {'command': 'str_replace', 'path': '\u003cfile path>', 'old_str': '\u003cold text>', 'new_str': '\u003cnew text>'}"]},{"t":"card","text":"tool","items":["The file \u003cfile path> has been edited.","Here's the result of running `cat -n` on a snippet of \u003cfile path>:","\u003cnumbered lines around the change>","Review the changes and make sure they are as expected. Edit the file again if necessary."],"state":"ok"}],"note":"A tool bubble shows a code box with a few lines of the file around the change."}},{"id":"bad-path","label":"Rejected: bad path","kind":"blocked","screen":{"name":"streamlit.py — main()","kind":"browser","blocks":[{"t":"tabs","items":["Chat","HTTP Exchange Logs"]},{"t":"card","text":"assistant","items":["Tool Use: str_replace_based_edit_tool","Input: {'command': 'str_replace', 'path': '\u003cfile path>', 'old_str': '\u003cold text>', 'new_str': '\u003cnew text>'}"]},{"t":"banner","text":"\u003cone of the path errors below>","state":"error"},{"t":"list","items":["The path \u003cpath> is not an absolute path, it should start with `/`. Maybe you meant /\u003cpath>?","The path \u003cpath> does not exist. Please provide a valid path.","The path \u003cpath> is a directory and only the `view` command can be used on directories"]}],"note":"A red error box in the tool bubble says what is wrong with the path."}},{"id":"missing-param","label":"Rejected: old_str missing","kind":"error","screen":{"name":"streamlit.py — main()","kind":"browser","blocks":[{"t":"tabs","items":["Chat","HTTP Exchange Logs"]},{"t":"card","text":"assistant","items":["Tool Use: str_replace_based_edit_tool","Input: {'command': 'str_replace', 'path': '\u003cfile path>', 'old_str': '\u003cold text>', 'new_str': '\u003cnew text>'}"]},{"t":"banner","text":"Parameter `old_str` is required for command: str_replace","state":"error"}],"note":"A red error box in the tool bubble names the missing input."}},{"id":"not-found","label":"Rejected: old_str not found","kind":"error","screen":{"name":"streamlit.py — main()","kind":"browser","blocks":[{"t":"tabs","items":["Chat","HTTP Exchange Logs"]},{"t":"card","text":"assistant","items":["Tool Use: str_replace_based_edit_tool","Input: {'command': 'str_replace', 'path': '\u003cfile path>', 'old_str': '\u003cold text>', 'new_str': '\u003cnew text>'}"]},{"t":"banner","text":"No replacement was performed, old_str `\u003cold text>` did not appear verbatim in \u003cfile path>.","state":"error"}],"note":"A red error box says the text to replace was not in the file."}},{"id":"not-unique","label":"Rejected: old_str not unique","kind":"error","screen":{"name":"streamlit.py — main()","kind":"browser","blocks":[{"t":"tabs","items":["Chat","HTTP Exchange Logs"]},{"t":"card","text":"assistant","items":["Tool Use: str_replace_based_edit_tool","Input: {'command': 'str_replace', 'path': '\u003cfile path>', 'old_str': '\u003cold text>', 'new_str': '\u003cnew text>'}"]},{"t":"banner","text":"No replacement was performed. Multiple occurrences of old_str `\u003cold text>` in lines [\u003cline numbers>]. Please ensure it is unique","state":"error"}],"note":"A red error box lists the lines where the text appears."}}],"cases":[{"id":"c1","name":"Clean edit","input":"path='/home/computeruse/app.py', old_str='DEBUG = True' (appears once)","path":["s1","s2","s3","s4","s5","s6"],"outcome":"edited","explain":"All checks pass; the file is rewritten and the old text is pushed to _file_history.","brief":"Claude changes one setting line in a file.","facts":["full path from /","file exists","old text given","old text appears once"]},{"id":"c2","name":"Relative path","input":"path='app.py'","path":["s1","s2"],"outcome":"bad-path","explain":"Path('app.py').is_absolute() is False, so validate_path raises a ToolError before anything is read.","brief":"Claude tries to edit a file by its short name only.","facts":["path: app.py","path does not start with /"]},{"id":"c3","name":"old_str appears three times","input":"old_str='return None' in a file with 3 such lines","path":["s1","s2","s3","s4"],"outcome":"not-unique","explain":"count() is 3, so the tool lists the line numbers and asks Claude to make old_str unique.","brief":"Claude tries to replace a line that is in the file several times.","facts":["full path from /","file exists","old text given","old text appears 3 times"]},{"id":"c4","name":"Forgot old_str","input":"command='str_replace', no old_str","path":["s1","s2","s3"],"outcome":"missing-param","explain":"The path is fine, but old_str is None, so 'Parameter `old_str` is required' is raised.","brief":"Claude asks for a replace but leaves out the text to find.","facts":["full path from /","file exists","no old text given"]}]},{"id":"bash-command","name":"Claude runs a bash command","trigger":"Claude calls the bash tool","summary":"The command is sent into a long-lived shell with a sentinel echo; the tool waits up to 120s for the sentinel.","start":"s1","steps":[{"id":"s1","at":"bash-tool","action":"Reads the input: restart flag or command","carries":"{ command: 'ls -la' } or { restart: true }","next":[{"to":"s2","when":"restart is true"},{"to":"s3","when":"otherwise"}],"screen":{"name":"streamlit.py — main()","kind":"browser","blocks":[{"t":"tabs","items":["Chat","HTTP Exchange Logs"]},{"t":"card","text":"assistant","items":["Tool Use: bash","Input: {'command': '\u003cthe command>'} or {'restart': True}"]},{"t":"input","text":"Type a message to send to Claude to control the computer..."}],"note":"Claude's bash request appears in the chat as a code box."}},{"id":"s2","at":"bash-tool","action":"Stops the old shell and starts a new one","next":[{"to":"outcome:restarted","when":"always"}]},{"id":"s3","at":"bash-tool","action":"Starts a session if none, checks a command was given","next":[{"to":"s4","when":"command given"},{"to":"outcome:no-command","when":"command is None"}]},{"id":"s4","at":"bash-timeout","action":"Checks the shell is alive and has not timed out before","source":{"file":"computer-use-demo/computer_use_demo/tools/bash.py","lines":[47,59],"anchor":"if self._process.returncode is not None:","snippet":"    async def run(self, command: str):\n        \"\"\"Execute a command in the bash shell.\"\"\"\n        if not self._started:\n            raise ToolError(\"Session has not started.\")\n        if self._process.returncode is not None:\n            return ToolResult(\n                system=\"tool must be restarted\",\n                error=f\"bash has exited with returncode {self._process.returncode}\",\n            )\n        if self._timed_out:\n            raise ToolError(\n                f\"timed out: bash has not returned in {self._timeout} seconds and must be restarted\",\n            )","fileHash":"a5ec4aff0a670721cb1887107bad603b778d619a"},"next":[{"to":"s5","when":"healthy"},{"to":"outcome:dead-shell","when":"bash process exited"},{"to":"outcome:must-restart","when":"_timed_out is True"}]},{"id":"s5","at":"bash-tool","action":"Writes the command plus \"; echo '\u003c\u003cexit>>'\" to the shell","carries":"b\"ls -la; echo '\u003c\u003cexit>>'\\n\"","next":[{"to":"s6","when":"always"}]},{"id":"s6","at":"bash-timeout","action":"Polls stdout every 0.2s for the sentinel, up to 120s","source":{"file":"computer-use-demo/computer_use_demo/tools/bash.py","lines":[72,88],"anchor":"if self._sentinel in output:","snippet":"        # read output from the process, until the sentinel is found\n        try:\n            async with asyncio.timeout(self._timeout):\n                while True:\n                    await asyncio.sleep(self._output_delay)\n                    # if we read directly from stdout/stderr, it will wait forever for\n                    # EOF. use the StreamReader buffer directly instead.\n                    output = self._process.stdout._buffer.decode()  # pyright: ignore[reportAttributeAccessIssue]\n                    if self._sentinel in output:\n                        # strip the sentinel and break\n                        output = output[: output.index(self._sentinel)]\n                        break\n        except asyncio.TimeoutError:\n            self._timed_out = True\n            raise ToolError(\n                f\"timed out: bash has not returned in {self._timeout} seconds and must be restarted\",\n            ) from None","fileHash":"a5ec4aff0a670721cb1887107bad603b778d619a"},"next":[{"to":"outcome:output","when":"sentinel seen"},{"to":"s7","when":"120s pass"}]},{"id":"s7","at":"bash-timeout","action":"Marks the session timed out and raises ToolError","next":[{"to":"outcome:timeout","when":"always"}]}],"outcomes":[{"id":"output","label":"Output returned","kind":"success","screen":{"name":"streamlit.py — main()","kind":"browser","blocks":[{"t":"tabs","items":["Chat","HTTP Exchange Logs"]},{"t":"card","text":"assistant","items":["Tool Use: bash","Input: {'command': '\u003cthe command>'}"]},{"t":"card","text":"tool","items":["\u003cwhat the command printed>"],"state":"ok"},{"t":"text","text":"Anything the command wrote as errors shows in a red box below.","state":"muted"}],"note":"A tool bubble shows the command output in a code box."}},{"id":"timeout","label":"Timed out, must restart","kind":"error","screen":{"name":"streamlit.py — main()","kind":"browser","blocks":[{"t":"tabs","items":["Chat","HTTP Exchange Logs"]},{"t":"card","text":"assistant","items":["Tool Use: bash","Input: {'command': '\u003cthe command>'}"]},{"t":"banner","text":"timed out: bash has not returned in 120.0 seconds and must be restarted","state":"error"}],"note":"After a long wait, a red error box says the shell he sentinel shows up within a fraction of a second; output 'hello' is returned as a CLIResult.","brief":"Claude runs a quick command that prints one word.","facts":["command: echo hello","no restart flag","shell is healthy","finishes in under a second"]},{"id":"c2","name":"Long sleep","input":"command='sleep 300'","path":["s1","s3","s4","s5","s6","s7"],"outcome":"timeout","explain":"No sentinel after 120s, so _timed_out is set and a ToolError tells Claude the tool must be restarted.","brief":"Claude runs a command that sleeps for five minutes.","facts":["command: sleep 300","no restart flag","shell is healthy","wait limit: 120 seconds"]},{"id":"c3","name":"Next command after a timeout","input":"command='ls' right after the sleep timed out","path":["s1","s3","s4"],"outcome":"must-restart","explain":"The session still has _timed_out=True, so every command is refused until restart.","brief":"Claude runs a new command right after the last one timed out.","facts":["command: ls","no restart flag","shell still running","last command timed out"]},{"id":"c4","name":"Restart","input":"restart=true","path":["s1","s2"],"outcome":"restarted","explain":"The old shell is terminated and a fresh _BashSession is started; result says 'tool has been restarted.'","brief":"Claude asks for the shell to be restarted.","facts":["restart: true","no command given"]}]}],"quests":[{"id":"q1","type":"trace","title":"Ride the loop","prompt":"Watch one full sampling loop: your message, Claude's tool call, the tool result, and the final answer.","target":"sampling-turn","xp":10},{"id":"q2","type":"quiz","title":"Where did my limit go?","prompt":"Provider is Anthropic and the sidebar says 'Only send N most recent images' = 3. After 10 screenshots, how many screenshots are sent to Claude?","options":["3","All 10, because trimming is turned off to keep the prompt cache","0","7"],"answer":1,"explain":"When provider is Anthropic, the loop sets only_n_most_recent_images = 0 because cached reads are cheaper than breaking the cache.","xp":25},{"id":"q3","type":"predict","title":"Three of a kind","prompt":"Claude asks to replace 'return None' but the file has it on 3 lines. What happens?","target":"edit-str-replace/c3","options":["File edited, snippet returned","Rejected: bad path","Rejected: old_str missing","Rejected: old_str not found","Rejected: old_str not unique"],"answer":4,"explain":"occurrences > 1, so edit-checks raises a ToolError listing the line numbers.","xp":20},{"id":"q4","type":"predict","title":"Stuck shell","prompt":"A 'sleep 300' just timed out. Claude now sends command='ls'. What does it get?","target":"bash-command/c3","options":["Output returned","Timed out, must restart","Refused: session already timed out","Error: bash has exited","Shell restarted","Error: no command provided"],"answer":2,"explain":"_timed_out stays True on the session, so every new command raises a ToolError until Claude calls bash with restart: true.","xp":20},{"id":"q5","type":"quiz","title":"Domino clicks","prompt":"With computer_toolset_20260801, Claude sends three member calls in one reply and the first one fails. What happens to the other two?","options":["They run anyway","They get a 'Not executed: an earlier computer action in this turn failed.' error without running","The loop stops and returns to you","They are retried once"],"answer":1,"explain":"member_call_failed is set after the first failure; later member calls get NOT_EXECUTED_ERROR as a ToolFailure.","xp":25},{"id":"q6","type":"quiz","title":"Who reads the history?","prompt":"The edit tool saves the old file text in _file_history on every edit. What uses it?","options":["The undo_edit command","Nothing: text_editor_20250728 has no undo_edit, so it is only written","The sidebar shows it","It is sent to Claude each turn"],"answer":1,"explain":"The docstring says this version does not support undo_edit, and no code reads _file_history.","xp":20},{"id":"q7","type":"quiz","title":"When does it stop?","prompt":"Besides an API error, when does sampling_loop return on its own?","options":["After 10 turns","When Claude's reply has no tool_use blocks","When any tool returns an error","When the screenshot count hits N"],"answer":1,"explain":"If tool_result_content is empty after scanning the reply, the loop returns. Tool errors are sent back and the loop continues.","xp":20}],"cracks":[{"id":"k1","at":"computer-tool","severity":"medium","title":"Out-of-bounds check uses the wrong size","hint":"Claude's coordinates are in screenshot pixels. What size are they compared to?","finding":"scale_coordinates checks API coordinates against the real screen size (self.width/height), not the smaller screenshot size. On a 1920x1080 screen the screenshot is 1366x768, so x=1500 passes the check and is scaled up to about 2108, which is off the screen.","suggestion":"Compare API coordinates against target_dimension (the screenshot size) before scaling up.","decoys":["Scaling rounds coordinates instead of flooring them","Typing is split into 50-character chunks","The 2-second screenshot delay is too short"],"source":{"file":"computer-use-demo/computer_use_demo/tools/computer.py","lines":[294,300],"anchor":"if x > self.width or y > self.height:","snippet":"        x_scaling_factor = target_dimension[\"width\"] / self.width\n        y_scaling_factor = target_dimension[\"height\"] / self.height\n        if source == ScalingSource.API:\n            if x > self.width or y > self.height:\n                raise ToolError(f\"Coordinates {x}, {y} are out of bounds\")\n            # scale up\n            return round(x / x_scaling_factor), round(y / y_scaling_factor)","fileHash":"645cd84537fc8b146f15a397133cdf9b79edcdfc"}},{"id":"k2","at":"bash-tool","severity":"medium","title":"Bash output is never cut down","hint":"run.py has a 16000 character limit. Does the bash session use it?","finding":"_BashSession.run returns the whole stdout and stderr buffer with no maybe_truncate. A command like 'cat big.log' puts all of it into the conversation, which can blow the context window and cost a lot, and it is resent every turn.","suggestion":"Pass output and error through maybe_truncate (MAX_RESPONSE_LEN) like the edit and computer tools do.","decoys":["The sentinel '\u003c\u003cexit>>' could be printed by the command itself","The 0.2s poll delay makes commands slow","stderr is read after stdout"],"source":{"file":"computer-use-demo/computer_use_demo/tools/bash.py","lines":[72,101],"anchor":"output = self._process.stdout._buffer.decode()","snippet":"        # read output from the process, until the sentinel is found\n        try:\n            async with asyncio.timeout(self._timeout):\n                while True:\n                    await asyncio.sleep(self._output_delay)\n                    # if we read directly from stdout/stderr, it will wait forever for\n                    # EOF. use the StreamReader buffer directly instead.\n                    output = self._process.stdout._buffer.decode()  # pyright: ignore[reportAttributeAccessIssue]\n                    if self._sentinel in output:\n                        # strip the sentinel and break\n                        output = output[: output.index(self._sentinel)]\n                        break\n        except asyncio.TimeoutError:\n            self._timed_out = True\n            raise ToolError(\n                f\"timed out: bash has not returned in {self._timeout} seconds and must be restarted\",\n            ) from None\n\n        if output.endswith(\"\\n\"):\n            output = output[:-1]\n\n        error = self._process.stderr._buffer.decode()  # pyright: ignore[reportAttributeAccessIssue]\n        if error.endswith(\"\\n\"):\n            error = error[:-1]\n\n        # clear the buffers so that the next output can be read correctly\n        self._process.stdout._buffer.clear()  # pyright: ignore[reportAttributeAccessIssue]\n        self._process.stderr._buffer.clear()  # pyright: ignore[reportAttributeAccessIssue]\n\n        return CLIResult(output=output, error=error)","fileHash":"a5ec4aff0a670721cb1887107bad603b778d619a"}},{"id":"k3","at":"tool-errors","severity":"low","title":"A bad ToolError call crashes the loop","hint":"ToolError takes one argument called message. Look at the 'must be a string' check.","finding":"computer.py raises ToolError(output=...), but ToolError.__init__ only accepts message. If Claude sends non-string text for key/type, Python raises TypeError instead. The router only catches ToolError, so the TypeError escapes sampling_loop and crashes the Streamlit run instead of going back to Claude.","suggestion":"Use ToolError(f\"{text} must be a string\"), and consider catching Exception in ToolCollection.run.","decoys":["Unknown tool names are not reported","is_error is never set on failures","ToolFailure loses the error text"],"source":{"file":"computer-use-demo/computer_use_demo/tools/computer.py","lines":[158,164],"anchor":"raise ToolError(output=f\"{text} must be a string\")","snippet":"        if action in (\"key\", \"type\"):\n            if text is None:\n                raise ToolError(f\"text is required for {action}\")\n            if coordinate is not None:\n                raise ToolError(f\"coordinate is not accepted for {action}\")\n            if not isinstance(text, str):\n                raise ToolError(output=f\"{text} must be a string\")","fileHash":"645cd84537fc8b146f15a397133cdf9b79edcdfc"}}]},{"id":"autonomous-coding","name":"autonomous-coding","theme":"city","tagline":"A city where two AI workers build a whole app, one shift at a time","summary":"A small Python harness that lets Claude build a full web app over many sessions. The first session runs an initializer agent that writes 200 tests into feature_list.json; every later session runs a fresh coding agent that fixes or finishes one feature and leaves notes for the next shift. Every shell command the agents run must pass a security hook with an allowlist, and runs inside a sandbox.","paths":["autonomous-coding/autonomous_agent_demo.py","autonomous-coding/agent.py","autonomous-coding/client.py","autonomous-coding/security.py","autonomous-coding/progress.py","autonomous-coding/prompts.py","autonomous-coding/prompts/","autonomous-coding/test_security.py","autonomous-coding/requirements.txt"],"districts":[{"id":"launchpad","name":"Launch Pad"},{"id":"agents","name":"Agent Tower"},{"id":"checkpoint","name":"Security Checkpoint"},{"id":"tools","name":"Tool Yard"},{"id":"records","name":"Records Hall"}],"entities":[{"id":"cli-entry","kind":"entry","name":"Start script (CLI)","district":"launchpad","summary":"The command you run to start the factory. It reads your options, checks for an API key, and starts the session loop.","details":"- Options: --project-dir, --max-iterations, --model\n- Default model is claude-sonnet-4-5-20250929\n- Stops right away if ANTHROPIC_API_KEY is not set\n- Relative project folders are moved under generations/\n- Ctrl+C is caught; running the same command again resumes the project","source":[{"file":"autonomous-coding/autonomous_agent_demo.py","lines":[75,113],"anchor":"def main() -> None:","snippet":"def main() -> None:\n    \"\"\"Main entry point.\"\"\"\n    args = parse_args()\n\n    # Check for API key\n    if not os.environ.get(\"ANTHROPIC_API_KEY\"):\n        print(\"Error: ANTHROPIC_API_KEY environment variable not set\")\n        print(\"\\nGet your API key from: https://console.anthropic.com/\")\n        print(\"\\nThen set it:\")\n        print(\"  export ANTHROPIC_API_KEY='your-api-key-here'\")\n        return\n\n    # Automatically place projects in generations/ directory unless already specified\n    project_dir = args.project_dir\n    if not str(project_dir).startswith(\"generations/\"):\n        # Convert relative paths to be under generations/\n        if project_dir.is_absolute():\n            # If absolute path, use as-is\n            pass\n        else:\n            # Prepend generations/ to relative paths\n            project_dir = Path(\"generations\") / project_dir\n\n    # Run the agent\n    try:\n        asyncio.run(\n            run_autonomous_agent(\n                project_dir=project_dir,\n                model=args.model,\n                max_iterations=args.max_iterations,\n            )\n        )\n    except KeyboardInterrupt:\n        print(\"\\n\\nInterrupted by user\")\n        print(\"To resume, run the same command again\")\n    except Exception as e:\n        print(f\"\\nFatal error: {e}\")\n        raise\n","fileHash":"c6724adde52db94911f00a127347a54e64576f70"},{"file":"autonomous-coding/autonomous_agent_demo.py","lines":[24,24],"anchor":"DEFAULT_MODEL = \"claude-sonnet-4-5-20250929\"","snippet":"DEFAULT_MODEL = \"claude-sonnet-4-5-20250929\"","fileHash":"c6724adde52db94911f00a127347a54e64576f70"}]},{"id":"session-loop","kind":"module","name":"Session loop","district":"launchpad","summary":"The shift manager. It runs one agent session after another, each with a brand-new client and an empty memory.","details":"- First run is decided by one thing: does feature_list.json exist yet?\n- On a first run it copies app_spec.txt into the project\n- Picks the initializer prompt once, then the coding prompt forever after\n- After each session it prints progress and waits 3 seconds\n- On an error it just waits and starts a fresh session","source":[{"file":"autonomous-coding/agent.py","lines":[97,186],"anchor":"async def run_autonomous_agent(","snippet":"async def run_autonomous_agent(\n    project_dir: Path,\n    model: str,\n    max_iterations: Optional[int] = None,\n) -> None:\n    \"\"\"\n    Run the autonomous agent loop.\n\n    Args:\n        project_dir: Directory for the project\n        model: Claude model to use\n        max_iterations: Maximum number of iterations (None for unlimited)\n    \"\"\"\n    print(\"\\n\" + \"=\" * 70)\n    print(\"  AUTONOMOUS CODING AGENT DEMO\")\n    print(\"=\" * 70)\n    print(f\"\\nProject directory: {project_dir}\")\n    print(f\"Model: {model}\")\n    if max_iterations:\n        print(f\"Max iterations: {max_iterations}\")\n    else:\n        print(\"Max iterations: Unlimited (will run until completion)\")\n    print()\n\n    # Create project directory\n    project_dir.mkdir(parents=True, exist_ok=True)\n\n    # Check if this is a fresh start or continuation\n    tests_file = project_dir / \"feature_list.json\"\n    is_first_run = not tests_file.exists()\n\n    if is_first_run:\n        print(\"Fresh start - will use initializer agent\")\n        print()\n        print(\"=\" * 70)\n        print(\"  NOTE: First session takes 10-20+ minutes!\")\n        print(\"  The agent is generating 200 detailed test cases.\")\n        print(\"  This may appear to hang - it's working. Watch for [Tool: ...] output.\")\n        print(\"=\" * 70)\n        print()\n        # Copy the app spec into the project directory for the agent to read\n        copy_spec_to_project(project_dir)\n    else:\n        print(\"Continuing existing project\")\n        print_progress_summary(project_dir)\n\n    # Main loop\n    iteration = 0\n\n    while True:\n        iteration += 1\n\n        # Check max iterations\n        if max_iterations and iteration > max_iterations:\n            print(f\"\\nReached max iterations ({max_iterations})\")\n            print(\"To continue, run the script again without --max-iterations\")\n            break\n\n        # Print session header\n        print_session_header(iteration, is_first_run)","snippetCut":true,"fileHash":"224934fb546095cb539106e9b2caa35a655fe5ea"},{"file":"autonomous-coding/agent.py","lines":[124,141],"anchor":"is_first_run = not tests_file.exists()","snippet":"    # Check if this is a fresh start or continuation\n    tests_file = project_dir / \"feature_list.json\"\n    is_first_run = not tests_file.exists()\n\n    if is_first_run:\n        print(\"Fresh start - will use initializer agent\")\n        print()\n        print(\"=\" * 70)\n        print(\"  NOTE: First session takes 10-20+ minutes!\")\n        print(\"  The agent is generating 200 detailed test cases.\")\n        print(\"  This may appear to hang - it's working. Watch for [Tool: ...] output.\")\n        print(\"=\" * 70)\n        print()\n        # Copy the app spec into the project directory for the agent to read\n        copy_spec_to_project(project_dir)\n    else:\n        print(\"Continuing existing project\")\n        print_progress_summary(project_dir)","fileHash":"224934fb546095cb539106e9b2caa35a655fe5ea"}]},{"id":"max-iterations","kind":"guardrail","name":"Iteration limit","district":"launchpad","summary":"An optional cap on how many sessions run. Without it the loop runs until you stop it.","details":"- Set with --max-iterations; default is no limit\n- Checked at the top of every loop turn, before a session starts\n- When hit, it prints a summary and how to run the app","source":[{"file":"autonomous-coding/agent.py","lines":[146,153],"anchor":"if max_iterations and iteration > max_iterations:","snippet":"    while True:\n        iteration += 1\n\n        # Check max iterations\n        if max_iterations and iteration > max_iterations:\n            print(f\"\\nReached max iterations ({max_iterations})\")\n            print(\"To continue, run the script again without --max-iterations\")\n            break","fileHash":"224934fb546095cb539106e9b2caa35a655fe5ea"},{"file":"autonomous-coding/autonomous_agent_demo.py","lines":[58,63],"anchor":"\"--max-iterations\",","snippet":"    parser.add_argument(\n        \"--max-iterations\",\n        type=int,\n        default=None,\n        help=\"Maximum number of agent iterations (default: unlimited)\",\n    )","fileHash":"c6724adde52db94911f00a127347a54e64576f70"}],"guard":{"rule":"Never run more sessions than the user asked for","checks":"iteration > max_iterations (only when a limit was given)","onFail":"The loop breaks, a final progress summary is printed and the program ends"}},{"id":"initializer-agent","kind":"agent","name":"Initializer agent","district":"agents","summary":"The first worker on the site. It reads the app spec and lays the foundation: the test list, a setup script and a git repo.","details":"- Runs only in session 1\n- Writes feature_list.json with 200+ tests, all marked passes: false\n- Writes init.sh to install and start the app\n- Creates the git repo and the first commit\n- Leaves claude-progress.txt for the next agent","source":[{"file":"autonomous-coding/agent.py","lines":[161,164],"anchor":"prompt = get_initializer_prompt()","snippet":"        # Choose prompt based on session type\n        if is_first_run:\n            prompt = get_initializer_prompt()\n            is_first_run = False  # Only use initializer once","fileHash":"224934fb546095cb539106e9b2caa35a655fe5ea"},{"file":"autonomous-coding/prompts.py","lines":[21,23],"anchor":"def get_initializer_prompt() -> str:","snippet":"def get_initializer_prompt() -> str:\n    \"\"\"Load the initializer prompt.\"\"\"\n    return load_prompt(\"initializer_prompt\")","fileHash":"520fa2425877b9fbf026e78ab704e1091a4aaab0"}],"agent":{"role":"Turns the app spec into a test list, a setup script and a git repo","model":"claude-sonnet-4-5-20250929","tools":["agent-tools","puppeteer-browser"],"prompt":"initializer-prompt"}},{"id":"coding-agent","kind":"agent","name":"Coding agent","district":"agents","summary":"The worker for every later shift. It wakes up with no memory, reads the notes, checks nothing broke, then builds and tests one feature.","details":"- Starts by reading app_spec.txt, feature_list.json, claude-progress.txt and git log\n- Re-tests 1-2 passing features before new work\n- Picks the top failing feature and builds it\n- Must test through a real browser (Puppeteer)\n- Flips only the \"passes\" field, commits, and updates the notes","source":[{"file":"autonomous-coding/agent.py","lines":[165,166],"anchor":"prompt = get_coding_prompt()","snippet":"        else:\n            prompt = get_coding_prompt()","fileHash":"224934fb546095cb539106e9b2caa35a655fe5ea"},{"file":"autonomous-coding/prompts/coding_prompt.md","lines":[1,4],"anchor":"## YOUR ROLE - CODING AGENT","snippet":"## YOUR ROLE - CODING AGENT\n\nYou are continuing work on a long-running autonomous development task.\nThis is a FRESH context window - you have no memory of previous sessions.","fileHash":"c9615a6f8e5af14f1383ff22f7f367599dde6137"}],"agent":{"role":"Builds and browser-tests one feature per session, then commits","model":"claude-sonnet-4-5-20250929","tools":["agent-tools","puppeteer-browser"],"prompt":"coding-prompt"}},{"id":"initializer-prompt","kind":"config","name":"Initializer prompt and app spec","district":"agents","summary":"The written orders for session 1, plus the app spec (a claude.ai clone) that gets copied into the project folder.","details":"- Demands 200 tests, both functional and style, ordered by priority\n- At least 25 tests must have 10+ steps\n- Says removing or editing tests later is \"catastrophic\"\n- app_spec.txt is copied only if the project does not already have one","source":[{"file":"autonomous-coding/prompts/initializer_prompt.md","lines":[1,56],"anchor":"## YOUR ROLE - INITIALIZER AGENT (Session 1 of Many)","snippet":"## YOUR ROLE - INITIALIZER AGENT (Session 1 of Many)\n\nYou are the FIRST agent in a long-running autonomous development process.\nYour job is to set up the foundation for all future coding agents.\n\n### FIRST: Read the Project Specification\n\nStart by reading `app_spec.txt` in your working directory. This file contains\nthe complete specification for what you need to build. Read it carefully\nbefore proceeding.\n\n### CRITICAL FIRST TASK: Create feature_list.json\n\nBased on `app_spec.txt`, create a file called `feature_list.json` with 200 detailed\nend-to-end test cases. This file is the single source of truth for what\nneeds to be built.\n\n**Format:**\n```json\n[\n  {\n    \"category\": \"functional\",\n    \"description\": \"Brief description of the feature and what this test verifies\",\n    \"steps\": [\n      \"Step 1: Navigate to relevant page\",\n      \"Step 2: Perform action\",\n      \"Step 3: Verify expected result\"\n    ],\n    \"passes\": false\n  },\n  {\n    \"category\": \"style\",\n    \"description\": \"Brief description of UI/UX requirement\",\n    \"steps\": [\n      \"Step 1: Navigate to page\",\n      \"Step 2: Take screenshot\",\n      \"Step 3: Verify visual requirements\"\n    ],\n    \"passes\": false\n  }\n]\n```\n\n**Requirements for feature_list.json:**\n- Minimum 200 features total with testing steps for each\n- Both \"functional\" and \"style\" categories\n- Mix of narrow tests (2-5 steps) and comprehensive tests (10+ steps)\n- At least 25 tests MUST have 10+ steps each\n- Order features by priority: fundamental features first\n- ALL tests start with \"passes\": false\n- Cover every feature in the spec exhaustively\n\n**CRITICAL INSTRUCTION:**\nIT IS CATASTROPHIC TO REMOVE OR EDIT FEATURES IN FUTURE SESSIONS.\nFeatures can ONLY be marked as passing (change \"passes\": false to \"passes\": true).\nNever remove features, never edit descriptions, never modify testing steps.","fileHash":"bd2493fedf1dd946f82bf31b26d3a70075e5c362"},{"file":"autonomous-coding/prompts.py","lines":[31,37],"anchor":"def copy_spec_to_project(project_dir: Path) -> None:","snippet":"def copy_spec_to_project(project_dir: Path) -> None:\n    \"\"\"Copy the app spec file into the project directory for the agent to read.\"\"\"\n    spec_source = PROMPTS_DIR / \"app_spec.txt\"\n    spec_dest = project_dir / \"app_spec.txt\"\n    if not spec_dest.exists():\n        shutil.copy(spec_source, spec_dest)\n        print(\"Copied app_spec.txt to project directory\")","fileHash":"520fa2425877b9fbf026e78ab704e1091a4aaab0"},{"file":"autonomous-coding/prompts/app_spec.txt","lines":[1,3],"anchor":"\u003cproject_name>Claude.ai Clone - AI Chat Interface\u003c/project_name>","snippet":"\u003cproject_specification>\n  \u003cproject_name>Claude.ai Clone - AI Chat Interface\u003c/project_name>\n","fileHash":"d471cf8643080498a068b83fe8e73fab061c0a44"}]},{"id":"coding-prompt","kind":"config","name":"Coding prompt","district":"agents","summary":"The 10-step routine every coding session follows, from 'get your bearings' to 'end session cleanly'.","details":"- Step 3: re-check old features before new work\n- Step 6: verify through the real UI, not curl\n- Step 7: may only change the \"passes\" field\n- Steps 8-10: commit, write notes, leave the app working","source":[{"file":"autonomous-coding/prompts/coding_prompt.md","lines":[1,197],"anchor":"### STEP 1: GET YOUR BEARINGS (MANDATORY)","snippet":"## YOUR ROLE - CODING AGENT\n\nYou are continuing work on a long-running autonomous development task.\nThis is a FRESH context window - you have no memory of previous sessions.\n\n### STEP 1: GET YOUR BEARINGS (MANDATORY)\n\nStart by orienting yourself:\n\n```bash\n# 1. See your working directory\npwd\n\n# 2. List files to understand project structure\nls -la\n\n# 3. Read the project specification to understand what you're building\ncat app_spec.txt\n\n# 4. Read the feature list to see all work\ncat feature_list.json | head -50\n\n# 5. Read progress notes from previous sessions\ncat claude-progress.txt\n\n# 6. Check recent git history\ngit log --oneline -20\n\n# 7. Count remaining tests\ncat feature_list.json | grep '\"passes\": false' | wc -l\n```\n\nUnderstanding the `app_spec.txt` is critical - it contains the full requirements\nfor the application you're building.\n\n### STEP 2: START SERVERS (IF NOT RUNNING)\n\nIf `init.sh` exists, run it:\n```bash\nchmod +x init.sh\n./init.sh\n```\n\nOtherwise, start servers manually and document the process.\n\n### STEP 3: VERIFICATION TEST (CRITICAL!)\n\n**MANDATORY BEFORE NEW WORK:**\n\nThe previous session may have introduced bugs. Before implementing anything\nnew, you MUST run verification tests.\n\nRun 1-2 of the feature tests marked as `\"passes\": true` that are most core to the app's functionality to verify they still work.\nFor example, if this were a chat app, you should perform a test that logs into the app, sends a message, and gets a response.\n\n**If you find ANY issues (functional or visual):**\n- Mark that feature as \"passes\": false immediately\n- Add issues to a list\n- Fix all issues BEFORE moving to new features\n- This includes UI bugs like:","snippetCut":true,"fileHash":"c9615a6f8e5af14f1383ff22f7f367599dde6137"},{"file":"autonomous-coding/prompts/coding_prompt.md","lines":[106,126],"anchor":"**YOU CAN ONLY MODIFY ONE FIELD: \"passes\"**","snippet":"### STEP 7: UPDATE feature_list.json (CAREFULLY!)\n\n**YOU CAN ONLY MODIFY ONE FIELD: \"passes\"**\n\nAfter thorough verification, change:\n```json\n\"passes\": false\n```\nto:\n```json\n\"passes\": true\n```\n\n**NEVER:**\n- Remove tests\n- Edit test descriptions\n- Modify test steps\n- Combine or consolidate tests\n- Reorder tests\n\n**ONLY CHANGE \"passes\" FIELD AFTER VERIFICATION WITH SCREENSHOTS.**","fileHash":"c9615a6f8e5af14f1383ff22f7f367599dde6137"}]},{"id":"claude-api","kind":"external","name":"Claude (via Agent SDK)","district":"agents","summary":"The model behind both agents. A new SDK client is made for every session, so each session starts with a clean context.","details":"- Uses ClaudeSDKClient with max_turns=1000\n- Working folder is the project folder\n- Streams text and tool calls back; the harness prints them\n- Any exception ends the session with status \"error\"","source":[{"file":"autonomous-coding/client.py","lines":[102,122],"anchor":"return ClaudeSDKClient(","snippet":"    return ClaudeSDKClient(\n        options=ClaudeCodeOptions(\n            model=model,\n            system_prompt=\"You are an expert full-stack developer building a production-quality web application.\",\n            allowed_tools=[\n                *BUILTIN_TOOLS,\n                *PUPPETEER_TOOLS,\n            ],\n            mcp_servers={\n                \"puppeteer\": {\"command\": \"npx\", \"args\": [\"puppeteer-mcp-server\"]}\n            },\n            hooks={\n                \"PreToolUse\": [\n                    HookMatcher(matcher=\"Bash\", hooks=[bash_security_hook]),\n                ],\n            },\n            max_turns=1000,\n            cwd=str(project_dir.resolve()),\n            settings=str(settings_file.resolve()),  # Use absolute path\n        )\n    )","fileHash":"6931439ff8522457e1c14740e1d2def34430606f"},{"file":"autonomous-coding/agent.py","lines":[23,94],"anchor":"async def run_agent_session(","snippet":"async def run_agent_session(\n    client: ClaudeSDKClient,\n    message: str,\n    project_dir: Path,\n) -> tuple[str, str]:\n    \"\"\"\n    Run a single agent session using Claude Agent SDK.\n\n    Args:\n        client: Claude SDK client\n        message: The prompt to send\n        project_dir: Project directory path\n\n    Returns:\n        (status, response_text) where status is:\n        - \"continue\" if agent should continue working\n        - \"error\" if an error occurred\n    \"\"\"\n    print(\"Sending prompt to Claude Agent SDK...\\n\")\n\n    try:\n        # Send the query\n        await client.query(message)\n\n        # Collect response text and show tool use\n        response_text = \"\"\n        async for msg in client.receive_response():\n            msg_type = type(msg).__name__\n\n            # Handle AssistantMessage (text and tool use)\n            if msg_type == \"AssistantMessage\" and hasattr(msg, \"content\"):\n                for block in msg.content:\n                    block_type = type(block).__name__\n\n                    if block_type == \"TextBlock\" and hasattr(block, \"text\"):\n                        response_text += block.text\n                        print(block.text, end=\"\", flush=True)\n                    elif block_type == \"ToolUseBlock\" and hasattr(block, \"name\"):\n                        print(f\"\\n[Tool: {block.name}]\", flush=True)\n                        if hasattr(block, \"input\"):\n                            input_str = str(block.input)\n                            if len(input_str) > 200:\n                                print(f\"   Input: {input_str[:200]}...\", flush=True)\n                            else:\n                                print(f\"   Input: {input_str}\", flush=True)\n\n            # Handle UserMessage (tool results)\n            elif msg_type == \"UserMessage\" and hasattr(msg, \"content\"):\n                for block in msg.content:\n                    block_type = type(block).__name__\n\n                    if block_type == \"ToolResultBlock\":\n                        result_content = getattr(block, \"content\", \"\")\n                        is_error = getattr(block, \"is_error\", False)\n\n                        # Check if command was blocked by security hook\n                        if \"blocked\" in str(result_content).lower():\n                            print(f\"   [BLOCKED] {result_content}\", flush=True)\n                        elif is_error:\n                            # Show errors (truncated)","snippetCut":true,"fileHash":"224934fb546095cb539106e9b2caa35a655fe5ea"}]},{"id":"security-hook","kind":"guardrail","name":"Bash security hook (allowlist)","district":"checkpoint","summary":"A gate that sees every Bash command before it runs. It pulls out each command name and blocks anything not on a short allowlist.","details":"- Wired in as a PreToolUse hook for the Bash tool only\n- Allowlist: ls, cat, head, tail, wc, grep, cp, mkdir, chmod, pwd, npm, node, git, ps, lsof, sleep, pkill, init.sh\n- Splits on ;, &&, || and | to find every command name\n- If it cannot parse the command at all, it blocks (fail safe)\n- pkill, chmod and init.sh get extra checks","source":[{"file":"autonomous-coding/security.py","lines":[297,359],"anchor":"async def bash_security_hook(input_data, tool_use_id=None, context=None):","snippet":"async def bash_security_hook(input_data, tool_use_id=None, context=None):\n    \"\"\"\n    Pre-tool-use hook that validates bash commands using an allowlist.\n\n    Only commands in ALLOWED_COMMANDS are permitted.\n\n    Args:\n        input_data: Dict containing tool_name and tool_input\n        tool_use_id: Optional tool use ID\n        context: Optional context\n\n    Returns:\n        Empty dict to allow, or {\"decision\": \"block\", \"reason\": \"...\"} to block\n    \"\"\"\n    if input_data.get(\"tool_name\") != \"Bash\":\n        return {}\n\n    command = input_data.get(\"tool_input\", {}).get(\"command\", \"\")\n    if not command:\n        return {}\n\n    # Extract all commands from the command string\n    commands = extract_commands(command)\n\n    if not commands:\n        # Could not parse - fail safe by blocking\n        return {\n            \"decision\": \"block\",\n            \"reason\": f\"Could not parse command for security validation: {command}\",\n        }\n\n    # Split into segments for per-command validation\n    segments = split_command_segments(command)\n\n    # Check each command against the allowlist\n    for cmd in commands:\n        if cmd not in ALLOWED_COMMANDS:\n            return {\n                \"decision\": \"block\",\n                \"reason\": f\"Command '{cmd}' is not in the allowed commands list\",\n            }\n\n        # Additional validation for sensitive commands\n        if cmd in COMMANDS_NEEDING_EXTRA_VALIDATION:\n            # Find the specific segment containing this command\n            cmd_segment = get_command_for_validation(cmd, segments)\n            if not cmd_segment:\n                cmd_segment = command  # Fallback to full command\n\n            if cmd == \"pkill\":\n                allowed, reason = validate_pkill_command(cmd_segment)\n                if not allowed:\n                    return {\"decision\": \"block\", \"reason\": reason}\n            elif cmd == \"chmod\":\n                allowed, reason = validate_chmod_command(cmd_segment)\n                if not allowed:\n                    return {\"decision\": \"block\", \"reason\": reason}\n            elif cmd == \"init.sh\":\n                allowed, reason = validate_init_script(cmd_segment)\n                if not allowed:","snippetCut":true,"fileHash":"7bf09b5f2d0ad8c59277ddcefb105d981daac412"},{"file":"autonomous-coding/security.py","lines":[15,44],"anchor":"ALLOWED_COMMANDS = {","snippet":"ALLOWED_COMMANDS = {\n    # File inspection\n    \"ls\",\n    \"cat\",\n    \"head\",\n    \"tail\",\n    \"wc\",\n    \"grep\",\n    # File operations (agent uses SDK tools for most file ops, but cp/mkdir needed occasionally)\n    \"cp\",\n    \"mkdir\",\n    \"chmod\",  # For making scripts executable; validated separately\n    # Directory\n    \"pwd\",\n    # Node.js development\n    \"npm\",\n    \"node\",\n    # Version control\n    \"git\",\n    # Process management\n    \"ps\",\n    \"lsof\",\n    \"sleep\",\n    \"pkill\",  # For killing dev servers; validated separately\n    # Script execution\n    \"init.sh\",  # Init scripts; validated separately\n}\n\n# Commands that need additional validation even when in the allowlist\nCOMMANDS_NEEDING_EXTRA_VALIDATION = {\"pkill\", \"chmod\", \"init.sh\"}","fileHash":"7bf09b5f2d0ad8c59277ddcefb105d981daac412"},{"file":"autonomous-coding/client.py","lines":[113,117],"anchor":"HookMatcher(matcher=\"Bash\", hooks=[bash_security_hook]),","snippet":"            hooks={\n                \"PreToolUse\": [\n                    HookMatcher(matcher=\"Bash\", hooks=[bash_security_hook]),\n                ],\n            },","fileHash":"6931439ff8522457e1c14740e1d2def34430606f"}],"guard":{"rule":"Only allowlisted shell commands may run","checks":"every name from extract_commands() is in ALLOWED_COMMANDS","onFail":"Returns {decision: block, reason}; the agent sees the reason instead of output"}},{"id":"pkill-check","kind":"guardrail","name":"pkill check","district":"checkpoint","summary":"Lets the agent stop its own dev servers, but nothing else.","details":"- Takes the last non-flag word as the target\n- For -f 'node server.js' it uses the first word, node\n- Allowed targets: node, npm, npx, vite, next","source":[{"file":"autonomous-coding/security.py","lines":[161,206],"anchor":"def validate_pkill_command(command_string: str) -> tuple[bool, str]:","snippet":"def validate_pkill_command(command_string: str) -> tuple[bool, str]:\n    \"\"\"\n    Validate pkill commands - only allow killing dev-related processes.\n\n    Uses shlex to parse the command, avoiding regex bypass vulnerabilities.\n\n    Returns:\n        Tuple of (is_allowed, reason_if_blocked)\n    \"\"\"\n    # Allowed process names for pkill\n    allowed_process_names = {\n        \"node\",\n        \"npm\",\n        \"npx\",\n        \"vite\",\n        \"next\",\n    }\n\n    try:\n        tokens = shlex.split(command_string)\n    except ValueError:\n        return False, \"Could not parse pkill command\"\n\n    if not tokens:\n        return False, \"Empty pkill command\"\n\n    # Separate flags from arguments\n    args = []\n    for token in tokens[1:]:\n        if not token.startswith(\"-\"):\n            args.append(token)\n\n    if not args:\n        return False, \"pkill requires a process name\"\n\n    # The target is typically the last non-flag argument\n    target = args[-1]\n\n    # For -f flag (full command line match), extract the first word as process name\n    # e.g., \"pkill -f 'node server.js'\" -> target is \"node server.js\", process is \"node\"\n    if \" \" in target:\n        target = target.split()[0]\n\n    if target in allowed_process_names:\n        return True, \"\"\n    return False, f\"pkill only allowed for dev processes: {allowed_process_names}\"","fileHash":"7bf09b5f2d0ad8c59277ddcefb105d981daac412"}],"guard":{"rule":"pkill may only target dev-server processes","checks":"target in {node, npm, npx, vite, next}","onFail":"Blocked with 'pkill only allowed for dev processes'"}},{"id":"init-script-checks","kind":"guardrail","name":"chmod and init.sh checks","district":"checkpoint","summary":"Two small gates for the setup script: chmod may only add +x, and init.sh must be run by path.","details":"- chmod: no flags, needs a mode and a file, mode must match ^[ugoa]*\\+x$\n- So chmod +x and u+x pass; chmod 777 and chmod -R fail\n- init.sh: first word must be ./init.sh or end with /init.sh\n- A bare 'init.sh' or 'FOO=1 ./init.sh' is blocked","source":[{"file":"autonomous-coding/security.py","lines":[209,251],"anchor":"if not re.match(r\"^[ugoa]*\\+x$\", mode):","snippet":"def validate_chmod_command(command_string: str) -> tuple[bool, str]:\n    \"\"\"\n    Validate chmod commands - only allow making files executable with +x.\n\n    Returns:\n        Tuple of (is_allowed, reason_if_blocked)\n    \"\"\"\n    try:\n        tokens = shlex.split(command_string)\n    except ValueError:\n        return False, \"Could not parse chmod command\"\n\n    if not tokens or tokens[0] != \"chmod\":\n        return False, \"Not a chmod command\"\n\n    # Look for the mode argument\n    # Valid modes: +x, u+x, a+x, etc. (anything ending with +x for execute permission)\n    mode = None\n    files = []\n\n    for token in tokens[1:]:\n        if token.startswith(\"-\"):\n            # Skip flags like -R (we don't allow recursive chmod anyway)\n            return False, \"chmod flags are not allowed\"\n        elif mode is None:\n            mode = token\n        else:\n            files.append(token)\n\n    if mode is None:\n        return False, \"chmod requires a mode\"\n\n    if not files:\n        return False, \"chmod requires at least one file\"\n\n    # Only allow +x variants (making files executable)\n    # This matches: +x, u+x, g+x, o+x, a+x, ug+x, etc.\n    import re\n\n    if not re.match(r\"^[ugoa]*\\+x$\", mode):\n        return False, f\"chmod only allowed with +x mode, got: {mode}\"\n\n    return True, \"\"","fileHash":"7bf09b5f2d0ad8c59277ddcefb105d981daac412"},{"file":"autonomous-coding/security.py","lines":[254,276],"anchor":"if script == \"./init.sh\" or script.endswith(\"/init.sh\"):","snippet":"def validate_init_script(command_string: str) -> tuple[bool, str]:\n    \"\"\"\n    Validate init.sh script execution - only allow ./init.sh.\n\n    Returns:\n        Tuple of (is_allowed, reason_if_blocked)\n    \"\"\"\n    try:\n        tokens = shlex.split(command_string)\n    except ValueError:\n        return False, \"Could not parse init script command\"\n\n    if not tokens:\n        return False, \"Empty command\"\n\n    # The command should be exactly ./init.sh (possibly with arguments)\n    script = tokens[0]\n\n    # Allow ./init.sh or paths ending in /init.sh\n    if script == \"./init.sh\" or script.endswith(\"/init.sh\"):\n        return True, \"\"\n\n    return False, f\"Only ./init.sh is allowed, got: {script}\"","fileHash":"7bf09b5f2d0ad8c59277ddcefb105d981daac412"}],"guard":{"rule":"chmod only makes files executable; only an init.sh path may be run","checks":"chmod mode matches ^[ugoa]*\\+x$ with no flags; script is ./init.sh or ends with /init.sh","onFail":"Blocked with a reason like 'chmod only allowed with +x mode, got: 777'"}},{"id":"sandbox-settings","kind":"guardrail","name":"Sandbox and permissions","district":"checkpoint","summary":"The outer wall. Bash runs in an OS sandbox and file tools may only touch the project folder.","details":"- Written to .claude_settings.json inside the project each session\n- sandbox.enabled = true\n- File tools allowed only on ./** (the project folder)\n- Bash(*) is allowed here on purpose; the hook does the filtering","source":[{"file":"autonomous-coding/client.py","lines":[67,85],"anchor":"\"sandbox\": {\"enabled\": True, \"autoAllowBashIfSandboxed\": True},","snippet":"    security_settings = {\n        \"sandbox\": {\"enabled\": True, \"autoAllowBashIfSandboxed\": True},\n        \"permissions\": {\n            \"defaultMode\": \"acceptEdits\",  # Auto-approve edits within allowed directories\n            \"allow\": [\n                # Allow all file operations within the project directory\n                \"Read(./**)\",\n                \"Write(./**)\",\n                \"Edit(./**)\",\n                \"Glob(./**)\",\n                \"Grep(./**)\",\n                # Bash permission granted here, but actual commands are validated\n                # by the bash_security_hook (see security.py for allowed commands)\n                \"Bash(*)\",\n                # Allow Puppeteer MCP tools for browser automation\n                *PUPPETEER_TOOLS,\n            ],\n        },\n    }","fileHash":"6931439ff8522457e1c14740e1d2def34430606f"},{"file":"autonomous-coding/client.py","lines":[90,93],"anchor":"settings_file = project_dir / \".claude_settings.json\"","snippet":"    # Write settings to a file in the project directory\n    settings_file = project_dir / \".claude_settings.json\"\n    with open(settings_file, \"w\") as f:\n        json.dump(security_settings, f, indent=2)","fileHash":"6931439ff8522457e1c14740e1d2def34430606f"}],"guard":{"rule":"Agent actions stay inside the project folder","checks":"OS sandbox for Bash; Read/Write/Edit/Glob/Grep limited to ./**","onFail":"The tool call is denied by the SDK, outside this code"}},{"id":"agent-tools","kind":"skill","name":"Built-in tools","district":"tools","summary":"The hands of the agents: read, write, edit, search files, and run shell commands.","details":"- Read, Write, Edit, Glob, Grep, Bash\n- Only Bash goes through the security hook\n- File tools are limited by the sandbox permissions","source":[{"file":"autonomous-coding/client.py","lines":[30,37],"anchor":"BUILTIN_TOOLS = [","snippet":"BUILTIN_TOOLS = [\n    \"Read\",\n    \"Write\",\n    \"Edit\",\n    \"Glob\",\n    \"Grep\",\n    \"Bash\",\n]","fileHash":"6931439ff8522457e1c14740e1d2def34430606f"}]},{"id":"puppeteer-browser","kind":"skill","name":"Puppeteer browser","district":"tools","summary":"A real browser the agent drives to test features like a human: click, type, screenshot.","details":"- Started as an MCP server with npx puppeteer-mcp-server\n- 7 tools: navigate, screenshot, click, fill, select, hover, evaluate\n- The coding prompt says to avoid evaluate shortcuts","source":[{"file":"autonomous-coding/client.py","lines":[19,27],"anchor":"PUPPETEER_TOOLS = [","snippet":"PUPPETEER_TOOLS = [\n    \"mcp__puppeteer__puppeteer_navigate\",\n    \"mcp__puppeteer__puppeteer_screenshot\",\n    \"mcp__puppeteer__puppeteer_click\",\n    \"mcp__puppeteer__puppeteer_fill\",\n    \"mcp__puppeteer__puppeteer_select\",\n    \"mcp__puppeteer__puppeteer_hover\",\n    \"mcp__puppeteer__puppeteer_evaluate\",\n]","fileHash":"6931439ff8522457e1c14740e1d2def34430606f"},{"file":"autonomous-coding/client.py","lines":[110,112],"anchor":"\"puppeteer\": {\"command\": \"npx\", \"args\": [\"puppeteer-mcp-server\"]}","snippet":"            mcp_servers={\n                \"puppeteer\": {\"command\": \"npx\", \"args\": [\"puppeteer-mcp-server\"]}\n            },","fileHash":"6931439ff8522457e1c14740e1d2def34430606f"}]},{"id":"feature-list","kind":"store","name":"feature_list.json","district":"records","summary":"The single source of truth: a list of 200+ tests, each with a passes flag. It also decides if a run is the first one.","details":"- Written by the initializer, flipped to passes: true by coding agents\n- Its existence switches the loop from initializer to coding mode\n- progress.py counts passing / total for the progress line\n- Missing, broken or empty file all print 'not yet created'","source":[{"file":"autonomous-coding/progress.py","lines":[12,36],"anchor":"passing = sum(1 for test in tests if test.get(\"passes\", False))","snippet":"def count_passing_tests(project_dir: Path) -> tuple[int, int]:\n    \"\"\"\n    Count passing and total tests in feature_list.json.\n\n    Args:\n        project_dir: Directory containing feature_list.json\n\n    Returns:\n        (passing_count, total_count)\n    \"\"\"\n    tests_file = project_dir / \"feature_list.json\"\n\n    if not tests_file.exists():\n        return 0, 0\n\n    try:\n        with open(tests_file, \"r\") as f:\n            tests = json.load(f)\n\n        total = len(tests)\n        passing = sum(1 for test in tests if test.get(\"passes\", False))\n\n        return passing, total\n    except (json.JSONDecodeError, IOError):\n        return 0, 0","fileHash":"e42c6f3e51ade9249158ab007bb5567637a3c592"},{"file":"autonomous-coding/agent.py","lines":[125,126],"anchor":"tests_file = project_dir / \"feature_list.json\"","snippet":"    tests_file = project_dir / \"feature_list.json\"\n    is_first_run = not tests_file.exists()","fileHash":"224934fb546095cb539106e9b2caa35a655fe5ea"}]},{"id":"progress-and-git","kind":"store","name":"Progress notes and git log","district":"records","summary":"The memory between shifts. Since every session forgets everything, agents leave notes in claude-progress.txt and commits in git.","details":"- claude-progress.txt: what was done, what is next, X/200 passing\n- git: one commit per finished feature\n- The next agent reads both in Step 1","source":[{"file":"autonomous-coding/prompts/coding_prompt.md","lines":[128,149],"anchor":"### STEP 9: UPDATE PROGRESS NOTES","snippet":"### STEP 8: COMMIT YOUR PROGRESS\n\nMake a descriptive git commit:\n```bash\ngit add .\ngit commit -m \"Implement [feature name] - verified end-to-end\n\n- Added [specific changes]\n- Tested with browser automation\n- Updated feature_list.json: marked test #X as passing\n- Screenshots in verification/ directory\n\"\n```\n\n### STEP 9: UPDATE PROGRESS NOTES\n\nUpdate `claude-progress.txt` with:\n- What you accomplished this session\n- Which test(s) you completed\n- Any issues discovered or fixed\n- What should be worked on next\n- Current completion status (e.g., \"45/200 tests passing\")","fileHash":"c9615a6f8e5af14f1383ff22f7f367599dde6137"},{"file":"autonomous-coding/prompts/initializer_prompt.md","lines":[70,77],"anchor":"### THIRD TASK: Initialize Git","snippet":"### THIRD TASK: Initialize Git\n\nCreate a git repository and make your first commit with:\n- feature_list.json (complete with all 200+ features)\n- init.sh (environment setup script)\n- README.md (project overview and setup instructions)\n\nCommit message: \"Initial setup: feature_list.json, init.sh, and project structure\"","fileHash":"bd2493fedf1dd946f82bf31b26d3a70075e5c362"}]}],"flows":[{"id":"session-cycle","name":"A run of the factory","trigger":"User runs python autonomous_agent_demo.py --project-dir ./my_project","summary":"The script checks the key, decides if this is a fresh project, then loops: check the limit, pick a prompt, run one session, show progress, repeat.","start":"s1","steps":[{"id":"s1","at":"cli-entry","action":"Reads options and checks that ANTHROPIC_API_KEY is set","carries":"{ project_dir: 'generations/my_project', max_iterations: 1 }","source":{"file":"autonomous-coding/autonomous_agent_demo.py","lines":[80,85],"anchor":"if not os.environ.get(\"ANTHROPIC_API_KEY\"):","snippet":"    if not os.environ.get(\"ANTHROPIC_API_KEY\"):\n        print(\"Error: ANTHROPIC_API_KEY environment variable not set\")\n        print(\"\\nGet your API key from: https://console.anthropic.com/\")\n        print(\"\\nThen set it:\")\n        print(\"  export ANTHROPIC_API_KEY='your-api-key-here'\")\n        return","fileHash":"c6724adde52db94911f00a127347a54e64576f70"},"next":[{"to":"s2","when":"API key is set"},{"to":"outcome:no-key","when":"API key is missing"}],"screen":{"name":"python autonomous_agent_demo.py","kind":"terminal","blocks":[{"t":"title","text":"python autonomous_agent_demo.py"},{"t":"input","text":"python autonomous_agent_demo.py --project-dir ./my_project"},{"t":"text","text":"Nothing is printed yet.","state":"muted"}],"note":"The command has just been typed."}},{"id":"s2","at":"session-loop","action":"Looks for feature_list.json to set is_first_run; on a fresh project copies app_spec.txt in","carries":"{ is_first_run: true }","source":{"file":"autonomous-coding/agent.py","lines":[124,141],"anchor":"is_first_run = not tests_file.exists()","snippet":"    # Check if this is a fresh start or continuation\n    tests_file = project_dir / \"feature_list.json\"\n    is_first_run = not tests_file.exists()\n\n    if is_first_run:\n        print(\"Fresh start - will use initializer agent\")\n        print()\n        print(\"=\" * 70)\n        print(\"  NOTE: First session takes 10-20+ minutes!\")\n        print(\"  The agent is generating 200 detailed test cases.\")\n        print(\"  This may appear to hang - it's working. Watch for [Tool: ...] output.\")\n        print(\"=\" * 70)\n        print()\n        # Copy the app spec into the project directory for the agent to read\n        copy_spec_to_project(project_dir)\n    else:\n        print(\"Continuing existing project\")\n        print_progress_summary(project_dir)","fileHash":"224934fb546095cb539106e9b2caa35a655fe5ea"},"next":[{"to":"s3","when":"always"}],"screen":{"name":"python autonomous_agent_demo.py","kind":"terminal","blocks":[{"t":"console","items":["======================================================================","  AUTONOMOUS CODING AGENT DEMO","======================================================================","Project directory: generations/\u003cproject>","Model: \u003cmodel>","Max iterations: \u003cn>"]},{"t":"card","text":"Then one of","items":["Fresh start - will use initializer agent","Continuing existing project"]},{"t":"card","text":"On a fresh start only","items":["  NOTE: First session takes 10-20+ minutes!","  The agent is generating 200 detailed test cases.","  This may appear to hang - it's working. Watch for [Tool: ...] output."]},{"t":"text","text":"On an existing project a \"Progress:\" line follows instead of the note.","state":"muted"}],"note":"The banner and settings print, then a line saying if this is a fresh start or a continuation."}},{"id":"s3","at":"max-iterations","action":"Adds 1 to the iteration count and compares it to the limit","carries":"{ iteration: 1 }","source":{"file":"autonomous-coding/agent.py","lines":[146,153],"anchor":"if max_iterations and iteration > max_iterations:","snippet":"    while True:\n        iteration += 1\n\n        # Check max iterations\n        if max_iterations and iteration > max_iterations:\n            print(f\"\\nReached max iterations ({max_iterations})\")\n            print(\"To continue, run the script again without --max-iterations\")\n            break","fileHash":"224934fb546095cb539106e9b2caa35a655fe5ea"},"next":[{"to":"s4","when":"no limit, or still under it"},{"to":"outcome:stopped","when":"iteration is over the limit"}]},{"id":"s4","at":"session-loop","action":"Makes a fresh client and picks the prompt; the initializer flag is cleared right after use","carries":"{ prompt: 'initializer_prompt' | 'coding_prompt' }","source":{"file":"autonomous-coding/agent.py","lines":[161,169],"anchor":"is_first_run = False  # Only use initializer once","snippet":"        # Choose prompt based on session type\n        if is_first_run:\n            prompt = get_initializer_prompt()\n            is_first_run = False  # Only use initializer once\n        else:\n            prompt = get_coding_prompt()\n\n        # Run session with async context manager\n        async with client:","fileHash":"224934fb546095cb539106e9b2caa35a655fe5ea"},"next":[{"to":"s5","when":"is_first_run is true"},{"to":"s6","when":"is_first_run is false"}],"screen":{"name":"python autonomous_agent_demo.py","kind":"terminal","blocks":[{"t":"title","text":"python autonomous_agent_demo.py"},{"t":"console","items":["======================================================================","  SESSION \u003cn>: \u003cINITIALIZER or CODING AGENT>","======================================================================"]},{"t":"console","items":["Created security settings at \u003cpath>","   - Sandbox enabled (OS-level bash isolation)","   - Filesystem restricted to: \u003cproject folder>","   - Bash commands restricted to allowlist (see security.py)","   - MCP servers: puppeteer (browser automation)"]}],"note":"A session header names which agent runs, then the safety settings are listed."}},{"id":"s5","at":"initializer-agent","action":"Reads the spec, writes 200 tests, init.sh, and the first git commit","carries":"feature_list.json with 200 x { passes: false }","source":{"file":"autonomous-coding/prompts/initializer_prompt.md","lines":[12,17],"anchor":"### CRITICAL FIRST TASK: Create feature_list.json","snippet":"### CRITICAL FIRST TASK: Create feature_list.json\n\nBased on `app_spec.txt`, create a file called `feature_list.json` with 200 detailed\nend-to-end test cases. This file is the single source of truth for what\nneeds to be built.\n","fileHash":"bd2493fedf1dd946f82bf31b26d3a70075e5c362"},"next":[{"to":"s7","when":"always"}],"screen":{"name":"python autonomous_agent_demo.py","kind":"terminal","blocks":[{"t":"title","text":"python autonomous_agent_demo.py"},{"t":"console","items":["Sending prompt to Claude Agent SDK...","\u003cClaude's text as it streams>","[Tool: \u003ctool name>]","   Input: \u003cthe tool input>"]},{"t":"console","items":["   [Done]"],"state":"active"}],"note":"The initializer's work scrolls by: its text and each tool it uses."}},{"id":"s6","at":"coding-agent","action":"Reads notes, re-tests old features, builds one failing feature, commits","carries":"one test flipped to { passes: true }","source":{"file":"autonomous-coding/prompts/coding_prompt.md","lines":[69,74],"anchor":"### STEP 4: CHOOSE ONE FEATURE TO IMPLEMENT","snippet":"### STEP 4: CHOOSE ONE FEATURE TO IMPLEMENT\n\nLook at feature_list.json and find the highest-priority feature with \"passes\": false.\n\nFocus on completing one feature perfectly and completing its testing steps in this session before moving on to other features.\nIt's ok if you only complete one feature in this session, as there will be more sessions later that continue to make progress.","fileHash":"c9615a6f8e5af14f1383ff22f7f367599dde6137"},"next":[{"to":"s7","when":"always"}],"screen":{"name":"python autonomous_agent_demo.py","kind":"terminal","blocks":[{"t":"title","text":"python autonomous_agent_demo.py"},{"t":"console","items":["Sending prompt to Claude Agent SDK...","\u003cClaude's text as it streams>","[Tool: \u003ctool name>]","   Input: \u003cthe tool input>"]},{"t":"console","items":["   [Done]"],"state":"active"}],"note":"The coding agent's work scrolls by: its text and each tool it uses."}},{"id":"s7","at":"claude-api","action":"Streams the session until Claude stops; an exception turns into status 'error'","carries":"{ status: 'continue' | 'error' }","source":{"file":"autonomous-coding/agent.py","lines":[168,181],"anchor":"status, response = await run_agent_session(client, prompt, project_dir)","snippet":"        # Run session with async context manager\n        async with client:\n            status, response = await run_agent_session(client, prompt, project_dir)\n\n        # Handle status\n        if status == \"continue\":\n            print(f\"\\nAgent will auto-continue in {AUTO_CONTINUE_DELAY_SECONDS}s...\")\n            print_progress_summary(project_dir)\n            await asyncio.sleep(AUTO_CONTINUE_DELAY_SECONDS)\n\n        elif status == \"error\":\n            print(\"\\nSession encountered an error\")\n            print(\"Will retry with a fresh session...\")\n            await asyncio.sleep(AUTO_CONTINUE_DELAY_SECONDS)","fileHash":"224934fb546095cb539106e9b2caa35a655fe5ea"},"next":[{"to":"s8","when":"status is 'continue'"},{"to":"s3","when":"status is 'error' (wait 3s, retry with a fresh session)"}],"screen":{"name":"python autonomous_agent_demo.py","kind":"terminal","blocks":[{"t":"title","text":"python autonomous_agent_demo.py"},{"t":"card","text":"If the session finished","items":["----------------------------------------------------------------------","Agent will auto-continue in 3s..."],"state":"ok"},{"t":"card","text":"If the session crashed","items":["Error during agent session: \u003cthe error>","Session encountered an error","Will retry with a fresh session..."],"state":"error"}],"note":"The stream ends with a divider line, or with an error line and a promise to retry."}},{"id":"s8","at":"feature-list","action":"Counts passing tests and prints 'Progress: X/Y', then waits 3s","carries":"'Progress: 1/200 tests passing (0.5%)'","source":{"file":"autonomous-coding/agent.py","lines":[173,176],"anchor":"Agent will auto-continue in {AUTO_CONTINUE_DELAY_SECONDS}s...","snippet":"        if status == \"continue\":\n            print(f\"\\nAgent will auto-continue in {AUTO_CONTINUE_DELAY_SECONDS}s...\")\n            print_progress_summary(project_dir)\n            await asyncio.sleep(AUTO_CONTINUE_DELAY_SECONDS)","fileHash":"224934fb546095cb539106e9b2caa35a655fe5ea"},"next":[{"to":"s3","when":"always (next loop turn)"}],"screen":{"name":"python autonomous_agent_demo.py","kind":"terminal","blocks":[{"t":"title","text":"python autonomous_agent_demo.py"},{"t":"console","items":["Agent will auto-continue in 3s...","Progress: \u003cpassing>/\u003ctotal> tests passing (\u003cpercent>%)"]},{"t":"text","text":"\"Preparing next session...\" follows only if more sessions are allowed.","state":"muted"}],"note":"A progress line is printed, then a short wait."}}],"outcomes":[{"id":"no-key","label":"Exits: API key missing","kind":"blocked","screen":{"name":"python autonomous_agent_demo.py","kind":"terminal","blocks":[{"t":"title","text":"python autonomous_agent_demo.py"},{"t":"console","items":["Error: ANTHROPIC_API_KEY environment variable not set","Get your API key from: https://console.anthropic.com/","Then set it:"]},{"t":"console","items":["  export ANTHROPIC_API_KEY='your-api-key-here'"],"state":"active"}],"note":"Four lines explain how to set the key, and the program exits."}},{"id":"stopped","label":"Limit reached, final summary printed","kind":"success","screen":{"name":"python autonomous_agent_demo.py","kind":"terminal","blocks":[{"t":"console","items":["Reached max iterations (\u003cn>)","To continue, run the script again without --max-iterations"]},{"t":"console","items":["======================================================================","  SESSION COMPLETE","======================================================================","Project directory: generations/\u003cproject>","Progress: \u003cpassing>/\u003ctotal> tests passing (\u003cpercent>%)"]},{"t":"console","items":["  TO RUN THE GENERATED APPLICATION:","  cd \u003cproject folder>","  ./init.sh           # Run the setup script","  # Or manually:","  npm install && npm run dev","  Then open http://localhost:3000 (or check init.sh for the URL)"]},{"t":"console","items":["Done!"]}],"note":"The limit message, a final summary, and how to run the built app are printed."}}],"cases":[{"id":"c1","name":"Forgot the API key","input":"ANTHROPIC_API_KEY unset","path":["s1"],"outcome":"no-key","explain":"main() prints how to set the key and returns before any session starts.","brief":"Someone starts the tool without setting an API key first.","facts":["API key not set","any project folder"]},{"id":"c2","name":"Brand-new project, one session","input":"--project-dir ./shop --max-iterations 1, no feature_list.json yet","path":["s1","s2","s3","s4","s5","s7","s8","s3"],"outcome":"stopped","explain":"No feature_list.json, so the initializer runs. On turn 2, iteration 2 > 1 so the loop stops.","brief":"A brand-new project is started with room for just one session.","facts":["API key set","no feature list yet","limit: 1 session","session finishes cleanly"]},{"id":"c3","name":"Resuming a project","input":"--max-iterations 1, feature_list.json already has 45/200 passing","path":["s1","s2","s3","s4","s6","s7","s8","s3"],"outcome":"stopped","explain":"The file exists, so is_first_run is false and the coding agent gets the shift.","brief":"A half-built project is started again with room for one session.","facts":["API key set","feature list exists","limit: 1 session","session finishes cleanly"]},{"id":"c4","name":"Network drops mid-session","input":"--max-iterations 1, existing project, client raises an exception","path":["s1","s2","s3","s4","s6","s7","s3"],"outcome":"stopped","explain":"run_agent_session returns 'error', so no progress line is printed; the loop waits and checks the limit again.","brief":"A half-built project is started again and the network drops mid-session.","facts":["API key set","feature list exists","limit: 1 session","session crashes"]}]},{"id":"bash-gate","name":"A Bash command at the checkpoint","trigger":"An agent calls the Bash tool","summary":"Before any shell command runs, the PreToolUse hook parses it, checks every command name against the allowlist, runs extra checks for pkill, chmod and init.sh, and only then lets it into the sandbox.","start":"s1","steps":[{"id":"s1","at":"coding-agent","action":"Asks to run a shell command with the Bash tool","carries":"{ tool_name: 'Bash', tool_input: { command: '...' } }","next":[{"to":"s2","when":"always"}],"screen":{"name":"python autonomous_agent_demo.py","kind":"terminal","blocks":[{"t":"title","text":"python autonomous_agent_demo.py"},{"t":"console","items":["[Tool: Bash]"]},{"t":"console","items":["   Input: {'command': '\u003cthe command>'}"],"state":"active"}],"note":"The command the agent wants to run is printed."}},{"id":"s2","at":"security-hook","action":"Splits the command and pulls out each command name","carries":"commands: ['chmod', 'init.sh']","source":{"file":"autonomous-coding/security.py","lines":[318,329],"anchor":"commands = extract_commands(command)","snippet":"    # Extract all commands from the command string\n    commands = extract_commands(command)\n\n    if not commands:\n        # Could not parse - fail safe by blocking\n        return {\n            \"decision\": \"block\",\n
