d field (command or url)","carries":"{ type: 'stdio', command: 'python', args: ['calculator_mcp.py'] }","next":[{"to":"m3","when":"config is valid"},{"to":"m5","when":"missing command/url or unknown type (ValueError)"}]},{"id":"m3","at":"mcp-servers","action":"Starts or reaches the server, opens a session, initializes, lists tools","next":[{"to":"m4","when":"server answers"},{"to":"m5","when":"connection or list_tools fails"}]},{"id":"m4","at":"mcp-tool","action":"Wraps each listed tool as an MCPTool tied to this connection","carries":"MCPTool(name='calculator', input_schema={...})","next":[{"to":"m2","when":"more servers in the list"},{"to":"m6","when":"that was the last server"}]},{"id":"m5","at":"mcp-connector","action":"Prints 'Error setting up MCP server ...' and moves on","source":{"file":"agents/utils/connections.py","lines":[144,145],"anchor":"print(f\"Error setting up MCP server {config}: {e}\")","snippet":"        except Exception as e:\n            print(f\"Error setting up MCP server {config}: {e}\")","fileHash":"b52992d9ebf05212aa4f05d69c70064e8a3c9858"},"next":[{"to":"m2","when":"more servers in the list"},{"to":"m6","when":"that was the last server"}],"screen":{"name":"setup_mcp_connections()","kind":"terminal","blocks":[{"t":"title","text":"setup_mcp_connections()"},{"t":"console","items":["Error setting up MCP server \u003cthe server config>: \u003cthe error text>"]},{"t":"card","text":"The error text can be","items":["Command is required for STDIO connections","URL is required for SSE connections","Unsupported connection type: \u003ctype>","\u003can error from the server itself>"]}],"note":"One error line is printed for the broken server; the program keeps going."}},{"id":"m6","at":"run-entry","action":"Adds the MCP tools to self.tools for this run and starts the loop","next":[{"to":"outcome:ready","when":"no server was skipped"},{"to":"outcome:ready-missing","when":"one or more servers were skipped"}],"screen":{"name":"setup_mcp_connections()","kind":"terminal","blocks":[{"t":"title","text":"setup_mcp_connections()"},{"t":"console","items":["Loaded \u003cn> MCP tools from \u003cn> servers."]},{"t":"text","text":"This line is skipped when no servers were given at all.","state":"muted"}],"note":"A count of loaded tools is printed, then the loop starts."}}],"outcomes":[{"id":"ready","label":"Agent runs with all expected tools","kind":"success","screen":{"name":"setup_mcp_connections()","kind":"terminal","blocks":[{"t":"title","text":"setup_mcp_connections()"},{"t":"console","items":["Loaded \u003cn> MCP tools from \u003cn> servers.","[\u003cagent name>] Received: \u003cthe question>"]},{"t":"text","text":"With no servers given, the \"Loaded\" line is not printed.","state":"muted"}],"note":"The agent starts on the question with every tool it expected."}},{"id":"ready-missing","label":"Agent runs without the broken server's tools","kind":"blocked","screen":{"name":"setup_mcp_connections()","kind":"terminal","blocks":[{"t":"title","text":"setup_mcp_connections()"},{"t":"console","items":["Error setting up MCP server \u003cthe server config>: \u003cthe error text>","Loaded \u003cn> MCP tools from \u003cn> servers."]},{"t":"console","items":["[\u003cagent name>] Received: \u003cthe question>"],"state":"active"}],"note":"An error line stays on screen, the count is lower, and the agent starts anyway."}}],"cases":[{"id":"c1","name":"No MCP servers","input":"Agent(name='A', system='...', tools=[ThinkTool()])","path":["m1","m6"],"outcome":"ready","explain":"setup_mcp_connections returns [] right away, so only the local tools are used.","brief":"An agent is started with one local tool and no outside servers.","facts":["no MCP servers","1 local tool"]},{"id":"c2","name":"Calculator server over stdio","input":"{ type: 'stdio', command: 'python', args: ['agents/tools/calculator_mcp.py'] }","path":["m1","m2","m3","m4","m6"],"outcome":"ready","explain":"Config is valid, the server starts and lists 'calculator', which becomes an MCPTool.","brief":"An agent is started with a calculator server it must launch.","facts":["1 server, type stdio","command is given","server answers"]},{"id":"c3","name":"SSE config with no url","input":"{ type: 'sse', headers: { Authorization: '...' } }","path":["m1","m2","m5","m6"],"outcome":"ready-missing","explain":"create_mcp_connection raises 'URL is required for SSE connections'; it is printed, the server is skipped, and the agent runs without it.","brief":"An agent is started with a web server entry that has no address.","facts":["1 server, type sse","no url given","it is the only server"]}]}],"quests":[{"id":"q1","type":"quiz","title":"When does the forge go quiet?","prompt":"What makes _agent_loop stop and return?","options":["A reply with no tool_use blocks","After a fixed number of turns","When stop_reason is 'max_tokens'","When any tool returns an error"],"answer":0,"explain":"The loop is 'while True' and only returns in the else branch, when tool_calls is empty. There is no turn cap and errors from tools are just fed back.","xp":20},{"id":"q2","type":"predict","title":"The made-up tool","prompt":"Claude asks for a tool called 'bash' that was never registered. What happens?","target":"tool-call/c3","options":["Plain result goes back to Claude","Flagged error (is_error) goes back to Claude"],"answer":1,"explain":"tool_dict['bash'] raises KeyError, caught in _execute_single_tool, which sets is_error=True.","xp":25},{"id":"q3","type":"predict","title":"Missing file, missing flag?","prompt":"Claude reads 'nope.txt', which does not exist. How does the result reach Claude?","target":"tool-call/c2","options":["Plain result goes back to Claude","Flagged error (is_error) goes back to Claude"],"answer":0,"explain":"file_read returns 'Error: File not found at nope.txt' as a normal string. Nothing raised, so the runner never sets is_error.","xp":25},{"id":"q4","type":"predict","title":"Broken portal","prompt":"One MCP config is { type: 'sse' } with no url. What does run() do?","target":"mcp-setup/c3","options":["Agent runs with all expected tools","Agent runs without the broken server's tools"],"answer":1,"explain":"The ValueError is caught inside setup_mcp_connections, printed, and that server is skipped. The run continues.","xp":25},{"id":"q5","type":"quiz","title":"Whose header wins?","prompt":"You pass message_params={'extra_headers': {'anthropic-beta': 'my-beta'}}. Which anthropic-beta header is sent?","options":["Only 'code-execution-2025-05-22'","Only 'my-beta'","Both, joined by a comma","None, the call fails"],"answer":1,"explain":"merged_headers = {**default_headers, **custom_headers}, so the custom value replaces the default key. Code execution would then lose its beta header.","xp":30},{"id":"q6","type":"quiz","title":"Who runs web search?","prompt":"WebSearchServerTool has no execute() method. Why does the agent not crash when Claude searches the web?","options":["Anthropic runs it; its block type is server_tool_use, which the 'tool_use' filter skips","execute_tools catches the missing method and ignores it","The tool is removed before the call","MCP runs it instead"],"answer":0,"explain":"The loop only collects blocks with type == 'tool_use'. Server tools are run by the API and come back already done.","xp":30},{"id":"q7","type":"quiz","title":"What the counter misses","prompt":"Which messages change history.total_tokens when they are added?","options":["Every message","Only user messages","Only assistant messages that come with usage numbers","Only tool results"],"answer":2,"explain":"add_message only updates totals under 'if role == \"assistant\" and usage'. User text and tool results are counted later, inside the next reply's input tokens.","xp":30},{"id":"q8","type":"trace","title":"Ride the loop","prompt":"Follow a question that needs the calculator all the way around the loop.","target":"agent-loop","xp":15}],"cracks":[{"id":"k1","at":"file-write-tool","severity":"high","title":"File tools can touch any path","hint":"Where is Claude allowed to write?","finding":"file_write and file_read take any path Claude gives, including absolute paths and '../'. Write even creates missing folders. There is no base folder or allowlist, so a confused or prompt-injected model can overwrite any file the process can reach.","suggestion":"Resolve the path and refuse anything outside a chosen working folder; ask before overwriting.","decoys":["Files are written without utf-8 encoding","Writes are not run in a thread, so they block the loop"],"source":{"file":"agents/tools/file_tools.py","lines":[214,230],"anchor":"os.makedirs(file_path.parent, exist_ok=True)","snippet":"    async def _write_file(self, path: str, content: str) -> str:\n        \"\"\"Write content to a file.\"\"\"\n        try:\n            file_path = Path(path)\n            os.makedirs(file_path.parent, exist_ok=True)\n\n            def write_sync():\n                with open(file_path, \"w\", encoding=\"utf-8\") as f:\n                    f.write(content)\n                return (\n                    f\"Successfully wrote {len(content)} \"\n                    f\"characters to {path}\"\n                )\n\n            return await asyncio.to_thread(write_sync)\n        except Exception as e:\n            return f\"Error writing to {path}: {str(e)}\"","fileHash":"c2bf555ec6d619bbaea08f247ab342d62940701e"}},{"id":"k2","at":"forge-agent","severity":"medium","title":"The loop has no turn limit","hint":"What stops a model that keeps calling tools?","finding":"_agent_loop is 'while True' and only exits when a reply has no tool calls. If Claude keeps asking for tools (for example retrying a failing one), the agent keeps calling the API and spending tokens with no cap.","suggestion":"Add a max_turns setting and stop with a clear message when it is reached.","decoys":["Tools run in parallel, so results can arrive out of order","max_tokens 4096 is too small for long answers"],"source":{"file":"agents/agent.py","lines":[104,155],"anchor":"while True:","snippet":"        while True:\n            self.history.truncate()\n            params = self._prepare_message_params()\n\n            # Merge headers properly - default beta header can be overridden by message_params\n            default_headers = {\"anthropic-beta\": \"code-execution-2025-05-22\"}\n            if \"extra_headers\" in params:\n                # Pop extra_headers from params and merge with defaults\n                custom_headers = params.pop(\"extra_headers\")\n                merged_headers = {**default_headers, **custom_headers}\n            else:\n                merged_headers = default_headers\n\n            response = self.client.messages.create(\n                **params,\n                extra_headers=merged_headers\n            )\n            tool_calls = [\n                block for block in response.content if block.type == \"tool_use\"\n            ]\n\n            if self.verbose:\n                for block in response.content:\n                    if block.type == \"text\":\n                        print(f\"\\n[{self.name}] Output: {block.text}\")\n                    elif block.type == \"tool_use\":\n                        params_str = \", \".join(\n                            [f\"{k}={v}\" for k, v in block.input.items()]\n                        )\n                        print(\n                            f\"\\n[{self.name}] Tool call: \"\n                            f\"{block.name}({params_str})\"\n                        )\n\n            await self.history.add_message(\n                \"assistant\", response.content, response.usage\n            )\n\n            if tool_calls:\n                tool_results = await execute_tools(\n                    tool_calls,\n                    tool_dict,\n                )\n                if self.verbose:\n                    for block in tool_results:\n                        print(\n                            f\"\\n[{self.name}] Tool result: \"\n                            f\"{block.get('content')}\"\n                        )\n                await self.history.add_message(\"user\", tool_results)\n            else:\n                return response","fileHash":"44abd1b32eb7f31ecbe7b8ee28b9d184d96b231c"}},{"id":"k3","at":"context-trimmer","severity":"medium","title":"Big tool results are not counted before the next call","hint":"When does total_tokens learn about a tool result?","finding":"total_tokens only grows when an assistant reply arrives with usage. A tool result (say a whole large file read with max_lines=0) is added without counting, so truncate() checks an old number and lets the request go out. The API can then reject it as too long, and that error is not caught.","suggestion":"Estimate or count tokens for new user/tool messages before calling truncate(), or cap tool output size.","decoys":["The truncation notice is counted as 25 tokens instead of its real size","Messages are removed in pairs instead of one by one"],"source":{"file":"agents/utils/history_util.py","lines":[57,67],"anchor":"if role == \"assistant\" and usage:","snippet":"        if role == \"assistant\" and usage:\n            total_input = (\n                usage.input_tokens\n                + getattr(usage, \"cache_read_input_tokens\", 0)\n                + getattr(usage, \"cache_creation_input_tokens\", 0)\n            )\n            output_tokens = usage.output_tokens\n\n            current_turn_input = total_input - self.total_tokens\n            self.message_tokens.append((current_turn_input, output_tokens))\n            self.total_tokens += current_turn_input + output_tokens","fileHash":"dadaf38378a987fd8ec0b730fe7fd1c18f5bbf7a"}},{"id":"k4","at":"file-write-tool","severity":"low","title":"Edit replaces every match, not one","hint":"What if old_text shows up three times?","finding":"When old_text appears more than once, edit still replaces all copies and only then reports a warning. A short old_text can silently change places Claude did not mean to touch.","suggestion":"Refuse the edit when there is more than one match and ask for more context.","decoys":["Edit fails on files with Windows line endings","Edit does not check that the file exists"],"source":{"file":"agents/tools/file_tools.py","lines":[255,265],"anchor":"count = content.count(old_text)","snippet":"                    # Count occurrences to warn about multiple matches\n                    count = content.count(old_text)\n                    if count > 1:\n                        # Edit with warning about multiple occurrences\n                        new_content = content.replace(old_text, new_text)\n                        with open(file_path, \"w\", encoding=\"utf-8\") as f:\n                            f.write(new_content)\n                        return (\n                            f\"Warning: Found {count} occurrences. \"\n                            f\"All were replaced in {path}\"\n                        )","fileHash":"c2bf555ec6d619bbaea08f247ab342d62940701e"}}]},{"id":"control-tower","name":"computer-use-demo","theme":"tundra","tagline":"Where Claude looks at a screen, moves the mouse, and types commands in a loop","summary":"A demo that lets Claude drive a Linux desktop inside a Docker container. A Streamlit page takes your message, then a sampling loop keeps calling the Claude API and running the tools Claude asks for (screen/mouse/keyboard, bash, file editor) until Claude stops asking. Tool versions decide which tools and beta headers are sent.","paths":["computer-use-demo/computer_use_demo/","computer-use-demo/image/","computer-use-demo/Dockerfile","computer-use-demo/tests/"],"districts":[{"id":"cockpit","name":"Cockpit (Streamlit UI)"},{"id":"tower","name":"Tower (sampling loop)"},{"id":"sky","name":"Sky (Claude API)"},{"id":"hangar","name":"Hangar (tools)"}],"entities":[{"id":"streamlit-app","kind":"entry","name":"Streamlit chat page","district":"cockpit","summary":"The web page you open at port 8080. It shows the chat, takes your message and starts the sampling loop.","details":"- Started by image/entrypoint.sh after the virtual desktop is up\n- Re-renders the whole chat on every Streamlit run\n- Your message is added to the conversation, then sampling_loop is awaited\n- Callbacks render Claude's text, tool results and raw HTTP logs as they arrive","source":[{"file":"computer-use-demo/computer_use_demo/streamlit.py","lines":[244,253],"anchor":"async def main():","snippet":"async def main():\n    \"\"\"Render loop for streamlit\"\"\"\n    setup_state()\n\n    st.markdown(STREAMLIT_STYLE, unsafe_allow_html=True)\n\n    st.title(\"Claude Computer Use Demo\")\n\n    if not os.getenv(\"HIDE_WARNING\", False):\n        st.warning(WARNING_TEXT)","fileHash":"f7973853289e0ac461dd1238d3140214106b1fa4"},{"file":"computer-use-demo/computer_use_demo/streamlit.py","lines":[419,465],"anchor":"st.session_state.messages = await sampling_loop(","snippet":"        # render past chats\n        if new_message:\n            st.session_state.messages.append(\n                {\n                    \"role\": Sender.USER,\n                    \"content\": [\n                        *maybe_add_interruption_blocks(),\n                        BetaTextBlockParam(type=\"text\", text=new_message),\n                    ],\n                }\n            )\n            _render_message(Sender.USER, new_message)\n\n        try:\n            most_recent_message = st.session_state[\"messages\"][-1]\n        except IndexError:\n            return\n\n        if most_recent_message[\"role\"] is not Sender.USER:\n            # we don't have a user message to respond to, exit early\n            return\n\n        with track_sampling_loop():\n            # run the agent sampling loop with the newest message\n            st.session_state.messages = await sampling_loop(\n                system_prompt_suffix=st.session_state.custom_system_prompt,\n                model=st.session_state.model,\n                provider=st.session_state.provider,\n                messages=st.session_state.messages,\n                output_callback=partial(_render_message, Sender.BOT),\n                tool_output_callback=partial(\n                    _tool_output_callback, tool_state=st.session_state.tools\n                ),\n                api_response_callback=partial(\n                    _api_response_callback,\n                    tab=http_logs,\n                    response_state=st.session_state.responses,\n                ),\n                api_key=st.session_state.api_key,\n                only_n_most_recent_images=st.session_state.only_n_most_recent_images,\n                tool_version=st.session_state.tool_versions,\n                max_tokens=st.session_state.output_tokens,\n                thinking_mode=st.session_state.thinking_mode,\n                thinking_effort=st.session_state.thinking_effort,\n                thinking_budget=st.session_state.thinking_budget,\n                token_efficient_tools_beta=st.session_state.token_efficient_tools_beta,\n            )","fileHash":"f7973853289e0ac461dd1238d3140214106b1fa4"},{"file":"computer-use-demo/image/entrypoint.sh","lines":[1,15],"anchor":"python -m streamlit run computer_use_demo/streamlit.py","snippet":"#!/bin/bash\nset -e\n\n./start_all.sh\n./novnc_startup.sh\n\npython http_server.py > /tmp/server_logs.txt 2>&1 &\n\nSTREAMLIT_SERVER_PORT=8501 python -m streamlit run computer_use_demo/streamlit.py > /tmp/streamlit_stdout.log &\n\necho \"✨ Computer Use Demo is ready!\"\necho \"➡️  Open http://localhost:8080 in your browser to begin\"\n\n# Keep the container running\ntail -f /dev/null","fileHash":"4d5a3fe3242c75156b3b263d35a38a88262b1fd7"}]},{"id":"sidebar","kind":"ui","name":"Settings sidebar","district":"cockpit","summary":"The left panel where you pick the API provider, model, tool version, image limit and thinking mode.","details":"- Provider radio: anthropic, bedrock or vertex\n- 'Only send N most recent images' defaults to 3\n- Tool Versions radio lists every ToolVersion\n- Thinking options shown depend on the model's config\n- Reset button kills Xvfb and tint2 and restarts the desktop","source":[{"file":"computer-use-demo/computer_use_demo/streamlit.py","lines":[255,311],"anchor":"\"Only send N most recent images\",","snippet":"    with st.sidebar:\n\n        def _reset_api_provider():\n            if st.session_state.provider_radio != st.session_state.provider:\n                _reset_model()\n                st.session_state.provider = st.session_state.provider_radio\n                st.session_state.auth_validated = False\n\n        provider_options = [option.value for option in APIProvider]\n        st.radio(\n            \"API Provider\",\n            options=provider_options,\n            key=\"provider_radio\",\n            format_func=lambda x: x.title(),\n            on_change=_reset_api_provider,\n        )\n\n        st.text_input(\"Model\", key=\"model\", on_change=_reset_model_conf)\n\n        if st.session_state.provider == APIProvider.ANTHROPIC:\n            st.text_input(\n                \"Claude API Key\",\n                type=\"password\",\n                key=\"api_key\",\n                on_change=lambda: save_to_storage(\"api_key\", st.session_state.api_key),\n            )\n\n        st.number_input(\n            \"Only send N most recent images\",\n            min_value=0,\n            key=\"only_n_most_recent_images\",\n            help=\"To decrease the total tokens sent, remove older screenshots from the conversation\",\n        )\n        st.text_area(\n            \"Custom System Prompt Suffix\",\n            key=\"custom_system_prompt\",\n            help=\"Additional instructions to append to the system prompt. see computer_use_demo/loop.py for the base system prompt.\",\n            on_change=lambda: save_to_storage(\n                \"system_prompt\", st.session_state.custom_system_prompt\n            ),\n        )\n        st.checkbox(\"Hide screenshots\", key=\"hide_images\")\n        st.checkbox(\n            \"Enable token-efficient tools beta\", key=\"token_efficient_tools_beta\"\n        )\n        versions = get_args(ToolVersion)\n        st.radio(\n            \"Tool Versions\",\n            key=\"tool_versions\",\n            options=versions,\n            index=versions.index(st.session_state.tool_version),\n            on_change=lambda: setattr(\n                st.session_state,\n                \"tool_version\",\n                st.session_state.get(\"tool_versions\", st.session_state.tool_version),\n            ),\n        )","fileHash":"f7973853289e0ac461dd1238d3140214106b1fa4"},{"file":"computer-use-demo/computer_use_demo/streamlit.py","lines":[315,380],"anchor":"\"Thinking Effort\",","snippet":"        # Thinking controls. Which modes are offered depends on the selected\n        # model: newer models (Opus 4.6 / Sonnet 4.6 and later) reason\n        # adaptively, steered by an effort level, while older models take an\n        # explicit thinking token budget. The options are derived from the\n        # current model string (not cached state) and any selection that the\n        # current model doesn't support is reset to its default, so an\n        # unsupported mode can never be sent to the API for a known model.\n        model_conf = _lookup_model_conf(st.session_state.model)\n        thinking_modes = model_conf.thinking_modes\n        st.session_state.thinking_modes = thinking_modes\n        # The three thinking widgets below render conditionally, and Streamlit\n        # deletes a widget's session_state key at the end of any run that\n        # doesn't render it (e.g. picking \"Off\" removes the effort slider and,\n        # with it, `thinking_effort`). Re-assigning the keys each run detaches\n        # them from the widget lifecycle so the sampling loop can always read\n        # them; the defaults cover a key that was already dropped.\n        for key, default in (\n            (\"thinking_mode\", thinking_modes[0]),\n            (\"thinking_effort\", \"medium\"),\n            (\"thinking_budget\", int(model_conf.default_output_tokens / 2)),\n        ):\n            st.session_state[key] = st.session_state.get(key, default)\n        if st.session_state.thinking_mode not in thinking_modes:\n            st.session_state.thinking_mode = thinking_modes[0]\n        if model_conf is DEFAULT_MODEL_CONF:\n            st.caption(\n                \"⚠️ Unrecognized model — all thinking modes are shown. Pick the \"\n                \"one this model supports; an unsupported mode will be rejected \"\n                \"by the API.\"\n            )\n        if len(thinking_modes) > 1:\n            st.radio(\n                \"Thinking\",\n                options=thinking_modes,\n                key=\"thinking_mode\",\n                format_func=str.capitalize,\n                horizontal=True,\n                help=(\n                    \"Adaptive: the model decides how much to think, steered by \"\n                    \"the effort level below. Extended: a fixed thinking token \"\n                    \"budget. Only the modes the selected model supports are \"\n                    \"shown.\"\n                ),\n            )\n            if st.session_state.thinking_mode == \"adaptive\":\n                st.select_slider(\n                    \"Thinking Effort\",\n                    options=get_args(ThinkingEffort),\n                    key=\"thinking_effort\",\n                )\n            elif st.session_state.thinking_mode == \"extended\":\n                st.number_input(\n                    \"Thinking Budget\",\n                    key=\"thinking_budget\",\n                    max_value=st.session_state.max_output_tokens,\n                    step=1,\n                )\n\n        if st.button(\"Reset\", type=\"primary\"):\n            with st.spinner(\"Resetting...\"):","snippetCut":true,"fileHash":"f7973853289e0ac461dd1238d3140214106b1fa4"}]},{"id":"auth-check","kind":"guardrail","name":"Provider credentials check","district":"cockpit","summary":"Before the chat appears, checks that the chosen provider has credentials.","details":"- Anthropic: API key must not be empty\n- Bedrock: boto3 must find AWS credentials\n- Vertex: CLOUD_ML_REGION must be set and Google default credentials must load\n- Runs once; then auth_validated is set to True","source":[{"file":"computer-use-demo/computer_use_demo/streamlit.py","lines":[503,523],"anchor":"def validate_auth(provider: APIProvider, api_key: str | None):","snippet":"def validate_auth(provider: APIProvider, api_key: str | None):\n    if provider == APIProvider.ANTHROPIC:\n        if not api_key:\n            return \"Enter your Claude API key in the sidebar to continue.\"\n    if provider == APIProvider.BEDROCK:\n        import boto3\n\n        if not boto3.Session().get_credentials():\n            return \"You must have AWS credentials set up to use the Bedrock API.\"\n    if provider == APIProvider.VERTEX:\n        import google.auth\n        from google.auth.exceptions import DefaultCredentialsError\n\n        if not os.environ.get(\"CLOUD_ML_REGION\"):\n            return \"Set the CLOUD_ML_REGION environment variable to use the Vertex API.\"\n        try:\n            google.auth.default(\n                scopes=[\"https://www.googleapis.com/auth/cloud-platform\"],\n            )\n        except DefaultCredentialsError:\n            return \"Your google cloud credentials are not set up correctly.\"","fileHash":"f7973853289e0ac461dd1238d3140214106b1fa4"},{"file":"computer-use-demo/computer_use_demo/streamlit.py","lines":[382,389],"anchor":"if auth_error := validate_auth(","snippet":"    if not st.session_state.auth_validated:\n        if auth_error := validate_auth(\n            st.session_state.provider, st.session_state.api_key\n        ):\n            st.warning(f\"Please resolve the following auth issue:\\n\\n{auth_error}\")\n            return\n        else:\n            st.session_state.auth_validated = True","fileHash":"f7973853289e0ac461dd1238d3140214106b1fa4"}],"guard":{"rule":"The chosen API provider must have usable credentials","checks":"API key present (Anthropic), AWS credentials (Bedrock), CLOUD_ML_REGION + Google creds (Vertex)","onFail":"A warning with the auth problem is shown and the chat is not rendered"}},{"id":"sampling-loop","kind":"agent","name":"Sampling loop","district":"tower","summary":"The heart of the demo: calls Claude, runs every tool Claude asks for, sends the results back, and repeats.","details":"- Builds the tool list from the chosen tool version\n- Each turn: call API, append Claude's reply, run each tool_use block\n- Tool results go back as a user message, then the loop runs again\n- Stops when a reply has no tool_use blocks, or on an API error\n- Toolset member calls run in order and stop at the first failure","source":[{"file":"computer-use-demo/computer_use_demo/loop.py","lines":[88,117],"anchor":"async def sampling_loop(","snippet":"async def sampling_loop(\n    *,\n    model: str,\n    provider: APIProvider,\n    system_prompt_suffix: str,\n    messages: list[BetaMessageParam],\n    output_callback: Callable[[BetaContentBlockParam], None],\n    tool_output_callback: Callable[[ToolResult, str], None],\n    api_response_callback: Callable[\n        [httpx.Request, httpx.Response | object | None, Exception | None], None\n    ],\n    api_key: str,\n    only_n_most_recent_images: int | None = None,\n    max_tokens: int = 4096,\n    tool_version: ToolVersion,\n    thinking_mode: ThinkingMode = \"off\",\n    thinking_effort: ThinkingEffort = \"medium\",\n    thinking_budget: int | None = None,\n    token_efficient_tools_beta: bool = False,\n):\n    \"\"\"\n    Agentic sampling loop for the assistant/tool interaction of computer use.\n    \"\"\"\n    tool_group = TOOL_GROUPS_BY_VERSION[tool_version]\n    tool_collection = ToolCollection(*(ToolCls() for ToolCls in tool_group.tools))\n    system = BetaTextBlockParam(\n        type=\"text\",\n        text=f\"{SYSTEM_PROMPT}{' ' + system_prompt_suffix if system_prompt_suffix else ''}\",\n    )\n","fileHash":"9557e1c0504c7a1e0a1c2a2cb3d3730799cd83c0"},{"file":"computer-use-demo/computer_use_demo/loop.py","lines":[200,236],"anchor":"if toolset_name is not None and member_call_failed:","snippet":"        tool_result_content: list[BetaToolResultBlockParam] = []\n        member_call_failed = False\n        for content_block in response_params:\n            output_callback(content_block)\n            if (\n                isinstance(content_block, dict)\n                and content_block.get(\"type\") == \"tool_use\"\n            ):\n                # Type narrowing for tool use blocks\n                tool_use_block = cast(BetaToolUseBlockParam, content_block)\n                # A toolset member call carries toolset_name naming its\n                # family; its tool_result must carry the same toolset_name.\n                toolset_name = cast(\n                    str | None,\n                    cast(dict[str, Any], content_block).get(\"toolset_name\"),\n                )\n                if toolset_name is not None and member_call_failed:\n                    # Toolset member calls run sequentially in block order and\n                    # stop on the first failure; the remaining member calls\n                    # are answered without being executed.\n                    result: ToolResult = ToolFailure(error=NOT_EXECUTED_ERROR)\n                else:\n                    result = await tool_collection.run(\n                        name=tool_use_block[\"name\"],\n                        tool_input=cast(\n                            dict[str, Any], tool_use_block.get(\"input\", {})\n                        ),\n                        toolset_name=toolset_name,\n                    )\n                    if toolset_name is not None and result.error:\n                        member_call_failed = True\n                tool_result_content.append(\n                    _make_api_tool_result(\n                        result, tool_use_block[\"id\"], toolset_name=toolset_name\n                    )\n                )\n                tool_output_callback(result, tool_use_block[\"id\"])","fileHash":"9557e1c0504c7a1e0a1c2a2cb3d3730799cd83c0"},{"file":"computer-use-demo/computer_use_demo/loop.py","lines":[238,241],"anchor":"if not tool_result_content:","snippet":"        if not tool_result_content:\n            return messages\n\n        messages.append({\"content\": tool_result_content, \"role\": \"user\"})","fileHash":"9557e1c0504c7a1e0a1c2a2cb3d3730799cd83c0"}],"agent":{"role":"Controls a Linux desktop by looking at screenshots and using mouse, keyboard, shell and file tools","model":"claude-opus-4-8","tools":["computer-tool","bash-tool","edit-tool"],"prompt":"system-prompt"}},{"id":"context-trimmer","kind":"guardrail","name":"Screenshot trimmer and prompt cache","district":"tower","summary":"Keeps the conversation affordable: either caches it (Anthropic) or drops old screenshots (Bedrock/Vertex).","details":"- On Anthropic: adds cache breakpoints to the 3 newest user turns and sets image trimming to 0\n- Comment says cached reads cost 10%, so breaking the cache is not worth it\n- Otherwise: removes all but the N newest screenshot images\n- Removes images in chunks of N so the cache breaks less often","source":[{"file":"computer-use-demo/computer_use_demo/loop.py","lines":[119,146],"anchor":"only_n_most_recent_images = 0","snippet":"        enable_prompt_caching = False\n        betas = [tool_group.beta_flag] if tool_group.beta_flag else []\n        if token_efficient_tools_beta:\n            betas.append(\"token-efficient-tools-2025-02-19\")\n        image_truncation_threshold = only_n_most_recent_images or 0\n        if provider == APIProvider.ANTHROPIC:\n            client = Anthropic(api_key=api_key, max_retries=4)\n            enable_prompt_caching = True\n        elif provider == APIProvider.VERTEX:\n            client = AnthropicVertex()\n        elif provider == APIProvider.BEDROCK:\n            client = AnthropicBedrock()\n\n        if enable_prompt_caching:\n            betas.append(PROMPT_CACHING_BETA_FLAG)\n            _inject_prompt_caching(messages)\n            # Because cached reads are 10% of the price, we don't think it's\n            # ever sensible to break the cache by truncating images\n            only_n_most_recent_images = 0\n            # Use type ignore to bypass TypedDict check until SDK types are updated\n            system[\"cache_control\"] = {\"type\": \"ephemeral\"}  # type: ignore\n\n        if only_n_most_recent_images:\n            _maybe_filter_to_n_most_recent_images(\n                messages,\n                only_n_most_recent_images,\n                min_removal_threshold=image_truncation_threshold,\n            )","fileHash":"9557e1c0504c7a1e0a1c2a2cb3d3730799cd83c0"},{"file":"computer-use-demo/computer_use_demo/loop.py","lines":[244,290],"anchor":"images_to_remove -= images_to_remove % min_removal_threshold","snippet":"def _maybe_filter_to_n_most_recent_images(\n    messages: list[BetaMessageParam],\n    images_to_keep: int,\n    min_removal_threshold: int,\n):\n    \"\"\"\n    With the assumption that images are screenshots that are of diminishing value as\n    the conversation progresses, remove all but the final `images_to_keep` tool_result\n    images in place, with a chunk of min_removal_threshold to reduce the amount we\n    break the implicit prompt cache.\n    \"\"\"\n    if images_to_keep is None:\n        return messages\n\n    tool_result_blocks = cast(\n        list[BetaToolResultBlockParam],\n        [\n            item\n            for message in messages\n            for item in (\n                message[\"content\"] if isinstance(message[\"content\"], list) else []\n            )\n            if isinstance(item, dict) and item.get(\"type\") == \"tool_result\"\n        ],\n    )\n\n    total_images = sum(\n        1\n        for tool_result in tool_result_blocks\n        for content in tool_result.get(\"content\", [])\n        if isinstance(content, dict) and content.get(\"type\") == \"image\"\n    )\n\n    images_to_remove = total_images - images_to_keep\n    # for better cache behavior, we want to remove in chunks\n    images_to_remove -= images_to_remove % min_removal_threshold\n\n    for tool_result in tool_result_blocks:\n        if isinstance(tool_result.get(\"content\"), list):\n            new_content = []\n            for content in tool_result.get(\"content\", []):\n                if isinstance(content, dict) and content.get(\"type\") == \"image\":\n                    if images_to_remove > 0:\n                        images_to_remove -= 1\n                        continue\n                new_content.append(content)\n            tool_result[\"content\"] = new_content","fileHash":"9557e1c0504c7a1e0a1c2a2cb3d3730799cd83c0"},{"file":"computer-use-demo/computer_use_demo/loop.py","lines":[316,339],"anchor":"breakpoints_remaining = 3","snippet":"def _inject_prompt_caching(\n    messages: list[BetaMessageParam],\n):\n    \"\"\"\n    Set cache breakpoints for the 3 most recent turns\n    one cache breakpoint is left for tools/system prompt, to be shared across sessions\n    \"\"\"\n\n    breakpoints_remaining = 3\n    for message in reversed(messages):\n        if message[\"role\"] == \"user\" and isinstance(\n            content := message[\"content\"], list\n        ):\n            if breakpoints_remaining:\n                breakpoints_remaining -= 1\n                # Use type ignore to bypass TypedDict check until SDK types are updated\n                content[-1][\"cache_control\"] = BetaCacheControlEphemeralParam(  # type: ignore\n                    {\"type\": \"ephemeral\"}\n                )\n            else:\n                if isinstance(content[-1], dict) and \"cache_control\" in content[-1]:\n                    del content[-1][\"cache_control\"]  # type: ignore\n                # we'll only every have one extra turn per loop\n                break","fileHash":"9557e1c0504c7a1e0a1c2a2cb3d3730799cd83c0"}],"guard":{"rule":"Old screenshots must not blow up the prompt size","checks":"Anthropic: cache_control on 3 newest user turns; others: count tool_result images vs only_n_most_recent_images","onFail":"Older images are silently removed from tool results before the API call"}},{"id":"system-prompt","kind":"config","name":"System prompt","district":"tower","summary":"Fixed instructions telling Claude about the Ubuntu VM, Firefox, DISPLAY=:1 and today's date, plus an optional suffix you type in the sidebar.","details":"- Built once at import, so the date is the date the app started\n- Tips: use curl not wget, ignore the Firefox wizard, redirect big output to a file\n- Sidebar 'Custom System Prompt Suffix' is appended and saved to ~/.anthropic/system_prompt","source":[{"file":"computer-use-demo/computer_use_demo/loop.py","lines":[66,85],"anchor":"SYSTEM_PROMPT = f\"\"\"\u003cSYSTEM_CAPABILITY>","snippet":"# This system prompt is optimized for the Docker environment in this repository and\n# specific tool combinations enabled.\n# We encourage modifying this system prompt to ensure the model has context for the\n# environment it is running in, and to provide any additional information that may be\n# helpful for the task at hand.\nSYSTEM_PROMPT = f\"\"\"\u003cSYSTEM_CAPABILITY>\n* You are utilising an Ubuntu virtual machine using {platform.machine()} architecture with internet access.\n* You can feel free to install Ubuntu applications with your bash tool. Use curl instead of wget.\n* To open firefox, please just click on the firefox icon.  Note, firefox-esr is what is installed on your system.\n* Using bash tool you can start GUI applications, but you need to set export DISPLAY=:1 and use a subshell. For example \"(DISPLAY=:1 xterm &)\". GUI apps run with bash tool will appear within your desktop environment, but they may take some time to appear. Take a screenshot to confirm it did.\n* When using your bash tool with commands that are expected to output very large quantities of text, redirect into a tmp file and use str_replace_based_edit_tool or `grep -n -B \u003clines before> -A \u003clines after> \u003cquery> \u003cfilename>` to confirm output.\n* When viewing a page it can be helpful to zoom out so that you can see everything on the page.  Either that, or make sure you scroll down to see everything before deciding something isn't available.\n* When using your computer function calls, they take a while to run and send back to you.  Where possible/feasible, try to chain multiple of these calls all into one function calls request.\n* The current date is {datetime.today().strftime(\"%A, %B %-d, %Y\")}.\n\u003c/SYSTEM_CAPABILITY>\n\n\u003cIMPORTANT>\n* When using Firefox, if a startup wizard appears, IGNORE IT.  Do not even click \"skip this step\".  Instead, click on the address bar where it says \"Search or enter address\", and enter the appropriate search term or URL there.\n* If the item you are looking at is a pdf, if after taking a single screenshot of the pdf it seems that you want to read the entire document instead of trying to continue to read the pdf from your screenshots + navigation, determine the URL, use curl to download the pdf, install and use pdftotext to convert it to a text file, and then read that text file directly with your str_replace_based_edit_tool.\n\u003c/IMPORTANT>\"\"\"","fileHash":"9557e1c0504c7a1e0a1c2a2cb3d3730799cd83c0"},{"file":"computer-use-demo/computer_use_demo/loop.py","lines":[113,116],"anchor":"text=f\"{SYSTEM_PROMPT}{' ' + system_prompt_suffix if system_prompt_suffix else ''}\",","snippet":"    system = BetaTextBlockParam(\n        type=\"text\",\n        text=f\"{SYSTEM_PROMPT}{' ' + system_prompt_suffix if system_prompt_suffix else ''}\",\n    )","fileHash":"9557e1c0504c7a1e0a1c2a2cb3d3730799cd83c0"}]},{"id":"tool-versions","kind":"config","name":"Tool versions and model configs","district":"tower","summary":"Maps each tool version to its tool classes and beta header, and each model name to a tool version and thinking modes.","details":"- 5 tool groups, e.g. computer_use_20251124 adds zoom\n- computer_toolset_20260801 has beta_flag=None (GA, no beta header)\n- Every group pairs a computer tool with the same edit tool and a bash tool\n- Unknown model IDs fall back to DEFAULT_MODEL_CONF after a longest-prefix match","source":[{"file":"computer-use-demo/computer_use_demo/tools/groups.py","lines":[36,67],"anchor":"TOOL_GROUPS: list[ToolGroup] = [","snippet":"TOOL_GROUPS: list[ToolGroup] = [\n    ToolGroup(\n        version=\"computer_use_20241022\",\n        tools=[ComputerTool20241022, EditTool20250728, BashTool20241022],\n        beta_flag=\"computer-use-2024-10-22\",\n    ),\n    ToolGroup(\n        version=\"computer_use_20250124\",\n        tools=[ComputerTool20250124, EditTool20250728, BashTool20250124],\n        beta_flag=\"computer-use-2025-01-24\",\n    ),\n    ToolGroup(\n        version=\"computer_use_20250429\",\n        tools=[ComputerTool20250124, EditTool20250728, BashTool20250124],\n        beta_flag=\"computer-use-2025-01-24\",\n    ),\n    ToolGroup(\n        version=\"computer_use_20251124\",\n        tools=[ComputerTool20251124, EditTool20250728, BashTool20250124],\n        beta_flag=\"computer-use-2025-11-24\",\n    ),\n    # The computer toolset ships GA: no beta header. The toolset replaces the\n    # single computer tool entry; bash and edit stay ordinary client tools so\n    # the model can fall back to shell or file operations.\n    ToolGroup(\n        version=\"computer_toolset_20260801\",\n        tools=[ComputerToolset20260801, EditTool20250728, BashTool20250124],\n        beta_flag=None,\n    ),\n]\n\nTOOL_GROUPS_BY_VERSION = {tool_group.version: tool_group for tool_group in TOOL_GROUPS}","fileHash":"042ebd0ab472f80771dfa7c65eda7227b44fdc96"},{"file":"computer-use-demo/computer_use_demo/streamlit.py","lines":[111,149],"anchor":"MODEL_TO_MODEL_CONF: dict[str, ModelConfig] = {","snippet":"MODEL_TO_MODEL_CONF: dict[str, ModelConfig] = {\n    \"claude-opus-4-1-20250805\": CLAUDE_4,\n    \"claude-opus-4-1\": CLAUDE_4,\n    \"claude-sonnet-4-20250514\": CLAUDE_4,\n    \"claude-opus-4-20250514\": CLAUDE_4,\n    \"claude-sonnet-4-5-20250929\": CLAUDE_4_5,\n    \"anthropic.claude-sonnet-4-5-20250929-v1:0\": CLAUDE_4_5,\n    \"claude-sonnet-4-5@20250929\": CLAUDE_4_5,\n    \"claude-sonnet-4-5\": CLAUDE_4_5,\n    \"claude-haiku-4-5-20251001\": HAIKU_4_5,\n    \"anthropic.claude-haiku-4-5-20251001-v1:0\": HAIKU_4_5,  # Bedrock\n    \"claude-haiku-4-5@20251001\": HAIKU_4_5,  # Vertex\n    \"claude-haiku-4-5\": HAIKU_4_5,\n    \"claude-opus-4-5-20251101\": CLAUDE_4_WITH_ZOOMABLE_TOOL,\n    \"claude-opus-4-5\": CLAUDE_4_WITH_ZOOMABLE_TOOL,\n    \"claude-opus-4-6\": CLAUDE_4_6,\n    \"claude-sonnet-4-6\": CLAUDE_4_6,\n    \"claude-opus-4-7\": CLAUDE_4_7,\n    \"claude-opus-4-8\": CLAUDE_4_7,\n}\n\n\ndef _lookup_model_conf(model: str) -> ModelConfig:\n    \"\"\"Resolve a model ID to its config.\n\n    Tries an exact match first, then the longest known key that the ID starts\n    with, so undated aliases, newly dated snapshots, and the Bedrock / Vertex\n    forms of a known model family resolve to the right config instead of\n    falling through to the permissive default. Offering a thinking mode the\n    model doesn't support produces an API error, so a correct lookup matters.\n    \"\"\"\n    if model in MODEL_TO_MODEL_CONF:\n        return MODEL_TO_MODEL_CONF[model]\n    # anthropic.claude-sonnet-4-5-20250929-v1:0 -> claude-sonnet-4-5-20250929...\n    normalized = model.removeprefix(\"anthropic.\").replace(\"@\", \"-\")\n    prefix_matches = [k for k in MODEL_TO_MODEL_CONF if normalized.startswith(k)]\n    if prefix_matches:\n        return MODEL_TO_MODEL_CONF[max(prefix_matches, key=len)]\n    return DEFAULT_MODEL_CONF","fileHash":"f7973853289e0ac461dd1238d3140214106b1fa4"}]},{"id":"conversation","kind":"store","name":"Conversation messages","district":"tower","summary":"The list of user and assistant messages kept in Streamlit session state and sent to Claude every turn.","details":"- Lives in st.session_state.messages\n- The loop appends Claude's replies and the tool results in place\n- If you interrupt mid-loop, fake 'human stopped' tool results are added to heal the history\n- Tool outputs for display are kept separately in st.session_state.tools","source":[{"file":"computer-use-demo/computer_use_demo/streamlit.py","lines":[183,185],"anchor":"st.session_state.messages = []","snippet":"def setup_state():\n    if \"messages\" not in st.session_state:\n        st.session_state.messages = []","fileHash":"f7973853289e0ac461dd1238d3140214106b1fa4"},{"file":"computer-use-demo/computer_use_demo/streamlit.py","lines":[468,493],"anchor":"def maybe_add_interruption_blocks():","snippet":"def maybe_add_interruption_blocks():\n    if not st.session_state.in_sampling_loop:\n        return []\n    # If this function is called while we're in the sampling loop, we can assume that the previous sampling loop was interrupted\n    # and we should annotate the conversation with additional context for the model and heal any incomplete tool use calls\n    result = []\n    last_message = st.session_state.messages[-1]\n    previous_tool_uses = [\n        block for block in last_message[\"content\"] if block[\"type\"] == \"tool_use\"\n    ]\n    for tool_use in previous_tool_uses:\n        st.session_state.tools[tool_use[\"id\"]] = ToolResult(error=INTERRUPT_TOOL_ERROR)\n        block = BetaToolResultBlockParam(\n            tool_use_id=tool_use[\"id\"],\n            type=\"tool_result\",\n            content=INTERRUPT_TOOL_ERROR,\n            is_error=True,\n        )\n        # A toolset member call's result must carry the same toolset_name as\n        # the tool_use it answers (see _make_api_tool_result in loop.py).\n        toolset_name = cast(dict[str, Any], tool_use).get(\"toolset_name\")\n        if toolset_name is not None:\n            cast(dict[str, Any], block)[\"toolset_name\"] = toolset_name\n        result.append(block)\n    result.append(BetaTextBlockParam(type=\"text\", text=INTERRUPT_TEXT))\n    return result","fileHash":"f7973853289e0ac461dd1238d3140214106b1fa4"},{"file":"computer-use-demo/computer_use_demo/loop.py","lines":[192,198],"anchor":"\"role\": \"assistant\",","snippet":"        response_params = _response_to_params(response)\n        messages.append(\n            {\n                \"role\": \"assistant\",\n                \"content\": response_params,\n            }\n        )","fileHash":"9557e1c0504c7a1e0a1c2a2cb3d3730799cd83c0"}]},{"id":"claude-api","kind":"external","name":"Claude API (Anthropic, Bedrock, Vertex)","district":"sky","summary":"The model endpoint. The loop picks an Anthropic, AnthropicBedrock or AnthropicVertex client by provider.","details":"- Only the Anthropic client gets the API key and max_retries=4\n- Uses the raw-response form so HTTP logs can be shown\n- Sends betas only if there are any (toolset group has none)\n- On any API error the loop reports it and returns","source":[{"file":"computer-use-demo/computer_use_demo/loop.py","lines":[124,130],"anchor":"client = Anthropic(api_key=api_key, max_retries=4)","snippet":"        if provider == APIProvider.ANTHROPIC:\n            client = Anthropic(api_key=api_key, max_retries=4)\n            enable_prompt_caching = True\n        elif provider == APIProvider.VERTEX:\n            client = AnthropicVertex()\n        elif provider == APIProvider.BEDROCK:\n            client = AnthropicBedrock()","fileHash":"9557e1c0504c7a1e0a1c2a2cb3d3730799cd83c0"},{"file":"computer-use-demo/computer_use_demo/loop.py","lines":[163,184],"anchor":"raw_response = client.beta.messages.with_raw_response.create(","snippet":"        # Call the API\n        # we use raw_response to provide debug information to streamlit. Your\n        # implementation may be able call the SDK directly with:\n        # `response = client.messages.create(...)` instead.\n        try:\n            raw_response = client.beta.messages.with_raw_response.create(\n                max_tokens=max_tokens,\n                messages=messages,\n                model=model,\n                system=[system],\n                tools=tool_collection.to_params(),\n                # The toolset group has no beta flag, so on Vertex/Bedrock the\n                # list can be empty; omit the header rather than send it blank.\n                betas=betas or omit,\n                extra_body=extra_body,\n            )\n        except (APIStatusError, APIResponseValidationError) as e:\n            api_response_callback(e.request, e.response, e)\n            return messages\n        except APIError as e:\n            api_response_callback(e.request, e.body, e)\n            return messages","fileHash":"9557e1c0504c7a1e0a1c2a2cb3d3730799cd83c0"}]},{"id":"tool-errors","kind":"guardrail","name":"Tool router and error catcher","district":"hangar","summary":"Finds the tool Claude named, runs it, and turns any ToolError into an error result that goes back to Claude.","details":"- Unknown tool name gives 'Tool X is invalid'\n- Toolset calls are routed by toolset_name, the member name becomes the action\n- Only ToolError is caught; other exceptions escape\n- _make_api_tool_result sets is_error=True and adds \u003csystem> notes","source":[{"file":"computer-use-demo/computer_use_demo/tools/collection.py","lines":[38,62],"anchor":"return ToolFailure(error=f\"Tool {name} is invalid\")","snippet":"    async def run(\n        self,\n        *,\n        name: str,\n        tool_input: dict[str, Any],\n        toolset_name: str | None = None,\n    ) -> ToolResult:\n        if toolset_name is not None:\n            # A member tool call: (toolset_name, name) identifies the tool.\n            # The member name is the trained action name, so it dispatches as\n            # the action parameter of the family's tool implementation.\n            toolset = self.toolset_map.get(toolset_name)\n            if not toolset:\n                return ToolFailure(error=f\"Toolset {toolset_name} is invalid\")\n            try:\n                return await toolset(action=name, **tool_input)\n            except ToolError as e:\n                return ToolFailure(error=e.message)\n        tool = self.tool_map.get(name)\n        if not tool:\n            return ToolFailure(error=f\"Tool {name} is invalid\")\n        try:\n            return await tool(**tool_input)\n        except ToolError as e:\n            return ToolFailure(error=e.message)","fileHash":"c30329425126effd8e483b587386349845cd7b72"},{"file":"computer-use-demo/computer_use_demo/loop.py","lines":[342,382],"anchor":"def _make_api_tool_result(","snippet":"def _make_api_tool_result(\n    result: ToolResult, tool_use_id: str, *, toolset_name: str | None = None\n) -> BetaToolResultBlockParam:\n    \"\"\"Convert an agent ToolResult to an API ToolResultBlockParam.\n\n    A tool_result answering a toolset member call must carry the same\n    toolset_name as its paired tool_use block, so it is stamped here.\n    \"\"\"\n    tool_result_content: list[BetaTextBlockParam | BetaImageBlockParam] | str = []\n    is_error = False\n    if result.error:\n        is_error = True\n        tool_result_content = _maybe_prepend_system_tool_result(result, result.error)\n    else:\n        if result.output:\n            tool_result_content.append(\n                {\n                    \"type\": \"text\",\n                    \"text\": _maybe_prepend_system_tool_result(result, result.output),\n                }\n            )\n        if result.base64_image:\n            tool_result_content.append(\n                {\n                    \"type\": \"image\",\n                    \"source\": {\n                        \"type\": \"base64\",\n                        \"media_type\": \"image/png\",\n                        \"data\": result.base64_image,\n                    },\n                }\n            )\n    tool_result_block: dict[str, Any] = {\n        \"type\": \"tool_result\",\n        \"content\": tool_result_content,\n        \"tool_use_id\": tool_use_id,\n        \"is_error\": is_error,\n    }\n    if toolset_name is not None:\n        tool_result_block[\"toolset_name\"] = toolset_name\n    return cast(BetaToolResultBlockParam, tool_result_block)","fileHash":"9557e1c0504c7a1e0a1c2a2cb3d3730799cd83c0"},{"file":"computer-use-demo/computer_use_demo/tools/base.py","lines":[61,69],"anchor":"class ToolError(Exception):","snippet":"class ToolFailure(ToolResult):\n    \"\"\"A ToolResult that represents a failure.\"\"\"\n\n\nclass ToolError(Exception):\n    \"\"\"Raised when a tool encounters an error.\"\"\"\n\n    def __init__(self, message):\n        self.message = message","fileHash":"a08bf83d8bfc84580aba444e753bfc41b380c07e"}],"guard":{"rule":"Tool failures must reach Claude as error results, not crash the app","checks":"tool name exists in tool_map / toolset_map; ToolError raised while running","onFail":"A ToolFailure with the message is sent back as a tool_result with is_error=true"}},{"id":"computer-tool","kind":"skill","name":"Computer tool (screen, mouse, keyboard)","district":"hangar","summary":"Moves the mouse, clicks, types and takes screenshots on the virtual X display (Xvfb on :1) using xdotool.","details":"- Most actions wait 2s, then return a fresh screenshot\n- Coordinates are scaled between screenshot size and real screen size (XGA/WXGA/FWXGA targets)\n- Typing is sent in 50-character chunks\n- 20251124 adds zoom; the 20260801 toolset makes each action its own member tool","source":[{"file":"computer-use-demo/computer_use_demo/tools/computer.py","lines":[88,126],"anchor":"class BaseComputerTool:","snippet":"class BaseComputerTool:\n    \"\"\"\n    A tool that allows the agent to interact with the screen, keyboard, and mouse of the current computer.\n    The tool parameters are defined by Anthropic and are not editable.\n    \"\"\"\n\n    name: Literal[\"computer\"] = \"computer\"\n    width: int\n    height: int\n    display_num: int | None\n\n    _screenshot_delay = 2.0\n    _scaling_enabled = True\n\n    @property\n    def options(self) -> ComputerToolOptions:\n        width, height = self.scale_coordinates(\n            ScalingSource.COMPUTER, self.width, self.height\n        )\n        return {\n            \"display_width_px\": width,\n            \"display_height_px\": height,\n            \"display_number\": self.display_num,\n        }\n\n    def __init__(self):\n        super().__init__()\n\n        self.width = int(os.getenv(\"WIDTH\") or 0)\n        self.height = int(os.getenv(\"HEIGHT\") or 0)\n        assert self.width and self.height, \"WIDTH, HEIGHT must be set\"\n        if (display_num := os.getenv(\"DISPLAY_NUM\")) is not None:\n            self.display_num = int(display_num)\n            self._display_prefix = f\"DISPLAY=:{self.display_num} \"\n        else:\n            self.display_num = None\n            self._display_prefix = \"\"\n\n        self.xdotool = f\"{self._display_prefix}xdotool\"","fileHash":"645cd84537fc8b146f15a397133cdf9b79edcdfc"},{"file":"computer-use-demo/computer_use_demo/tools/computer.py","lines":[267,302],"anchor":"def scale_coordinates(self, source: ScalingSource, x: int, y: int):","snippet":"    async def shell(self, command: str, take_screenshot=True) -> ToolResult:\n        \"\"\"Run a shell command and return the output, error, and optionally a screenshot.\"\"\"\n        _, stdout, stderr = await run(command)\n        base64_image = None\n\n        if take_screenshot:\n            # delay to let things settle before taking a screenshot\n            await asyncio.sleep(self._screenshot_delay)\n            base64_image = (await self.screenshot()).base64_image\n\n        return ToolResult(output=stdout, error=stderr, base64_image=base64_image)\n\n    def scale_coordinates(self, source: ScalingSource, x: int, y: int):\n        \"\"\"Scale coordinates to a target maximum resolution.\"\"\"\n        if not self._scaling_enabled:\n            return x, y\n        ratio = self.width / self.height\n        target_dimension = None\n        for dimension in MAX_SCALING_TARGETS.values():\n            # allow some error in the aspect ratio - not ratios are exactly 16:9\n            if abs(dimension[\"width\"] / dimension[\"height\"] - ratio) \u003c 0.02:\n                if dimension[\"width\"] \u003c self.width:\n                    target_dimension = dimension\n                break\n        if target_dimension is None:\n            return x, y\n        # should be less than 1\n        x_scaling_factor = target_dimension[\"width\"] / self.width\n        y_scaling_factor = target_dimension[\"height\"] / self.height\n        if source == ScalingSource.API:\n            if x > self.width or y > self.height:\n                raise ToolError(f\"Coordinates {x}, {y} are out of bounds\")\n            # scale up\n            return round(x / x_scaling_factor), round(y / y_scaling_factor)\n        # scale down\n        return round(x * x_scaling_factor), round(y * y_scaling_factor)","fileHash":"645cd84537fc8b146f15a397133cdf9b79edcdfc"},{"file":"computer-use-demo/computer_use_demo/tools/computer.py","lines":[543,579],"anchor":"class ComputerToolset20260801(ComputerTool20251124):","snippet":"class ComputerToolset20260801(ComputerTool20251124):\n    \"\"\"The computer toolset (`computer_toolset_20260801`).\n\n    Where earlier dated versions declare a single \"computer\" tool and receive\n    every action through its `action` parameter, the toolset is declared as\n    one nameless `tools[]` entry and the model calls each action as its own\n    member tool: `tool_use.name` is the member name (`left_click`,\n    `screenshot`, ...), the block carries `toolset_name: \"computer\"`, and the\n    input is that action's parameter set with no `action` discriminator.\n    Every tool_result answering a member call must carry the same\n    `toolset_name` (see `loop._make_api_tool_result`).\n\n    Member semantics match the corresponding actions of\n    `computer_20251124`, with three differences:\n\n    * `zoom` is an always-declared member (enabled by default) instead of an\n      `enable_zoom` opt-in flag.\n    * `key` accepts an optional `repeat` count (1-100).\n    * Pointer members (clicks, drags) spell a held modifier chord `text`,\n      where `computer_20250124` spelled it `key`.\n\n    A turn may carry several member tool_use blocks; the caller executes them\n    sequentially in block order and stops on the first failure (see\n    `loop.sampling_loop`). Coordinates stay in screenshot pixels, as before.\n    \"\"\"\n\n    api_type: Literal[\"computer_toolset_20260801\"] = \"computer_toolset_20260801\"  # pyright: ignore[reportIncompatibleVariableOverride]\n    toolset_name: Literal[\"computer\"] = \"computer\"\n    member_names: frozenset[str] = COMPUTER_TOOLSET_MEMBERS\n\n    def to_params(self):\n        # The toolset entry is nameless and carries no display_* options (the\n        # API rejects them): coordinates are exchanged in screenshot pixels,\n        # so the display geometry travels in the screenshots themselves. Per-\n        # member overrides could be declared here via \"configs\"; this demo\n        # keeps every member at its default (all enabled).\n        return cast(BetaToolUnionParam, {\"type\": self.api_type})","fileHash":"645cd84537fc8b146f15a397133cdf9b79edcdfc"}]},{"id":"bash-tool","kind":"skill","name":"Bash tool","district":"hangar","summary":"Runs shell commands in one long-lived bash process, so cd and variables stick between calls.","details":"- Session starts lazily on the first command\n- Each command is followed by echo '\u003c\u003cexit>>' so the tool knows it finished\n- Reads stdout/stderr straight from the stream buffers\n- restart: true stops the old shell and starts a new one","source":[{"file":"computer-use-demo/computer_use_demo/tools/bash.py","lines":[104,143],"anchor":"class BashTool20250124(BaseAnthropicTool):","snippet":"class BashTool20250124(BaseAnthropicTool):\n    \"\"\"\n    A tool that allows the agent to run bash commands.\n    The tool parameters are defined by Anthropic and are not editable.\n    \"\"\"\n\n    _session: _BashSession | None\n\n    api_type: Literal[\"bash_20250124\"] = \"bash_20250124\"\n    name: Literal[\"bash\"] = \"bash\"\n\n    def __init__(self):\n        self._session = None\n        super().__init__()\n\n    def to_params(self) -> Any:\n        return {\n            \"type\": self.api_type,\n            \"name\": self.name,\n        }\n\n    async def __call__(\n        self, command: str | None = None, restart: bool = False, **kwargs\n    ):\n        if restart:\n            if self._session:\n                self._session.stop()\n            self._session = _BashSession()\n            await self._session.start()\n\n            return ToolResult(system=\"tool has been restarted.\")\n\n        if self._session is None:\n            self._session = _BashSession()\n            await self._session.start()\n\n        if command is not None:\n            return await self._session.run(command)\n\n        raise ToolError(\"no command provided.\")","fileHash":"a5ec4aff0a670721cb1887107bad603b778d619a"},{"file":"computer-use-demo/computer_use_demo/tools/bash.py","lines":[8,45],"anchor":"class _BashSession:","snippet":"class _BashSession:\n    \"\"\"A session of a bash shell.\"\"\"\n\n    _started: bool\n    _process: asyncio.subprocess.Process\n\n    command: str = \"/bin/bash\"\n    _output_delay: float = 0.2  # seconds\n    _timeout: float = 120.0  # seconds\n    _sentinel: str = \"\u003c\u003cexit>>\"\n\n    def __init__(self):\n        self._started = False\n        self._timed_out = False\n\n    async def start(self):\n        if self._started:\n            return\n\n        self._process = await asyncio.create_subprocess_shell(\n            self.command,\n            preexec_fn=os.setsid,\n            shell=True,\n            bufsize=0,\n            stdin=asyncio.subprocess.PIPE,\n            stdout=asyncio.subprocess.PIPE,\n            stderr=asyncio.subprocess.PIPE,\n        )\n\n        self._started = True\n\n    def stop(self):\n        \"\"\"Terminate the bash shell.\"\"\"\n        if not self._started:\n            raise ToolError(\"Session has not started.\")\n        if self._process.returncode is not None:\n            return\n        self._process.terminate()","fileHash":"a5ec4aff0a670721cb1887107bad603b778d619a"}]},{"id":"bash-timeout","kind":"guardrail","name":"Bash timeout","district":"hangar","summary":"Gives each bash command 120 seconds. After a timeout the session is marked dead until Claude restarts it.","details":"- Polls the output every 0.2s looking for the sentinel\n- On timeout sets _timed_out=True and raises ToolError\n- Later commands fail with the same message until restart\n- If bash itself exited, returns an error with system note 'tool must be restarted'","source":[{"file":"computer-use-demo/computer_use_demo/tools/bash.py","lines":[47,59],"anchor":"if self._timed_out:","snippet":"    async def run(self, command: str):\n        \"\"\"Execute a command in the bash shell.\"\"\"\n        if not self._started:\n            raise ToolError(\"Session has not started.\")\n        if self._process.returncode is not None:\n            return ToolResult(\n                system=\"tool must be restarted\",\n                error=f\"bash has exited with returncode {self._process.returncode}\",\n            )\n        if self._timed_out:\n            raise ToolError(\n                f\"timed out: bash has not returned in {self._timeout} seconds and must be restarted\",\n            )","fileHash":"a5ec4aff0a670721cb1887107bad603b778d619a"},{"file":"computer-use-demo/computer_use_demo/tools/bash.py","lines":[72,88],"anchor":"async with asyncio.timeout(self._timeout):","snippet":"        # read output from the process, until the sentinel is found\n        try:\n            async with asyncio.timeout(self._timeout):\n                while True:\n                    await asyncio.sleep(self._output_delay)\n                    # if we read directly from stdout/stderr, it will wait forever for\n                    # EOF. use the StreamReader buffer directly instead.\n                    output = self._process.stdout._buffer.decode()  # pyright: ignore[reportAttributeAccessIssue]\n                    if self._sentinel in output:\n                        # strip the sentinel and break\n                        output = output[: output.index(self._sentinel)]\n                        break\n        except asyncio.TimeoutError:\n            self._timed_out = True\n            raise ToolError(\n                f\"timed out: bash has not returned in {self._timeout} seconds and must be restarted\",\n            ) from None","fileHash":"a5ec4aff0a670721cb1887107bad603b778d619a"}],"guard":{"rule":"A bash command may not run longer than 120 seconds","checks":"sentinel '\u003c\u003cexit>>' seen in stdout within _timeout; session not already timed out or exited","onFail":"ToolError 'timed out: bash has not returned in 120.0 seconds and must be restarted'"}},{"id":"edit-tool","kind":"skill","name":"File editor tool","district":"hangar","summary":"Lets Claude view, create, str_replace and insert in files (text_editor_20250728, named str_replace_based_edit_tool).","details":"- view shows files with line numbers, or a directory 2 levels deep\n- create refuses to overwrite an existing file\n- str_replace and insert return a small snippet around the change\n- This version has no undo_edit command","source":[{"file":"computer-use-demo/computer_use_demo/tools/edit.py","lines":[18,85],"anchor":"class EditTool20250728(BaseAnthropicTool):","snippet":"class EditTool20250728(BaseAnthropicTool):\n    \"\"\"\n    A filesystem editor tool that allows the agent to view, create, and edit files.\n    The tool parameters are defined by Anthropic and are not editable.\n\n    This implements the text_editor_20250728 tool version, which:\n    - Uses `insert_text` (not `new_str`) for the insert command\n    - Uses `str_replace_based_edit_tool` as the tool name\n    - Does not support `undo_edit`\n    \"\"\"\n\n    api_type: Literal[\"text_editor_20250728\"] = \"text_editor_20250728\"\n    name: Literal[\"str_replace_based_edit_tool\"] = \"str_replace_based_edit_tool\"\n\n    _file_history: dict[Path, list[str]]\n\n    def __init__(self):\n        self._file_history = defaultdict(list)\n        super().__init__()\n\n    def to_params(self) -> Any:\n        return {\n            \"name\": self.name,\n            \"type\": self.api_type,\n        }\n\n    async def __call__(\n        self,\n        *,\n        command: Command,\n        path: str,\n        file_text: str | None = None,\n        view_range: list[int] | None = None,\n        old_str: str | None = None,\n        new_str: str | None = None,\n        insert_line: int | None = None,\n        insert_text: str | None = None,\n        **kwargs,\n    ):\n        _path = Path(path)\n        self.validate_path(command, _path)\n        if command == \"view\":\n            return await self.view(_path, view_range)\n        elif command == \"create\":\n            if file_text is None:\n                raise ToolError(\"Parameter `file_text` is required for command: create\")\n            self.write_file(_path, file_text)\n            self._file_history[_path].append(file_text)\n            return ToolResult(output=f\"File created successfully at: {_path}\")\n        elif command == \"str_replace\":\n            if old_str is None:\n                raise ToolError(\n                    \"Parameter `old_str` is required for command: str_replace\"\n                )\n            return self.str_replace(_path, old_str, new_str)\n        elif command == \"insert\":\n            if insert_line is None:\n                raise ToolError(\n                    \"Parameter `insert_line` is required for command: insert\"\n                )","snippetCut":true,"fileHash":"33e6f3dba6fa6177de1e19ecc7b809ce173a0690"},{"file":"computer-use-demo/computer_use_demo/tools/edit.py","lines":[160,206],"anchor":"new_file_content = file_content.replace(old_str, new_str)","snippet":"    def str_replace(self, path: Path, old_str: str, new_str: str | None):\n        \"\"\"Implement the str_replace command, which replaces old_str with new_str in the file content\"\"\"\n        # Read the file content\n        file_content = self.read_file(path).expandtabs()\n        old_str = old_str.expandtabs()\n        new_str = new_str.expandtabs() if new_str is not None else \"\"\n\n        # Check if old_str is unique in the file\n        occurrences = file_content.count(old_str)\n        if occurrences == 0:\n            raise ToolError(\n                f\"No replacement was performed, old_str `{old_str}` did not appear verbatim in {path}.\"\n            )\n        elif occurrences > 1:\n            file_content_lines = file_content.split(\"\\n\")\n            lines = [\n                idx + 1\n                for idx, line in enumerate(file_content_lines)\n                if old_str in line\n            ]\n            raise ToolError(\n                f\"No replacement was performed. Multiple occurrences of old_str `{old_str}` in lines {lines}. Please ensure it is unique\"\n            )\n\n        # Replace old_str with new_str\n        new_file_content = file_content.replace(old_str, new_str)\n\n        # Write the new content to the file\n        self.write_file(path, new_file_content)\n\n        # Save the content to history\n        self._file_history[path].append(file_content)\n\n        # Create a snippet of the edited section\n        replacement_line = file_content.split(old_str)[0].count(\"\\n\")\n        start_line = max(0, replacement_line - SNIPPET_LINES)\n        end_line = replacement_line + SNIPPET_LINES + new_str.count(\"\\n\")\n        snippet = \"\\n\".join(new_file_content.split(\"\\n\")[start_line : end_line + 1])\n\n        # Prepare the success message\n        success_msg = f\"The file {path} has been edited. \"\n        success_msg += self._make_output(\n            snippet, f\"a snippet of {path}\", start_line + 1\n        )\n        success_msg += \"Review the changes and make sure they are as expected. Edit the file again if necessary.\"\n\n        return CLIResult(output=success_msg)","fileHash":"33e6f3dba6fa6177de1e19ecc7b809ce173a0690"}]},{"id":"edit-checks","kind":"guardrail","name":"Edit checks","district":"hangar","summary":"Stops bad edits: the path must be absolute and exist, and old_str must appear exactly once.","details":"- Relative path is rejected\n- create on an existing file is rejected; other commands on a missing file are rejected\n- Directories only allow view\n- str_replace counts old_str: 0 = not found, more than 1 = lists the line numbers","source":[{"file":"computer-use-demo/computer_use_demo/tools/edit.py","lines":[87,111],"anchor":"def validate_path(self, command: str, path: Path):","snippet":"    def validate_path(self, command: str, path: Path):\n        \"\"\"\n        Check that the path/command combination is valid.\n        \"\"\"\n        # Check if its an absolute path\n        if not path.is_absolute():\n            suggested_path = Path(\"\") / path\n            raise ToolError(\n                f\"The path {path} is not an absolute path, it should start with `/`. Maybe you meant {suggested_path}?\"\n            )\n        # Check if path exists\n        if not path.exists() and command != \"create\":\n            raise ToolError(\n                f\"The path {path} does not exist. Please provide a valid path.\"\n            )\n        if path.exists() and command == \"create\":\n            raise ToolError(\n                f\"File already exists at: {path}. Cannot overwrite files using command `create`.\"\n            )\n        # Check if the path points to a directory\n        if path.is_dir():\n            if command != \"view\":\n                raise ToolError(\n                    f\"The path {path} is a directory and only the `view` command can be used on directories\"\n                )","fileHash":"33e6f3dba6fa6177de1e19ecc7b809ce173a0690"},{"file":"computer-use-demo/computer_use_demo/tools/edit.py","lines":[167,182],"anchor":"occurrences = file_content.count(old_str)","snippet":"        # Check if old_str is unique in the file\n        occurrences = file_content.count(old_str)\n        if occurrences == 0:\n            raise ToolError(\n                f\"No replacement was performed, old_str `{old_str}` did not appear verbatim in {path}.\"\n            )\n        elif occurrences > 1:\n            file_content_lines = file_content.split(\"\\n\")\n            lines = [\n                idx + 1\n                for idx, line in enumerate(file_content_lines)\n                if old_str in line\n            ]\n            raise ToolError(\n                f\"No replacement was performed. Multiple occurrences of old_str `{old_str}` in lines {lines}. Please ensure it is unique\"\n            )","fileHash":"33e6f3dba6fa6177de1e19ecc7b809ce173a0690"}],"guard":{"rule":"Edits must target a real absolute path and an unambiguous old_str","checks":"path.is_absolute(), path.exists(), not a directory, file_content.count(old_str) == 1","onFail":"ToolError explaining the problem; the file is not touched"}},{"id":"file-history","kind":"store","name":"File edit history","district":"hangar","summary":"An in-memory map from file path to the list of earlier file contents, saved on every create, str_replace and insert.","details":"- A defaultdict(list) on the edit tool instance\n- Stores the whole old file text each time\n- Nothing reads it: this tool version has no undo_edit\n- Lost when the loop ends, since tools are rebuilt per sampling_loop call","source":[{"file":"computer-use-demo/computer_use_demo/tools/edit.py","lines":[32,36],"anchor":"self._file_history = defaultdict(list)","snippet":"    _file_history: dict[Path, list[str]]\n\n    def __init__(self):\n        self._file_history = defaultdict(list)\n        super().__init__()","fileHash":"33e6f3dba6fa6177de1e19ecc7b809ce173a0690"},{"file":"computer-use-demo/computer_use_demo/tools/edit.py","lines":[188,191],"anchor":"self._file_history[path].append(file_content)","snippet":"        self.write_file(path, new_file_content)\n\n        # Save the content to history\n        self._file_history[path].append(file_content)","fileHash":"33e6f3dba6fa6177de1e19ecc7b809ce173a0690"}]}],"flows":[{"id":"sampling-turn","name":"One run of the sampling loop","trigger":"You type a message in the chat and press Enter","summary":"Your message goes to Claude; every tool Claude asks for is run and the results go back, until Claude replies with no tool calls.","start":"s1","steps":[{"id":"s1","at":"auth-check","action":"Checks the provider has credentials (only until it passes once)","carries":"{ provider: 'anthropic', api_key: 'sk-ant-...' }","source":{"file":"computer-use-demo/computer_use_demo/streamlit.py","lines":[382,389],"anchor":"if auth_error := validate_auth(","snippet":"    if not st.session_state.auth_validated:\n        if auth_error := validate_auth(\n            st.session_state.provider, st.session_state.api_key\n        ):\n            st.warning(f\"Please resolve the following auth issue:\\n\\n{auth_error}\")\n            return\n        else:\n            st.session_state.auth_validated = True","fileHash":"f7973853289e0ac461dd1238d3140214106b1fa4"},"next":[{"to":"s2","when":"credentials found"},{"to":"outcome:auth-blocked","when":"credentials missing"}],"screen":{"name":"streamlit.py — main()","kind":"browser","blocks":[{"t":"title","text":"Claude Computer Use Demo"},{"t":"banner","tex
