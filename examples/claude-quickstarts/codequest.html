<script>
/* CodeQuest — small helpers shared by every game module: seeded random, geometry, DOM building,
   safe markdown, local storage. Classic script: exposes window.CW. Loads first.
   Must not know anything about the game: no CW.game, no world data, no UI state. */
window.CW = window.CW || {};
(function (CW) {
  'use strict';

  // Seeded RNG so every map of the same repo looks the same each time.
  CW.hash = function (str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  };
  CW.rng = function (seed) {
    let s = typeof seed === 'string' ? CW.hash(seed) : seed >>> 0;
    return function () {
      s += 0x6d2b79f5;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  CW.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  CW.lerp = (a, b, t) => a + (b - a) * t;
  CW.dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  CW.ease = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);

  // Point on a quadratic curve between a and b, bowed sideways by `bend`.
  CW.curveCtrl = function (a, b, bend) {
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy) || 1;
    return { x: mx - (dy / len) * bend, y: my + (dx / len) * bend };
  };
  // Point at t (0..1) on the quadratic curve from a to b with control point c.
  CW.qpoint = function (a, c, b, t) {
    const u = 1 - t;
    return { x: u * u * a.x + 2 * u * t * c.x + t * t * b.x, y: u * u * a.y + 2 * u * t * c.y + t * t * b.y };
  };

  CW.pointInPoly = function (p, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const a = poly[i], b = poly[j];
      if (a.y > p.y !== b.y > p.y && p.x < ((b.x - a.x) * (p.y - a.y)) / (b.y - a.y) + a.x) inside = !inside;
    }
    return inside;
  };

  // DOM
  CW.$ = (sel, root) => (root || document).querySelector(sel);
  CW.$$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  // Build a DOM node. attrs: `class`, `text`, `html`, `on<event>` handlers, anything else is an attribute.
  CW.el = function (tag, attrs, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k === 'html') n.innerHTML = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : document.createTextNode(String(k)));
    return n;
  };
  CW.esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // Tiny, safe markdown: bullets, `code`, **bold**, paragraphs.
  CW.md = function (src) {
    const lines = String(src || '').split('\n');
    let html = '', inList = false, inCode = false, code = [];
    const inline = (t) => CW.esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    for (const raw of lines) {
      if (raw.trim().startsWith('```')) {
        if (inCode) { html += `<pre class="md-code">${CW.esc(code.join('\n'))}</pre>`; code = []; }
        inCode = !inCode;
        continue;
      }
      if (inCode) { code.push(raw); continue; }
      const m = raw.match(/^\s*[-*]\s+(.*)/);
      if (m) {
        if (!inList) { html += '<ul>'; inList = true; }
        html += `<li>${inline(m[1])}</li>`;
      } else {
        if (inList) { html += '</ul>'; inList = false; }
        if (raw.trim()) html += `<p>${inline(raw)}</p>`;
      }
    }
    if (inList) html += '</ul>';
    if (inCode) html += `<pre class="md-code">${CW.esc(code.join('\n'))}</pre>`;
    return html;
  };

  CW.store = {
    get(key, fallback) {
      try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
    },
    set(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch { /* storage unavailable: keep in memory */ }
    },
  };

  CW.shortSha = (s) => (s ? String(s).slice(0, 7) : '—');
  CW.uid = () => Math.random().toString(36).slice(2, 9);
  CW.timeAgo = function (iso) {
    const d = (Date.now() - new Date(iso).getTime()) / 1000;
    if (!isFinite(d)) return '';
    if (d < 60) return 'just now';
    if (d < 3600) return Math.round(d / 60) + ' min ago';
    if (d < 86400) return Math.round(d / 3600) + ' h ago';
    return Math.round(d / 86400) + ' days ago';
  };
})(window.CW);

;
/* CodeQuest — turns world.json into positions: an overworld of islands, and one island per world.
   Pure functions of the world data and a seeded RNG, so the same repo always gets the same map.
   Must not draw, read game state or touch the DOM. */
(function (CW) {
  'use strict';

  // A wobbly ellipse of n points: the coastline of an island.
  function blob(seed, rx, ry, n) {
    const r = CW.rng(seed);
    const a = r() * 6.28, b = r() * 6.28, c = r() * 6.28;
    const pts = [];
    for (let i = 0; i < n; i++) {
      const t = (i / n) * Math.PI * 2;
      const k = 1 + 0.07 * Math.sin(3 * t + a) + 0.045 * Math.sin(5 * t + b) + 0.025 * Math.sin(11 * t + c);
      pts.push({ x: Math.cos(t) * rx * k, y: Math.sin(t) * ry * k });
    }
    return pts;
  }
  CW.blob = blob;

  // One island: districts become columns, buildings are placed down each column with a little jitter.
  CW.layoutWorld = function (w) {
    const r = CW.rng('layout:' + w.id);
    const districts = (w.districts || []).slice();
    const byD = new Map(districts.map((d) => [d.id, []]));
    const loose = [];
    for (const en of w.entities || []) (byD.get(en.district) || loose).push(en);
    if (loose.length) { districts.push({ id: '__else', name: 'Elsewhere' }); byD.set('__else', loose); }
    const cols = districts.filter((d) => byD.get(d.id).length);
    const colW = 310, rowH = 175;
    const maxRows = Math.max(1, ...cols.map((d) => byD.get(d.id).length));
    const cw = cols.length * colW, ch = maxRows * rowH + rowH * 0.4;
    const pos = {};
    const labels = [];
    cols.forEach((d, ci) => {
      const list = byD.get(d.id);
      const x0 = -cw / 2 + colW * (ci + 0.5);
      const colH = list.length * rowH;
      const y0 = -colH / 2 + rowH / 2 + (ci % 2 ? rowH * 0.22 : -rowH * 0.12);
      list.forEach((en, ri) => {
        pos[en.id] = { x: x0 + (r() - 0.5) * 70, y: y0 + ri * rowH + (r() - 0.5) * 34 };
      });
      labels.push({ id: d.id, name: d.name, x: x0, y: -ch / 2 - 58 });
    });
    const rx = cw / 2 + 190, ry = ch / 2 + 175;
    const poly = blob('island:' + w.id, rx, ry, 120);

    // Roads: one per pair of entities joined by any flow edge.
    const roads = new Map();
    for (const f of w.flows || []) {
      const at = Object.fromEntries((f.steps || []).map((s) => [s.id, s.at]));
      for (const s of f.steps || []) {
        for (const n of s.next || []) {
          if (n.to.startsWith('outcome:')) continue;
          const a = s.at, b = at[n.to];
          if (!a || !b || a === b || !pos[a] || !pos[b]) continue;
          const key = a < b ? a + '|' + b : b + '|' + a;
          if (!roads.has(key)) {
            const rr = CW.rng('road:' + w.id + key);
            const pa = pos[a < b ? a : b], pb = pos[a < b ? b : a];
            roads.set(key, { key, a: a < b ? a : b, b: a < b ? b : a, flows: new Set(), ctrl: CW.curveCtrl(pa, pb, (rr() - 0.5) * 120) });
          }
          roads.get(key).flows.add(f.id);
        }
      }
    }
    // Trees / rocks for texture, kept away from buildings and roads' ends.
    const deco = [];
    for (let i = 0; i < 70; i++) {
      const p = { x: (r() - 0.5) * rx * 2, y: (r() - 0.5) * ry * 2 };
      if (!CW.pointInPoly(p, poly)) continue;
      if (Object.values(pos).some((q) => CW.dist(p, q) < 95)) continue;
      if (labels.some((l) => Math.abs(l.x - p.x) < 90 && Math.abs(l.y - p.y) < 40)) continue;
      deco.push({ x: p.x, y: p.y, s: 0.7 + r() * 0.6, k: r() });
    }
    return {
      id: w.id, pos, labels, poly, rx, ry, roads: [...roads.values()], deco,
      dock: { x: -rx + 60, y: 0 },
      bounds: { x: -rx - 260, y: -ry - 260, w: rx * 2 + 520, h: ry * 2 + 520 },
    };
  };

  // The journey: worlds in their real order along one snaking route (rows of up to 4).
  CW.layoutOverworld = function (world) {
    const ws = world.worlds;
    const n = ws.length;
    const cols = n <= 5 ? n : Math.min(4, Math.ceil(n / 2));
    const dx = 560, dy = 520;
    const rows = Math.ceil(n / cols);
    const isl = {};
    ws.forEach((w, i) => {
      const row = Math.floor(i / cols), k = i % cols;
      const col = row % 2 ? cols - 1 - k : k;                 // snake: every other row runs back
      const rr = CW.rng('ow:' + w.id);
      const size = 112 + Math.min(16, (w.entities || []).length) * 2.6;
      const c = {
        x: (col - (cols - 1) / 2) * dx + (rr() - 0.5) * 50,
        y: (row - (rows - 1) / 2) * dy + (k % 2 ? 70 : -70) * (rows > 1 ? 0.55 : 1) + (rr() - 0.5) * 30,
      };
      isl[w.id] = { c, r: size, poly: blob('island:' + w.id, size * 1.25, size, 64).map((p) => ({ x: p.x + c.x, y: p.y + c.y })) };
    });
    const route = [];
    for (let i = 0; i + 1 < n; i++) {
      const a = isl[ws[i].id].c, b = isl[ws[i + 1].id].c;
      const br = (world.bridges || []).find((x) =>
        (x.from === ws[i].id && x.to === ws[i + 1].id) || (x.to === ws[i].id && x.from === ws[i + 1].id));
      route.push({ from: ws[i].id, to: ws[i + 1].id, ctrl: CW.curveCtrl(a, b, i % 2 ? 60 : -60), label: br?.label || '' });
    }
    const first = isl[ws[0].id];
    const w2 = ((cols - 1) / 2) * dx + 360, h2 = ((rows - 1) / 2) * dy + 340;
    return {
      isl, route, lanes: [],
      start: { x: first.c.x - first.r * 1.25 - 120, y: first.c.y + 30 },
      bounds: { x: -w2, y: -h2, w: w2 * 2, h: h2 * 2 } };
  };
})(window.CW);

;
/* CodeQuest — canvas drawing. Everything is drawn from code; no image assets.
   Each CW.draw* function draws one thing at the place it is given.
   Must not read or change game state: the engine decides what to draw and where. */
(function (CW) {
  'use strict';

  CW.THEMES = {
    meadow: { land: '#86b56a', edge: '#5f8f4b', sand: '#e9d79e', road: '#efe2b4', tree: '#4f7d3c' },
    desert: { land: '#dcb067', edge: '#b88b46', sand: '#f1dca6', road: '#fff0c8', tree: '#8a9a4a' },
    tundra: { land: '#dce9ee', edge: '#a6c1cd', sand: '#f2f8fa', road: '#9fb9c6', tree: '#6f8f86' },
    volcano: { land: '#74504a', edge: '#4c332e', sand: '#b07a62', road: '#f08a4b', tree: '#3a2522' },
    ocean: { land: '#62b8aa', edge: '#3f8d82', sand: '#f0e2b2', road: '#fbf1cf', tree: '#2f7a62' },
    forest: { land: '#4f8250', edge: '#365c35', sand: '#d3c38c', road: '#e6d6a0', tree: '#2c5530' },
    city: { land: '#8d99aa', edge: '#677382', sand: '#cdd3db', road: '#e9edf2', tree: '#5e7d6a' },
    crystal: { land: '#9585c9', edge: '#6c5ca3', sand: '#ddd4f3', road: '#fbf8ff', tree: '#5c4b94' },
  };
  CW.theme = (name) => CW.THEMES[name] || CW.THEMES.meadow;

  CW.KIND = {
    entry: { label: 'Entry', color: '#ffd166', glyph: '◎' },
    ui: { label: 'Screen', color: '#7cc8ff', glyph: '▭' },
    module: { label: 'Logic', color: '#f3ead7', glyph: '⚙' },
    agent: { label: 'Agent', color: '#ff9d6c', glyph: '☺' },
    skill: { label: 'Skill / tool', color: '#c3a8ff', glyph: '✦' },
    guardrail: { label: 'Guardrail', color: '#ff6f6f', glyph: '⛨' },
    store: { label: 'Store', color: '#66e0aa', glyph: '◫' },
    external: { label: 'External', color: '#8ff0ff', glyph: '◇' },
    config: { label: 'Config / prompt', color: '#f3c77a', glyph: '≡' },
  };

  CW.C = {
    sea: '#123a4f', sea2: '#18475f', ink: '#eaf4f4', dark: '#0d2230',
    lantern: '#ffc857', pass: '#5fe0a3', block: '#ff6b6b', error: '#ffa24c', drift: '#f5b84a', fog: '#d7e2e8',
  };

  function poly(ctx, pts) {
    ctx.beginPath();
    pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
    ctx.closePath();
  }
  // The same outline scaled by k around centre c.
  function scaled(pts, k, c) {
    c = c || { x: 0, y: 0 };
    return pts.map((p) => ({ x: c.x + (p.x - c.x) * k, y: c.y + (p.y - c.y) * k }));
  }

  CW.drawSea = function (ctx, view, t) {
    ctx.fillStyle = CW.C.sea;
    ctx.fillRect(view.x, view.y, view.w, view.h);
    // drifting swell lines, like a chart's sea pattern
    ctx.strokeStyle = 'rgba(255,255,255,0.045)';
    ctx.lineWidth = 2;
    const step = 46;
    const y0 = Math.floor(view.y / step) * step;
    for (let y = y0; y < view.y + view.h + step; y += step) {
      ctx.beginPath();
      for (let x = view.x - 40; x < view.x + view.w + 40; x += 24) {
        const yy = y + Math.sin(x * 0.012 + y * 0.07 + t * 0.6) * 5;
        x === view.x - 40 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy);
      }
      ctx.stroke();
    }
  };

  CW.drawIsland = function (ctx, pts, th, t, center) {
    center = center || { x: 0, y: 0 };
    // surf ring
    ctx.save();
    poly(ctx, scaled(pts, 1.06 + Math.sin(t * 1.2) * 0.004, center));
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.fill();
    poly(ctx, scaled(pts, 1.025, center));
    ctx.fillStyle = th.sand;
    ctx.fill();
    poly(ctx, pts);
    ctx.fillStyle = th.land;
    ctx.fill();
    // contour lines
    ctx.strokeStyle = th.edge;
    ctx.globalAlpha = 0.35;
    ctx.lineWidth = 2;
    for (const k of [0.86, 0.7]) { poly(ctx, scaled(pts, k, center)); ctx.stroke(); }
    ctx.restore();
  };

  CW.drawDeco = function (ctx, d, th) {
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.scale(d.s, d.s);
    ctx.fillStyle = 'rgba(0,0,0,0.13)';
    ctx.beginPath(); ctx.ellipse(4, 10, 16, 6, 0, 0, 7); ctx.fill();
    ctx.fillStyle = th.tree;
    if (d.k < 0.7) {
      ctx.beginPath(); ctx.arc(0, -6, 14, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.beginPath(); ctx.arc(-4, -10, 6, 0, 7); ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(0,0,0,0.22)';
      ctx.beginPath(); ctx.moveTo(-12, 6); ctx.lineTo(-4, -8); ctx.lineTo(8, -4); ctx.lineTo(13, 6); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  };

  CW.drawRoad = function (ctx, a, c, b, th, opts) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.quadraticCurveTo(c.x, c.y, b.x, b.y);
    ctx.strokeStyle = 'rgba(0,0,0,0.16)';
    ctx.lineWidth = opts.hi ? 20 : 15;
    ctx.stroke();
    ctx.strokeStyle = opts.hi ? '#fff6d6' : th.road;
    ctx.globalAlpha = opts.dim ? 0.35 : 1;
    ctx.lineWidth = opts.hi ? 13 : 9;
    ctx.stroke();
    if (opts.hi) {
      ctx.setLineDash([2, 16]);
      ctx.lineDashOffset = -opts.t * 30;
      ctx.strokeStyle = CW.C.lantern;
      ctx.lineWidth = 4;
      ctx.stroke();
    }
    ctx.restore();
  };

  // ---- buildings by kind ----
  const DRAW = {
    entry(ctx, t) {
      ctx.lineWidth = 9; ctx.strokeStyle = '#3b2f2a';
      ctx.beginPath(); ctx.arc(0, -18, 26, Math.PI, 0); ctx.lineTo(26, 12); ctx.moveTo(-26, 12); ctx.lineTo(-26, -18); ctx.stroke();
      ctx.lineWidth = 5; ctx.strokeStyle = CW.KIND.entry.color; ctx.stroke();
      ctx.fillStyle = `rgba(255,209,102,${0.35 + Math.sin(t * 3) * 0.15})`;
      ctx.beginPath(); ctx.ellipse(0, -6, 17, 20, 0, 0, 7); ctx.fill();
    },
    ui(ctx) {
      ctx.fillStyle = '#e9f2f8'; ctx.fillRect(-30, -26, 60, 40);
      ctx.fillStyle = CW.KIND.ui.color; ctx.fillRect(-34, -34, 68, 12);
      ctx.fillStyle = '#ffffff'; for (let i = 0; i < 4; i++) ctx.fillRect(-34 + i * 17, -22, 9, 5);
      ctx.fillStyle = '#2a4d63'; ctx.fillRect(-22, -14, 22, 14); ctx.fillRect(6, -14, 14, 28);
    },
    module(ctx, t) {
      ctx.fillStyle = '#efe4cf'; ctx.fillRect(-28, -22, 56, 36);
      ctx.fillStyle = '#9b5d43'; ctx.beginPath(); ctx.moveTo(-34, -20);
      ctx.lineTo(0, -44); ctx.lineTo(34, -20); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#5b4a3a'; ctx.fillRect(-7, -4, 14, 18);
      ctx.save(); ctx.translate(20, -36); ctx.rotate(t * 0.8); ctx.fillStyle = '#d9d2c3';
      for (let i = 0; i < 6; i++) { ctx.rotate(Math.PI / 3); ctx.fillRect(-2.5, -11, 5, 6); }
      ctx.beginPath(); ctx.arc(0, 0, 7, 0, 7); ctx.fill(); ctx.restore();
    },
    agent(ctx, t) {
      const bob = Math.sin(t * 2.4) * 2.5;
      ctx.translate(0, bob);
      ctx.fillStyle = CW.KIND.agent.color;
      ctx.beginPath(); ctx.moveTo(-18, 14); ctx.quadraticCurveTo(0, -28, 18, 14); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffe2c6'; ctx.beginPath(); ctx.arc(0, -20, 12, 0, 7); ctx.fill();
      ctx.fillStyle = '#2b2b33'; ctx.fillRect(-6, -22, 3, 3); ctx.fillRect(3, -22, 3, 3);
      // thinking dots
      ctx.fillStyle = '#fff';
      for (let i = 0; i < 3; i++) {
        const a = (Math.sin(t * 3 - i) + 1) / 2;
        ctx.globalAlpha = 0.3 + a * 0.7;
        ctx.beginPath(); ctx.arc(16 + i * 7, -40, 2.6, 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
    },
    skill(ctx, t) {
      ctx.fillStyle = '#d8d0ea'; ctx.fillRect(-20, 4, 40, 10);
      ctx.fillStyle = '#ece6f8'; ctx.beginPath(); ctx.moveTo(-11, 6); ctx.lineTo(-6, -34);
      ctx.lineTo(6, -34); ctx.lineTo(11, 6); ctx.closePath(); ctx.fill();
      ctx.fillStyle = `rgba(195,168,255,${0.55 + Math.sin(t * 2.2) * 0.3})`;
      ctx.beginPath(); ctx.moveTo(0, -54); ctx.lineTo(8, -42); ctx.lineTo(0, -32); ctx.lineTo(-8, -42); ctx.closePath(); ctx.fill();
    },
    guardrail(ctx, t) {
      ctx.fillStyle = '#cfc8bd'; ctx.fillRect(-16, -40, 32, 54);
      ctx.fillStyle = '#b8b0a3'; for (let i = 0; i < 3; i++) ctx.fillRect(-16 + i * 12, -48, 8, 9);
      ctx.fillStyle = '#4a3f39'; ctx.beginPath(); ctx.arc(0, 2, 8, Math.PI, 0); ctx.fillRect(-8, 2, 16, 12); ctx.fill();
      ctx.strokeStyle = '#6b5e55'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(14, -48); ctx.lineTo(14, -70); ctx.stroke();
      ctx.fillStyle = CW.C.block; ctx.beginPath(); ctx.moveTo(14, -70);
      ctx.lineTo(32 + Math.sin(t * 4) * 3, -64); ctx.lineTo(14, -58); ctx.fill();
    },
    store(ctx) {
      ctx.fillStyle = '#3f8f72'; ctx.fillRect(-24, -26, 48, 36);
      ctx.fillStyle = CW.KIND.store.color; ctx.beginPath(); ctx.ellipse(0, -26, 24, 9, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0, 10, 24, 9, 0, 0, Math.PI); ctx.fillStyle = '#3f8f72'; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2;
      for (const y of [-12, 0]) { ctx.beginPath(); ctx.ellipse(0, y, 24, 9, 0, 0, Math.PI); ctx.stroke(); }
    },
    external(ctx, t) {
      const f = Math.sin(t * 1.8) * 5;
      ctx.fillStyle = 'rgba(0,0,0,0.16)'; ctx.beginPath(); ctx.ellipse(0, 12, 18, 6, 0, 0, 7); ctx.fill();
      ctx.translate(0, -26 + f); ctx.rotate(Math.sin(t) * 0.1);
      ctx.fillStyle = '#2b6f86'; ctx.beginPath(); ctx.moveTo(0, -26); ctx.lineTo(22, 0);
      ctx.lineTo(0, 26); ctx.lineTo(-22, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = CW.KIND.external.color; ctx.beginPath(); ctx.moveTo(0, -17);
      ctx.lineTo(13, 0); ctx.lineTo(0, 17); ctx.lineTo(-13, 0); ctx.closePath(); ctx.fill();
    },
    config(ctx) {
      const cols = ['#c9784f', '#5f8fb3', '#e2b65c', '#7aa66a'];
      ctx.fillStyle = '#6d5440'; ctx.fillRect(-30, -40, 60, 54);
      for (let s = 0; s < 3; s++) {
        for (let i = 0; i < 6; i++) { ctx.fillStyle = cols[(i + s) % 4]; ctx.fillRect(-26 + i * 9, -36 + s * 17, 7, 14); }
      }
    },
  };

  CW.drawEntity = function (ctx, en, p, t, st) {
    ctx.save();
    ctx.translate(p.x, p.y);
    if (st.dimmed) ctx.globalAlpha = 0.42;
    // highlight disc
    if (st.active) {
      ctx.fillStyle = `rgba(255,200,87,${0.28 + Math.sin(t * 5) * 0.12})`;
      ctx.beginPath(); ctx.ellipse(0, 8, 56, 24, 0, 0, 7); ctx.fill();
    } else if (st.near || st.selected) {
      ctx.strokeStyle = st.selected ? '#ffffff' : 'rgba(255,255,255,0.7)';
      ctx.setLineDash([6, 6]); ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.ellipse(0, 8, 54, 22, 0, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(3, 13, 34, 10, 0, 0, 7); ctx.fill();
    if (st.status === 'lost') {
      ctx.fillStyle = '#7f7f7f'; ctx.fillRect(-24, -6, 14, 18); ctx.fillRect(2, -14, 10, 26); ctx.fillRect(-6, 4, 24, 8);
    } else {
      ctx.save(); (DRAW[en.kind] || DRAW.module)(ctx, t + (p.x % 7)); ctx.restore();
    }
    // crack shimmer
    if (st.crack) {
      ctx.strokeStyle = `rgba(255,255,255,${0.5 + Math.sin(t * 6) * 0.4})`; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(-30, -44); ctx.lineTo(-22, -34); ctx.lineTo(-28, -26); ctx.lineTo(-18, -16); ctx.stroke();
      ctx.fillStyle = CW.C.lantern; ctx.font = '700 15px ui-rounded, system-ui'; ctx.fillText('?', -42, -42);
    }
    // status pip
    if (st.status === 'drifted') { ctx.fillStyle = CW.C.drift; ctx.beginPath(); ctx.arc(30, -40, 6, 0, 7); ctx.fill(); }
    if (st.visited) {
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(-34, 12); ctx.lineTo(-34, -6); ctx.stroke();
      ctx.fillStyle = CW.C.pass; ctx.beginPath(); ctx.moveTo(-34, -8); ctx.lineTo(-22, -4); ctx.lineTo(-34, 0); ctx.fill();
      ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-34, -8); ctx.lineTo(-34, 14); ctx.stroke();
    }
    if (st.badge) {
      ctx.fillStyle = CW.C.lantern; ctx.beginPath(); ctx.arc(34, -10, 11, 0, 7); ctx.fill();
      ctx.fillStyle = '#2a1d00'; ctx.font = '700 12px ui-rounded, system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(st.badge, 34, -10);
    }
    // label
    ctx.font = '600 13px ui-rounded, system-ui';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const name = en.name.length > 26 ? en.name.slice(0, 25) + '…' : en.name;
    const w = ctx.measureText(name).width + 16;
    ctx.fillStyle = st.status === 'stale' ? 'rgba(80,96,108,0.85)' : 'rgba(13,34,48,0.82)';
    roundRect(ctx, -w / 2, 26, w, 22, 11); ctx.fill();
    ctx.fillStyle = '#eaf4f4'; ctx.fillText(name, 0, 37.5);
    ctx.restore();
  };

  CW.drawFog = function (ctx, c, rad, t, alpha) {
    ctx.save();
    const r = CW.rng('fog' + Math.round(c.x) + ':' + Math.round(c.y));
    for (let i = 0; i < 9; i++) {
      const a = r() * 6.28, d = r() * rad * 0.6;
      const x = c.x + Math.cos(a) * d + Math.sin(t * 0.3 + i) * 6;
      const y = c.y + Math.sin(a) * d * 0.6 - rad * 0.15;
      const g = ctx.createRadialGradient(x, y, 0, x, y, rad * (0.45 + r() * 0.3));
      g.addColorStop(0, `rgba(215,226,232,${0.75 * alpha})`);
      g.addColorStop(1, 'rgba(215,226,232,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, rad, 0, 7); ctx.fill();
    }
    ctx.restore();
  };

  CW.drawPlayer = function (ctx, p, dir, t, onBoat, moving) {
    ctx.save();
    ctx.translate(p.x, p.y);
    if (onBoat) {
      ctx.rotate(dir);
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.beginPath(); ctx.ellipse(-26, 0, 22, 9, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#7a4a2f'; ctx.beginPath(); ctx.moveTo(22, 0); ctx.quadraticCurveTo(8, 13, -16, 10);
      ctx.lineTo(-16, -10); ctx.quadraticCurveTo(8, -13, 22, 0); ctx.fill();
      ctx.rotate(-dir);
      ctx.fillStyle = '#fbf6ea'; ctx.beginPath(); ctx.moveTo(0, -38); ctx.lineTo(16, -6); ctx.lineTo(0, -6); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#4a3326'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, -40); ctx.lineTo(0, 0); ctx.stroke();
      ctx.fillStyle = CW.C.lantern; ctx.beginPath(); ctx.moveTo(0, -40); ctx.lineTo(-10, -36); ctx.lineTo(0, -32); ctx.fill();
    } else {
      const step = moving ? Math.sin(t * 14) * 3 : 0;
      ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(0, 12, 13, 5, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#2d3b4a'; ctx.fillRect(-7, 2 + step, 5, 10); ctx.fillRect(2, 2 - step, 5, 10);
      ctx.fillStyle = '#ffc857'; roundRect(ctx, -11, -18, 22, 22, 7); ctx.fill();
      ctx.fillStyle = '#ffe2c6'; ctx.beginPath(); ctx.arc(0, -26, 9, 0, 7); ctx.fill();
      ctx.fillStyle = '#8a5a2b'; ctx.beginPath(); ctx.ellipse(0, -32, 14, 4, 0, 0, 7); ctx.fill(); ctx.fillRect(-7, -40, 14, 8);
      const ex = Math.cos(dir) * 3, ey = Math.sin(dir) * 2;
      ctx.fillStyle = '#222'; ctx.fillRect(-4 + ex, -27 + ey, 2.5, 2.5); ctx.fillRect(2 + ex, -27 + ey, 2.5, 2.5);
    }
    ctx.restore();
  };

  CW.drawPacket = function (ctx, p, t, color, scale) {
    ctx.save();
    ctx.translate(p.x, p.y - 30);
    ctx.scale(scale || 1, scale || 1);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 34);
    g.addColorStop(0, color + 'cc'); g.addColorStop(1, color + '00');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 34, 0, 7); ctx.fill();
    ctx.fillStyle = '#3a2a12'; ctx.fillRect(-2, -18, 4, 6);
    ctx.fillStyle = color; roundRect(ctx, -9, -12, 18, 22, 6); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fillRect(-4, -7, 3, 11);
    ctx.restore();
  };

  CW.drawStamp = function (ctx, p, kind, age) {
    const k = Math.min(1, age * 4);
    const s = 1.6 - 0.6 * CW.ease(k);
    ctx.save();
    ctx.translate(p.x, p.y - 70);
    ctx.scale(s, s);
    ctx.globalAlpha = Math.min(1, k * 1.5);
    const col = kind === 'success' ? CW.C.pass : kind === 'blocked' ? CW.C.block : CW.C.error;
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, 0, 22, 0, 7); ctx.fill();
    ctx.strokeStyle = '#0d2230'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath();
    if (kind === 'success') { ctx.moveTo(-9, 1); ctx.lineTo(-3, 8); ctx.lineTo(10, -7); }
    else if (kind === 'blocked') { ctx.moveTo(-8, -8); ctx.lineTo(8, 8); ctx.moveTo(8, -8); ctx.lineTo(-8, 8); }
    else { ctx.moveTo(0, -10); ctx.lineTo(0, 3); ctx.moveTo(0, 10); ctx.lineTo(0, 10.5); }
    ctx.stroke();
    ctx.restore();
  };

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  CW.roundRect = roundRect;

  // Overworld island (small). st: {n, locked, reveal(0..1), cleared, stars:{got,max}, fog, near, k}
  CW.drawMiniIsland = function (ctx, w, I, t, st) {
    const th = CW.theme(w.theme);
    const k = st.k || 1;
    if (st.locked) {
      // an unknown shore: dark land under cloud, no name
      ctx.save();
      poly(ctx, scaled(I.poly, 1.03, I.c)); ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fill();
      poly(ctx, I.poly); ctx.fillStyle = '#1f4a5e'; ctx.fill();
      ctx.restore();
      CW.drawFog(ctx, I.c, I.r * 1.15, t, 0.75);
      ctx.save(); ctx.translate(I.c.x, I.c.y - 6);
      ctx.fillStyle = 'rgba(13,34,48,0.9)'; ctx.beginPath(); ctx.arc(0, 0, 30, 0, 7); ctx.fill();
      ctx.strokeStyle = '#d7e2e8'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, -6, 9, Math.PI, 0); ctx.stroke();
      ctx.fillStyle = '#d7e2e8'; roundRect(ctx, -12, -6, 24, 19, 4); ctx.fill();
      ctx.restore();
    } else {
      CW.drawIsland(ctx, I.poly, th, t, I.c);
      const r = CW.rng('mini' + w.id);
      (w.entities || []).slice(0, 14).forEach((en) => {
        const a = r() * 6.28, d = r() * I.r * 0.62;
        const x = I.c.x + Math.cos(a) * d * 1.2, y = I.c.y + Math.sin(a) * d * 0.8;
        ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(x - 6, y + 2, 14, 5);
        ctx.fillStyle = CW.KIND[en.kind]?.color || '#fff'; ctx.fillRect(x - 7, y - 9, 14, 12);
      });
      if (st.fog && st.fog !== 'drifted') CW.drawFog(ctx, I.c, I.r * 1.1, t, 0.85);
      if (st.reveal < 1) CW.drawFog(ctx, I.c, I.r * 1.15, t, 1 - st.reveal);
      if (st.cleared) {
        ctx.save(); ctx.translate(I.c.x + I.r * 0.9, I.c.y - I.r * 0.75); ctx.scale(k, k);
        ctx.fillStyle = CW.C.pass; ctx.beginPath(); ctx.arc(0, 0, 17, 0, 7); ctx.fill();
        ctx.strokeStyle = '#0d2230'; ctx.lineWidth = 4; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-7, 1); ctx.lineTo(-2, 6); ctx.lineTo(8, -6); ctx.stroke(); ctx.restore();
      }
    }
    // number plate
    ctx.save(); ctx.translate(I.c.x - I.r * 0.95, I.c.y - I.r * 0.8); ctx.scale(k, k);
    ctx.fillStyle = st.locked ? '#35596b' : CW.C.lantern; ctx.beginPath(); ctx.arc(0, 0, 19, 0, 7); ctx.fill();
    ctx.fillStyle = st.locked ? '#d7e2e8' : '#2a1d00'; ctx.font = '800 19px ui-rounded, system-ui';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(st.n), 0, 1); ctx.restore();
    // banner
    ctx.save();
    const title = st.locked ? 'Locked' : w.name;
    ctx.font = `800 ${Math.round(19 * k)}px ui-rounded, system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const bw = ctx.measureText(title).width + 30 * k;
    const by = I.c.y + I.r + 32 * k;
    ctx.fillStyle = st.near && !st.locked ? '#ffc857' : 'rgba(13,34,48,0.9)';
    roundRect(ctx, I.c.x - bw / 2, by - 16 * k, bw, 32 * k, 16 * k); ctx.fill();
    ctx.fillStyle = st.near && !st.locked ? '#2a1d00' : st.locked ? '#9dbac6' : '#eaf4f4';
    ctx.fillText(title, I.c.x, by);

  G.award = function (amount, why) {
    if (!amount) return;
    const before = G.level();
    G.state.xp += amount;
    CW.ui.toast(`+${amount} XP · ${why}`, 'xp');
    if (G.level() > before) CW.ui.toast(`Level ${G.level()} — you are now a ${G.title()}`, 'level');
    G.checkBadges();
    G.save();
    CW.ui.updateHUD();
  };
  G.count = (k) => { G.state.counters[k] = (G.state.counters[k] || 0) + 1; };

  const BADGES = [
    { id: 'landfall', name: 'First delivery', desc: 'Carry your first case to its end', test: (s) => Object.keys(s.missions).length >= 1 },
    { id: 'flawless', name: 'Flawless', desc: 'Finish 5 missions without a wrong turn',
      test: (s) => Object.values(s.missions).filter((v) => v === 3).length >= 5 },
    { id: 'cartographer', name: 'Journey complete', desc: 'Clear every world', test: () => G.W.worlds.every((w) => G.worldCleared(w)) },
    { id: 'gatekeeper', name: 'Gatekeeper', desc: 'Inspect every guardrail in the codebase',
      test: (s) => G.W.worlds.every((w) => w.entities.filter((e) => e.kind === 'guardrail').every((e) => s.visited[w.id]?.[e.id])) },
    { id: 'bug-hunter', name: 'Bug hunter', desc: 'Find 3 hidden cracks',
      test: (s) => Object.values(s.cracks).reduce((a, o) => a + Object.keys(o).length, 0) >= 3 },
    { id: 'what-if', name: 'What if…', desc: 'Inject your own case into a flow', test: (s) => (s.counters.sim || 0) >= 1 },
    { id: 'saboteur', name: 'Saboteur', desc: 'Change a flow and watch it break', test: (s) => (s.counters.breaks || 0) >= 1 },
    { id: 'referee', name: 'Referee', desc: 'Win a challenge against the code', test: (s) => (s.counters.challengeHit || 0) >= 1 },
    { id: 'scribe', name: 'Scribe', desc: 'Write 5 notes', test: (s) => s.notes.length >= 5 },
    { id: 'quartermaster', name: 'Quartermaster', desc: 'Turn 3 notes into tasks', test: (s) => s.tasks.length >= 3 },
  ];
  G.badgeList = () => BADGES.concat(G.W.worlds.map((w) => ({
    id: 'master:' + w.id, name: 'Master of ' + w.name, desc: 'Reach 100% in ' + w.name, test: () => G.mastery(w) >= 0.999 })));
  // Award any badge whose test now passes. A world-mastery badge also gives XP.
  G.checkBadges = function () {
    for (const b of G.badgeList()) {
      if (!G.state.badges[b.id] && b.test(G.state)) {
        G.state.badges[b.id] = new Date().toISOString();
        CW.ui.toast(`Badge earned: ${b.name}`, 'badge');
        if (b.id.startsWith('master:')) { G.state.xp += XP.mastery; CW.ui.toast(`+${XP.mastery} XP · world mastered`, 'xp'); }
      }
    }
  };

  // progress events
  G.markVisit = function (en) {
    const v = bag(G.state.visited, G.wid);
    if (!v[en.id]) { v[en.id] = 1; G.award(XP.visit, 'discovered ' + en.name); G.completeQuests('visit', en.id); }
  };
  G.markTraced = function (flow) {
    const v = bag(G.state.traced, G.wid);
    if (!v[flow.id]) { v[flow.id] = 1; G.award(XP.trace, 'traced ' + flow.name); }
    G.completeQuests('trace', flow.id);
  };
  // Tick off every open quest of this type that points at `target` (a building id or flow id).
  G.completeQuests = function (type, target) {
    const w = G.world();
    for (const q of w.quests || []) {
      if (q.type === type && q.target === target && !G.state.quests[w.id]?.[q.id]) {
        bag(G.state.quests, w.id)[q.id] = 1;
        G.award(q.xp || 10, 'quest: ' + q.title);
      }
    }
    CW.ui.refreshQuests();
  };

  // ---------- scenes ----------
  G.layout = function (wid) {
    if (!G.layouts[wid]) G.layouts[wid] = CW.layoutWorld(G.worldById(wid));
    return G.layouts[wid];
  };
  G.lockHint = function (w) {
    const prev = G.W.worlds[G.worldIndex(w.id) - 1];
    return prev ? `Clear ${prev.name} first` : '';
  };
  // Enter a world from the overworld. A locked one asks first: jump in anyway, or keep the order.
  G.land = function (wid) {
    const target = G.worldById(wid);
    if (!G.unlocked(target)) { CW.ui.askOpen(target); return; }
    G.mission = null; G.lab = false;
    G.scene = 'world'; G.wid = wid; G.L = G.layout(wid);
    G.player.x = G.L.dock.x + 30; G.player.y = G.L.dock.y; G.player.target = null; G.player.dir = 0;
    // establishing shot: open on the whole island, then ease in to the player
    const b = G.L.bounds;
    G.cam.x = 0; G.cam.y = 0;
    G.cam.z = Math.min(G.W_ / b.w, G.H_ / b.h) * 0.95; G.selected = null; G.packet = null; G.flowSel = null;
    if (!G.state.landed[wid]) { G.state.landed[wid] = new Date().toISOString(); G.award(XP.land, 'landed on ' + G.world().name); }
    CW.ui.onScene();
  };
  // Leave the world and go back to the overworld, next to the island just left.
  G.setSail = function () {
    const from = G.wid;
    G.scene = 'over'; G.L = null; G.packet = null; G.flowSel = null; G.selected = null; G.mission = null; G.lab = false;
    const I = from && G.OW.isl[from];
    if (I) { G.player.x = I.c.x; G.player.y = I.c.y + I.r + 95; }
    else { G.player.x = G.OW.start.x; G.player.y = G.OW.start.y; }
    G.player.target = null; G.wid = null;
    CW.ui.onScene();
  };

  // ---------- packets (animated flow runs) ----------
  G.stepById = (flow, id) => flow.steps.find((s) => s.id === id);
  G.startPacket = function (flow, opts) {
    // opts: {path, outcome, outcomeKind, narration[], label, source:'case'|'ai'|'manual', explain, caseId, stepMode}
    const path = (opts.path || [flow.start]).filter((id) => G.stepById(flow, id));
    if (!path.length) path.push(flow.start);
    G.flowSel = flow.id;
    G.packet = {
      flow, path, i: 0, t: 0, phase: 'arrive', hold: 0,
      outcome: opts.outcome, outcomeKind: opts.outcomeKind, narration: opts.narration || [], explain: opts.explain || '',
      source: opts.source || 'case', label: opts.label || '', caseId: opts.caseId, stepMode: !!opts.stepMode,
      manual: opts.source === 'manual', done: false, doneAge: 0, meta: opts.meta || null,
    };
    CW.ui.onPacket();
  };
  G.stopPacket = function () { G.packet = null; CW.ui.onPacket(); };
  // Step mode: let the packet move on from the step it is waiting at.
  G.nextStep = function () { if (G.packet && G.packet.phase === 'hold') G.packet.advance = true; };
  // Manual walk: the player picked the next step, or an ending (`outcome:<id>`).
  G.chooseBranch = function (to) {
    const P = G.packet; if (!P || !P.manual) return;
    if (to.startsWith('outcome:')) {
      const o = P.flow.outcomes.find((x) => x.id === to.slice(8));
      P.outcome = o?.id; P.outcomeKind = o?.kind || 'success';
      P.phase = 'end'; P.done = true; P.doneAge = 0; finishPacket(P);
    } else { P.path.push(to); P.advance = true; }
    CW.ui.onPacket();
  };

  // The packet reached its ending: award the first run of a case and mark the flow as traced.
  function finishPacket(P) {
    const outcome = P.flow.outcomes.find((o) => o.id === P.outcome);
    if (!P.outcomeKind) P.outcomeKind = outcome?.kind || 'success';
    if (P.source === 'case' && P.caseId) {
      const k = `${G.wid}/${P.flow.id}/${P.caseId}`;
      if (!G.state.cases[k]) { G.state.cases[k] = 1; G.award(XP.caseRun, 'ran case ' + P.label); }
    }
    if (P.source !== 'ai' || P.path.length > 1) G.markTraced(P.flow);
    CW.ui.onPacket();
  }

  function stepPos(P, idx) {
    const s = G.stepById(P.flow, P.path[idx]);
    return (s && G.L.pos[s.at]) || G.L.dock;
  }
  function roadBetween(a, b) {
    const key = a < b ? a + '|' + b : b + '|' + a;
    return G.L.roads.find((r) => r.key === key);
  }
  // Where the packet is right now, in world coordinates (it rides the road curve while moving).
  G.packetPos = function () {
    const P = G.packet; if (!P) return null;
    if (P.phase !== 'move') return stepPos(P, P.i);
    const s0 = G.stepById(P.flow, P.path[P.i - 1]), s1 = G.stepById(P.flow, P.path[P.i]);
    const a = G.L.pos[s0.at], b = G.L.pos[s1.at];
    if (!a || !b) return b || a || G.L.dock;
    const k = CW.ease(Math.min(1, P.t));
    if (s0.at === s1.at) return { x: a.x, y: a.y - Math.sin(k * Math.PI) * 50 };
    const road = roadBetween(s0.at, s1.at);
    const ctrl = road ? road.ctrl : CW.curveCtrl(a, b, 40);
    return CW.qpoint(a, ctrl, b, k);
  };

  // Packet state machine: arrive -> hold (show the step) -> move (to the next step) -> … -> end.
  function tickPacket(dt) {
    const P = G.packet; if (!P || P.done) { if (P) P.doneAge += dt; return; }
    const speed = CW.ui.speed();
    if (P.phase === 'arrive') { P.phase = 'hold'; P.hold = 0; CW.ui.onPacket(); return; }
    if (P.phase === 'hold') {
      P.hold += dt * speed;
      const holdFor = P.stepMode || P.manual ? Infinity : 2.3;
      if (P.hold < holdFor && !P.advance) return;
      P.advance = false;
      if (P.i + 1 < P.path.length) { P.i++; P.phase = 'move'; P.t = 0; CW.ui.onPacket(); }
      else if (!P.manual) { P.phase = 'end'; P.done = true; P.doneAge = 0; finishPacket(P); }
      return;
    }
    if (P.phase === 'move') {
      const a = stepPos(P, P.i - 1), b = stepPos(P, P.i);
      const len = Math.max(120, CW.dist(a, b));
      P.t += (dt * speed * 420) / len;
      if (P.t >= 1) { P.phase = 'arrive'; }
    }
  }
  G.activeStep = function () {
    const P = G.packet; if (!P) return null;
    return G.stepById(P.flow, P.path[P.i]);
  };

  // ---------- input ----------
  G.toWorld = function (sx, sy) {
    return { x: (sx - G.W_ / 2) / G.cam.z + G.cam.x, y: (sy - G.H_ / 2) / G.cam.z + G.cam.y };
  };
  G.toScreen = function (p) {
    return { x: (p.x - G.cam.x) * G.cam.z + G.W_ / 2, y: (p.y - G.cam.y) * G.cam.z + G.H_ / 2 };
  };
  // A click on the canvas: pick an island, a road sign or a building, otherwise walk there.
  G.click = function (sx, sy) {
    const p = G.toWorld(sx, sy);
    if (G.scene === 'over') {
      for (const w of G.W.worlds) {
        const I = G.OW.isl[w.id];
        if (CW.pointInPoly(p, I.poly) || CW.dist(p, { x: I.c.x, y: I.c.y + I.r + 30 }) < 60) {
          if (!G.unlocked(w)) { CW.ui.askOpen(w); return; }
          G.player.target = { x: I.c.x, y: I.c.y, land: w.id }; return;
        }
      }
      G.player.target = p;
      return;
    }
    if (G.mission) {
      if (G.mission.phase === 'travel') return;
      if (G.mission.phase === 'choose') {
        const k = G.mission.signs.findIndex((sg) => !sg.dead && CW.dist(p, { x: sg.x, y: sg.y - 25 }) < 46);
        if (k >= 0) { CW.mission.choose(k); return; }
      }
    }
    let best = null, bd = 70;
    for (const en of G.world().entities) {
      const q = G.L.pos[en.id]; if (!q || !G.isSeen(G.wid, en.id)) continue;
      const d = Math.min(CW.dist(p, q), CW.dist(p, { x: q.x, y: q.y - 25 }));
      if (d < bd) { bd = d; best = en; }
    }
    if (best) {
      G.selected = best.id;
      CW.ui.openEntity(best);
      const q = G.L.pos[best.id];
      G.player.target = { x: q.x - 60, y: q.y + 40 };
      return;
    }
    G.player.target = p;
  };
  G.interact = function () {
    if (!G.near) return;
    if (G.scene === 'over') G.land(G.near.id);
    else if (G.mission && G.mission.phase === 'travel') return;
    else { G.selected = G.near.id; CW.ui.openEntity(G.near); }
  };

  // Move the player from the keys or towards the click target; stay on the island, or off islands at sea.
  function moveTick(dt) {
    const pl = G.player;
    if (G.mission && G.mission.phase === 'travel') return;
    let dx = 0, dy = 0;
    const k = G.keys;
    if (k.ArrowLeft || k.a) dx -= 1;
    if (k.ArrowRight || k.d) dx += 1;
    if (k.ArrowUp || k.w) dy -= 1;
    if (k.ArrowDown || k.s) dy += 1;
    if (dx || dy) pl.target = null;
    if (!dx && !dy && pl.target) {
      const tx = pl.target.x - pl.x, ty = pl.target.y - pl.y, d = Math.hypot(tx, ty);
      if (d < 8) {
        if (pl.target.land) { const id = pl.target.land; pl.target = null; G.land(id); return; }
        pl.target = null;
      } else { dx = tx / d; dy = ty / d; }
    }
    const len = Math.hypot(dx, dy);
    pl.moving = len > 0;
    if (!len) return;
    dx /= len; dy /= len;
    pl.dir = Math.atan2(dy, dx);
    const sp = (G.scene === 'over' ? 470 : 340) * dt;
    const nx = pl.x + dx * sp, ny = pl.y + dy * sp;
    if (G.scene === 'world') {
      const inside = (x, y) => CW.pointInPoly({ x, y }, G.L.poly);
      if (inside(nx, ny)) { pl.x = nx; pl.y = ny; }
      else if (inside(nx, pl.y)) pl.x = nx;
      else if (inside(pl.x, ny)) pl.y = ny;
      else if (pl.target) pl.target = null;
    } else {
      const blocked = G.W.worlds.some((w) => CW.pointInPoly({ x: nx, y: ny }, G.OW.isl[w.id].poly));
      if (blocked) {
        const tgt = pl.target?.land;
        const hit = G.W.worlds.find((w) => CW.pointInPoly({ x: nx, y: ny }, G.OW.isl[w.id].poly));
        if (tgt && hit && hit.id === tgt) { pl.target = null; G.land(tgt); return; }
        pl.target = null;
        return;
      }
      const b = G.OW.bounds;
      pl.x = CW.clamp(nx, b.x, b.x + b.w); pl.y = CW.clamp(ny, b.y, b.y + b.h);
    }
  }

  // Find what the player stands next to (for the E hint) and reveal buildings that come into range.
  function nearTick() {
    const pl = G.player;
    let near = null;
    if (G.scene === 'over') {
      let bd = Infinity;
      for (const w of G.W.worlds) {
        const I = G.OW.isl[w.id];
        const d = CW.dist(pl, I.c) - I.r * 1.25;
        if (d < 110 && d < bd) { bd = d; near = w; }
      }
    } else {
      let bd = 95;
      for (const en of G.world().entities) {
        const q = G.L.pos[en.id]; if (!q) continue;
        const d = CW.dist(pl, q);
        if (d < 175 && !G.isSeen(G.wid, en.id)) { G.reveal(en.id); CW.sfx('step'); }
        if (d < bd && G.isSeen(G.wid, en.id)) { bd = d; near = en; }
      }
    }
    if (near !== G.near) { G.near = near; CW.ui.showHint(near); }
  }

  // Ease the camera and zoom towards the player, or the packet when "Camera follows" is on.
  function camTick(dt) {
    let target = G.player;
    if (G.packet && CW.ui.followPacket()) target = G.packetPos() || target;
    if (G.scene === 'over') {
      // if the whole journey fits, hold it still; on a small screen follow the boat
      const b = G.OW.bounds;
      const follow = Math.min(G.W_ / b.w, (G.H_ - 90) / b.h) < 0.3 ? 0.9 : 0.1;
      target = { x: G.player.x * follow, y: G.player.y * follow - 24 / G.cam.z };
    }
    const lead = G.scene === 'world' && !G.packet ? 0 : 0;
    const k = 1 - Math.pow(0.0025, dt);
    G.cam.x = CW.lerp(G.cam.x, target.x + lead, k);
    G.cam.y = CW.lerp(G.cam.y, target.y, k);
    let zt = G.baseZoom * G.zoomMul * 0.9;
    if (G.scene === 'world' && G.L) {
      const b = G.L.bounds;
      zt = CW.clamp(Math.min(G.W_ / b.w, G.H_ / b.h) * 1.9, 0.52, 0.95) * G.zoomMul;
    }
    if (G.scene === 'over') {
      const b = G.OW.bounds;
      const fit = Math.min(G.W_ / b.w, (G.H_ - 90) / b.h);
      zt = CW.clamp(fit, 0.3, 0.7) * G.zoomMul;
    }
    G.cam.z = CW.lerp(G.cam.z, zt, 1 - Math.pow(0.001, dt));
  }

  // ---------- render ----------
  function render() {
    const ctx = G.ctx, t = G.t;
    ctx.setTransform(G.dpr, 0, 0, G.dpr, 0, 0);
    ctx.clearRect(0, 0, G.W_, G.H_);
    const z = G.cam.z;
    const sh = G.shake > 0 ? G.shake * 22 : 0;
    const sx = sh ? (Math.random() - 0.5) * sh : 0, sy = sh ? (Math.random() - 0.5) * sh : 0;
    ctx.setTransform(G.dpr * z, 0, 0, G.dpr * z, G.dpr * (G.W_ / 2 - G.cam.x * z + sx), G.dpr * (G.H_ / 2 - G.cam.y * z + sy));
    const view = { x: G.cam.x - G.W_ / 2 / z, y: G.cam.y - G.H_ / 2 / z, w: G.W_ / z, h: G.H_ / z };
    CW.drawSea(ctx, view, t);
    if (G.scene === 'over') renderOver(ctx, t);
    else renderWorld(ctx, t);
  }

  function renderOver(ctx, t) {
    const ws = G.W.worlds;
    const k = Math.max(1, 0.5 / G.cam.z);
    for (const r of G.OW.route) {
      const a = G.OW.isl[r.from].c, b = G.OW.isl[r.to].c;
      const open = G.unlocked(G.worldById(r.to));
      CW.drawRoute(ctx, a, r.ctrl, b, t, open);
      const m = CW.qpoint(a, r.ctrl, b, 0.5);
      if (open && r.label && CW.dist(G.player, m) < 260) {
        ctx.save(); ctx.font = `600 ${Math.round(14 * k)}px ui-rounded, system-ui`; ctx.textAlign = 'center';
        const tw = Math.min(ctx.measureText(r.label).width, 520 * k) + 22 * k;
        ctx.fillStyle = 'rgba(13,34,48,0.88)'; CW.roundRect(ctx, m.x - tw / 2, m.y - 16 * k, tw, 30 * k, 15 * k); ctx.fill();
        ctx.fillStyle = '#d7e6ea'; ctx.fillText(r.label, m.x, m.y + 4 * k, 520 * k); ctx.restore();
      }
    }
    ws.forEach((w, i) => {
      const st = G.worldStatus(w.id);
      const locked = !G.unlocked(w);
      let reveal = 1;
      if (G.unlockFx && G.unlockFx.wid === w.id) reveal = Math.min(1, (G.t - G.unlockFx.t) / 2.5);
      CW.drawMiniIsland(ctx, w, G.OW.isl[w.id], t, {
        n: i + 1, locked, reveal, cleared: !locked && G.worldCleared(w), stars: G.worldStars(w), lockHint: locked ? G.lockHint(w) : '',
        fog: st === 'synced' ? null : st, near: G.near?.id === w.id, k,
      });
    });
    CW.drawPlayer(ctx, G.player, G.player.dir, t, true, G.player.moving);
    CW.guide.draw(ctx, t);
    CW.fx.draw(ctx);
  }

  function renderWorld(ctx, t) {
    const w = G.world(), L = G.L, th = CW.theme(w.theme);
    CW.drawIsland(ctx, L.poly, th, t);
    // dock
    ctx.save(); ctx.fillStyle = '#8a5a3b'; ctx.fillRect(L.dock.x - 130, L.dock.y - 14, 120, 28);
    ctx.fillStyle = '#6b4329'; for (let i = 0; i < 6; i++) ctx.fillRect(L.dock.x - 128 + i * 20, L.dock.y - 14, 3, 28); ctx.restore();
    for (const d of L.deco) CW.drawDeco(ctx, d, th);
    // district labels
    ctx.save(); ctx.font = '700 15px ui-rounded, system-ui'; ctx.textAlign = 'center';
    for (const lb of L.labels) { ctx.fillStyle = 'rgba(13,34,48,0.55)'; ctx.fillText(lb.name, lb.x, lb.y); }
    ctx.restore();
    const flow = G.flowSel ? G.flow(G.flowSel) : null;
    const inFlow = new Set(flow ? flow.steps.map((s) => s.at) : []);
    for (const r of L.roads) {
      if (!G.isSeen(w.id, r.a) || !G.isSeen(w.id, r.b)) continue;
      const hi = flow && r.flows.has(flow.id);
      CW.drawRoad(ctx, L.pos[r.a], r.ctrl, L.pos[r.b], th, { hi, dim: flow && !hi, t });
    }
    CW.mission.drawUnder(ctx, t, th);
    const act = G.activeStep() || CW.mission.currentStep();
    const badges = {};
    if (flow) flow.steps.forEach((s, i) => { if (!(s.at in badges)) badges[s.at] = String(i + 1); });
    const cracks = w.cracks || [];
    const order = w.entities.slice().sort((a, b) => (L.pos[a.id]?.y || 0) - (L.pos[b.id]?.y || 0));
    for (const en of order) {
      const p = L.pos[en.id]; if (!p) continue;
      if (!G.isSeen(w.id, en.id)) { CW.drawHidden(ctx, p, t); continue; }
      const status = G.entityStatus(w.id, en.id);
      const crack = cracks.some((k) => k.at === en.id && !G.state.cracks[w.id]?.[k.id]) && CW.dist(G.player, p) < 260;
      CW.drawEntity(ctx, en, p, t, {
        active: act && act.at === en.id, near: G.near?.id === en.id, selected: G.selected === en.id,
        dimmed: flow && !inFlow.has(en.id), visited: G.state.visited[w.id]?.[en.id], status, crack, badge: badges[en.id],
      });
      if (status === 'stale' || status === 'lost') CW.drawFog(ctx, { x: p.x, y: p.y - 10 }, 75, t, 0.9);
    }
    // packet
    const P = G.packet;
    if (P) {

        el('small', { text: hits.length ? 'Describe what goes wrong; your agent finds the logic' : 'No names match. Let your agent find the logic behind it' }))));
    } else if (!hits.length) {
      const why = G.backend.can.find ? 'Type a few more letters.' : 'Open the game from your coding agent to search by meaning.';
      box.append(el('div', { class: 'none', text: 'Nothing on the map has those words. ' + why }));
    }
  }

  // Ask the player's own agent. Late answers for an older query are dropped.
  async function askAgent(q) {
    const mine = ++ticket;
    ai = 'wait'; aiFor = q; paint(q);
    try {
      const r = await G.backend.find(q.trim());
      if (mine !== ticket) return;
      ai = { results: r.results || [], note: r.note || '' };
    } catch (e) {
      if (mine !== ticket) return;
      ai = { error: e.message || String(e) };
    }
    cursor = hits.length;
    if ($('#search').value === q) paint(q);
  }
  U.findByMeaning = askAgent; // for tests

  function close() {
    const inp = $('#search');
    inp.value = ''; hits = []; ai = null; ticket++; $('#search-results').hidden = true; inp.blur(); $('#stage').focus();
  }

  // Go to a search result: open its world if needed, land there, and put the player on the thing itself.
  function go(it) {
    close();
    G.jump({ wid: it.wid, entityId: it.type === 'entity' ? it.id : null, flowId: it.type === 'flow' ? it.id : null });
  }

  // The one way to go straight to a piece of logic. Opens the world for good (see G.openWorld).
  G.jump = function ({ wid, entityId, flowId }) {
    const w = G.worldById(wid);
    if (!w) return;
    if (G.mission) CW.mission.quit();
    const wasLocked = !G.unlocked(w);
    const first = G.openWorld(wid);
    if (wasLocked) U.toast(`Opened ${w.name}. Its missions still count for stars.`);
    if (G.scene !== 'world' || G.wid !== wid) G.land(wid);
    else if (first) { shared.renderDock(); U.updateHUD(); }
    const stand = (eid) => { const q = G.L.pos[eid]; if (q) { G.player.x = q.x; G.player.y = q.y + 56; G.player.target = null; } };
    if (entityId) {
      const en = w.entities.find((e) => e.id === entityId);
      if (!en) return;
      stand(en.id); G.selected = en.id; U.openEntity(en);
    } else if (flowId) {
      const f = w.flows.find((x) => x.id === flowId);
      if (!f) return;
      const start = G.stepById(f, f.start);
      if (start) stand(start.at);
      G.lab = true; shared.selectFlow(f.id); CW.guide.update();
    }
    U.updateHUD();
  };

  // A locked island was picked: say what the order is for, and let the player skip it.
  U.askOpen = async function (w) {
    CW.sfx('step');
    const yes = await shared.confirmBox(
      `${w.name} is still locked`,
      `${G.lockHint(w)} to unlock it the usual way. Stuck on something in here? You can jump in now: `
        + 'the fog lifts, the lab opens, and its missions still count for stars later.',
      'Jump in');
    if (yes) G.jump({ wid: w.id });
  };

  U.focusSearch = function () { const i = $('#search'); i.focus(); i.select(); };

  const init = U.init;
  U.init = function () {
    init();
    const inp = $('#search');
    inp.addEventListener('input', () => { hits = search(inp.value); cursor = 0; if (inp.value !== aiFor) { ai = null; ticket++; } paint(inp.value); });
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        const n = rows(inp.value).length;
        if (n) { cursor = (cursor + (e.key === 'ArrowDown' ? 1 : n - 1)) % n; paint(inp.value); }
      } else if (e.key === 'Enter') {
        e.preventDefault();
        const pick = rows(inp.value)[cursor];
        if (pick && pick.ask) askAgent(inp.value);
        else if (pick) go(pick);
      }
      else if (e.key === 'Escape') { e.stopPropagation(); close(); }
    });
    inp.addEventListener('blur', () => setTimeout(() => { if (document.activeElement !== inp && ai !== 'wait') $('#search-results').hidden = true; }, 150));
    inp.addEventListener('focus', () => { if (inp.value.trim()) { hits = search(inp.value); paint(inp.value); } });
  };
})(window.CW);

;
/* CodeQuest — boot: pick a backend, load the world, start the engine, show the intro.
   Loads last. Must not hold game logic — it only calls the other modules in order. */
(function (CW) {
  'use strict';
  const G = CW.game;
  async function boot() {
    const bootEl = CW.$('#boot');
    try {
      CW.ui.init();
      G.backend = await CW.pickBackend();
      const data = await G.backend.getWorld();
      G.load(data);
      G.start(CW.$('#stage'));
      CW.ui.onScene();
      bootEl.remove();
      CW.ui.intro();
      if (G.sync) {
        const fog = Object.values(G.sync.worlds).filter((w) => w.status === 'stale' || w.status === 'lost').length;
        if (fog) CW.ui.toast(`${fog} world${fog > 1 ? 's' : ''} changed since mapping — click the sync chip`, 'err');
        // look for new commits on the remote in the background
        G.backend.refresh({ fetch: true }).then((s) => {
          G.sync = s; CW.ui.updateHUD();
          if (s.remote?.behind) {
            CW.ui.toast(`${s.remote.behind} new commit${s.remote.behind > 1 ? 's' : ''} on ${s.remote.upstream} — open the sync chip to pull`);
          }
        }).catch(() => {});
      }
      CW.watchForClaude((b) => {
        G.backend = b; CW.ui.onBackendChange();
        CW.ui.toast('Claude is here — ask, challenge and simulate are on');
      });
      window.__codequest = G; // handy for debugging and tests
    } catch (e) {
      bootEl.classList.add('err');
      bootEl.textContent = 'Could not load the world: ' + (e.message || e);
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window.CW);

</script>
